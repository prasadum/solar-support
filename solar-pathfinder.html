<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Solar Pathfinder Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&display=swap">
<style>
/* Layout: instrument-panel header + site strip, sticky section rail, one wide working panel per section (each section works as a projector slide) */
:root{
  --bg:#EDF2F5; --surface:#FFFFFF; --ink:#12212C; --muted:#4D5F6D; --line:#C3D0D9; --chip:#E1EAF0;
  --accent:#0A6A8A; --sun:#D27F00; --sunsoft:#FFE6B0; --sky:#D6E7F2; --obst:#3B4CA6; --ok:#1C7548; --bad:#B42318; --glass:#FFFFFF;
  --f-display:"Barlow Condensed","Noto Sans Devanagari","Noto Sans Malayalam","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans","Noto Sans Devanagari","Noto Sans Malayalam",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans Devanagari","Noto Sans Malayalam",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="hc"]){
    --bg:#0E151B; --surface:#16212A; --ink:#E4ECF1; --muted:#9BAAB6; --line:#2C3B47; --chip:#1E2C37;
    --accent:#4DB6D8; --sun:#FFB21F; --sunsoft:#47330E; --sky:#132B3C; --obst:#8D9DFF; --ok:#4CC98A; --bad:#FF6B5E; --glass:#BFE3FF; color-scheme:dark }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16212A; --ink:#E4ECF1; --muted:#9BAAB6; --line:#2C3B47; --chip:#1E2C37;
  --accent:#4DB6D8; --sun:#FFB21F; --sunsoft:#47330E; --sky:#132B3C; --obst:#8D9DFF; --ok:#4CC98A; --bad:#FF6B5E; --glass:#BFE3FF; color-scheme:dark }
:root[data-theme="hc"]{
  --bg:#000000; --surface:#000000; --ink:#FFFFFF; --muted:#F2F2F2; --line:#FFFFFF; --chip:#1A1A1A;
  --accent:#FFE500; --sun:#FFE500; --sunsoft:#3A3300; --sky:#001A33; --obst:#00E5FF; --ok:#00FF6A; --bad:#FF5A5A; --glass:#FFFFFF; color-scheme:dark }

*{box-sizing:border-box}
html{font-size:18px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2rem;letter-spacing:.01em}
h2{font-size:1.9rem}
h3{font-size:1.3rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:.8rem 1.5rem;align-items:center;justify-content:space-between;padding-block:1rem .6rem}
.brand{display:flex;gap:.8rem;align-items:center;min-width:0}
.brand svg{flex:none;width:3rem;height:3rem}
.brand small{display:block;color:var(--muted);font-size:.8rem;letter-spacing:.02em}
.ctrls{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center}
.ctl{display:flex;align-items:center;gap:.35rem}
.ctl > span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:.3rem .65rem;font-size:.85rem;min-height:2.1rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.fsval{font-family:var(--f-mono);font-size:.8rem;min-width:2.6rem;text-align:center}

/* site strip */
.site{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;margin-bottom:.8rem}
.fld{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.fld label{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.fld input,.fld select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.3rem .5rem;width:7.5rem;font-family:var(--f-mono);font-size:.9rem}
.fld.wide input{width:11rem;font-family:var(--f-body)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.4rem .8rem;font-size:.9rem;min-height:2.3rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.btn:hover{border-color:var(--accent)}
.site .note{flex:1 1 16rem;font-size:.8rem;color:var(--muted)}

/* nav */
nav.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:.4rem;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:1.2rem}
nav.rail ol{display:flex;gap:.25rem;list-style:none;margin:0;padding:0;min-width:max-content}
nav.rail button{border:0;background:transparent;padding:.5rem .85rem;border-radius:8px 8px 0 0;font-size:.95rem;color:var(--muted);display:flex;gap:.45rem;align-items:baseline}
nav.rail button b{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
nav.rail button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -3px 0 var(--sun);font-weight:600}

section.panel{display:none}
section.panel.on{display:block;animation:rise .35s ease}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.lead{max-width:65ch;font-size:1.1rem;color:var(--ink);margin-top:.6rem}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.4rem;align-items:start;margin-top:1.2rem}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;min-width:0}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem;min-width:0}
.fig svg{display:block;width:100%;height:auto}
.cap{font-size:.85rem;color:var(--muted);margin-top:.4rem;padding-inline:.3rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin-bottom:.3rem}

/* analogies */
.analog{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem;margin-top:1.4rem}
.analog .card h3{margin-bottom:.35rem}
.analog .card p{font-size:.95rem}
.ico{width:2.6rem;height:2.6rem;margin-bottom:.4rem}
ul.ticks{list-style:none;padding:0;margin:.5rem 0 0;display:grid;gap:.45rem}
ul.ticks li{padding-left:1.4rem;position:relative}
ul.ticks li::before{content:"";position:absolute;left:0;top:.55em;width:.7rem;height:.7rem;border-radius:50%;background:var(--sun)}
.toggle{display:flex;gap:.5rem;align-items:center;font-size:.9rem;margin-top:.5rem;flex-wrap:wrap}
.meter{height:1rem;background:var(--chip);border-radius:6px;overflow:hidden;flex:1 1 10rem;min-width:8rem}
.meter i{display:block;height:100%;background:var(--sun);transition:width .2s}

/* parts */
.plist{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.3rem}
.plist button{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:.35rem .5rem;display:flex;gap:.6rem;align-items:center}
.plist button .n{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:.8rem}
.plist button[aria-pressed="true"]{border-color:var(--sun);background:var(--sunsoft)}
.pdesc{margin-top:.9rem;padding:.8rem;border-left:4px solid var(--sun);background:var(--chip);border-radius:0 8px 8px 0;min-height:5rem}
.hot{cursor:pointer}
.hot circle{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.hot text{fill:var(--bg);font-family:var(--f-mono);font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hot.on circle{fill:var(--sun)}
.hot.on text{fill:#000}
.small{font-size:.82rem;color:var(--muted)}
a{color:var(--accent)}

/* diagram */
.ol{margin:.6rem 0 0;padding-left:1.2rem;display:grid;gap:.5rem}
.callout{margin-top:1rem;border:2px solid var(--sun);border-radius:10px;padding:.8rem 1rem;background:var(--sunsoft)}
.callout h3{font-size:1.15rem;margin-bottom:.25rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* chart svg classes */
.c-sky{fill:var(--sky)}
.c-edge{fill:none;stroke:var(--ink);stroke-width:2}
.c-ring{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 5;opacity:.6}
.c-tick{stroke:var(--muted);stroke-width:1}
.c-dir{fill:var(--ink);font-family:var(--f-display);font-size:30px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.c-deg{fill:var(--muted);font-family:var(--f-mono);font-size:13px;text-anchor:middle;dominant-baseline:central}
.c-arc{fill:none;stroke:var(--muted);stroke-width:1.6}
.c-arc.sel{stroke:var(--sun);stroke-width:5}
.c-hr{fill:none;stroke:var(--muted);stroke-width:1;opacity:.55}
.c-hrl{fill:var(--muted);font-family:var(--f-mono);font-size:13px;text-anchor:middle;dominant-baseline:central}
.c-ml{fill:var(--ink);font-family:var(--f-body);font-size:13px;dominant-baseline:central;paint-order:stroke;stroke:var(--sky);stroke-width:4px}
.c-obs{fill:var(--obst);fill-opacity:.42;stroke:var(--obst);stroke-width:2.5;stroke-linejoin:round}
.c-obl{fill:var(--ink);font-family:var(--f-body);font-size:14px;font-weight:600;text-anchor:middle;paint-order:stroke;stroke:var(--sky);stroke-width:4px}
.c-num{fill:var(--ink);font-family:var(--f-mono);font-size:13px;font-weight:600;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--sky);stroke-width:3px}
.c-num.sh{fill:var(--bad);opacity:.85}
.c-sun{fill:var(--sun);stroke:var(--ink);stroke-width:1.5}
.c-sun.sh{fill:var(--muted);stroke:var(--bad);stroke-width:3}
.c-glare{opacity:.3;pointer-events:none}
:root[data-theme="hc"] .c-glare{display:none}

/* simulator */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.5rem;margin-top:.6rem}
.readout div{background:var(--chip);border-radius:8px;padding:.4rem .6rem}
.readout span{display:block;font-size:.72rem;color:var(--muted)}
.readout b{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:.15rem .6rem;border-radius:99px;font-weight:600;font-size:.85rem}
.pill.sun{background:var(--sun);color:#000}
.pill.shade{background:var(--obst);color:var(--bg)}
input[type=range]{width:100%;accent-color:var(--sun)}
.obs{display:grid;gap:.5rem;margin-top:.5rem}
.ob{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(4,minmax(0,1fr)) auto;gap:.35rem;align-items:end;border-bottom:1px solid var(--line);padding-bottom:.45rem}
.ob .fld input,.ob .fld select{width:100%}
@media (max-width:620px){.ob{grid-template-columns:repeat(3,minmax(0,1fr))}.ob .nm{grid-column:1/-1}}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;margin-top:.4rem}
.calc .fld input{width:100%}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.8rem;margin-top:.6rem}
.stats .fld input{width:100%}
.sumline{margin-top:.5rem;font-size:.95rem;padding:.5rem .7rem;background:var(--chip);border-radius:8px}
.b-bar{fill:var(--sun)}
.b-sh{fill:var(--obst);opacity:.5}
.b-lbl{fill:var(--ink);font-family:var(--f-mono);font-size:14px;text-anchor:middle}
.b-m{fill:var(--muted);font-family:var(--f-body);font-size:13px;text-anchor:middle}
.b-sel{fill:none;stroke:var(--ink);stroke-width:2.5}
.b-grid{stroke:var(--line);stroke-width:1}
.bar-g{cursor:pointer}
details.sub{margin-top:.8rem}
details.sub summary{cursor:pointer;font-weight:600}

/* setup */
.steps{display:flex;flex-wrap:wrap;gap:.3rem;margin:.8rem 0}
.steps button{width:2.4rem;height:2.4rem;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:600}
.steps button[aria-current="true"]{background:var(--sun);border-color:var(--sun);color:#000}
.steps button.done{border-color:var(--ok)}
.stage text{font-family:var(--f-body)}
.s-ink{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.s-fill{fill:var(--chip);stroke:var(--ink);stroke-width:2}
.s-t{fill:var(--ink);font-size:16px}
.s-tm{fill:var(--muted);font-size:14px}
.s-sun{fill:var(--sun)}
.s-ok{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round}
.s-bad{fill:none;stroke:var(--bad);stroke-width:5;stroke-linecap:round}
.anim-bubble{animation:bub 3s ease-in-out infinite alternate}
@keyframes bub{0%{transform:translate(38px,-22px)}70%,100%{transform:translate(0,0)}}
.anim-rot{transform-box:fill-box;transform-origin:center;animation:rot 3.5s ease-in-out infinite alternate}
@keyframes rot{0%{transform:rotate(38deg)}75%,100%{transform:rotate(0)}}
.anim-draw{stroke-dasharray:900;animation:draw 4s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:900}70%,100%{stroke-dashoffset:0}}
.anim-pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.anim-ptr{animation:ptr 3s ease-in-out infinite alternate}
@keyframes ptr{0%{transform:translateX(0)}70%,100%{transform:translateX(var(--dx))}}
.anim-eye{animation:eye 3s ease-in-out infinite alternate}
@keyframes eye{0%{transform:translateY(-30px)}100%{transform:translateY(0)}}
.anim-leg{animation:leg 3s ease-in-out infinite alternate}
@keyframes leg{0%{transform:translateY(-14px)}70%,100%{transform:translateY(0)}}
.stepnav{display:flex;gap:.6rem;margin-top:1rem}

/* examples */
.exs{display:grid;gap:1.2rem;margin-top:1rem}
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,16rem);gap:1.2rem;align-items:start}
@media (max-width:780px){.ex{grid-template-columns:minmax(0,1fr)}}
.mgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.25rem;margin-top:.6rem}
.mgrid div{text-align:center;border-radius:6px;padding:.2rem 0;font-size:.8rem;background:var(--chip)}
.mgrid div b{display:block;font-family:var(--f-mono);font-size:.95rem}
.mgrid div.loss{background:var(--obst);color:var(--bg)}
/* true north + placement */
.pt{display:flex;gap:.7rem;align-items:flex-start;padding:.35rem 0}
.pt .n{flex:none;min-width:3.4rem;height:1.9rem;border-radius:99px;background:var(--sun);color:#000;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.pt .n.obx{background:var(--obst);color:var(--bg)}
.pt .n.out{background:transparent;border:2px solid var(--sun);color:var(--ink)}
.anim-wander{animation:wander 5s ease-in-out infinite alternate}
@keyframes wander{to{transform:translate(9px,5px)}}
/* label guide + explainer */
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:.35rem .85rem;font-size:.92rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.lgbody{margin-top:.8rem;padding:.8rem .9rem;border-left:4px solid var(--accent);background:var(--chip);border-radius:0 8px 8px 0}
.lgbody h3{margin-bottom:.3rem}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;margin-top:.6rem}
@media (max-width:760px){.minis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.minis figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.4rem;text-align:center;min-width:0}
.minis figcaption{font-size:.85rem;font-weight:600;margin-top:.2rem}
svg.hlon .g{opacity:.12;transition:opacity .35s}
svg.hl-month .g-mo,svg.hl-hour .g-hr,svg.hl-pct .g-num,svg.hl-pct .g-mo,svg.hl-ring .g-ring,svg.hl-brg .g-brg,svg.hl-lat .g-lat,svg.hl-lat .g-mo{opacity:1;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
svg.hl-hour .c-hr{stroke:var(--accent);stroke-width:2.6;opacity:1}
svg.hl-hour .c-hrl{fill:var(--accent);font-weight:700;font-size:17px}
svg.hl-ring .c-ring{stroke:var(--accent);stroke-width:3;opacity:1}
svg.hl-ring .g-ring .c-deg{fill:var(--accent);font-weight:700;font-size:16px}
svg.hl-month .c-arc{stroke:var(--ink);stroke-width:2.6}
svg.hl-month .c-arc.sel{stroke:var(--sun);stroke-width:6}
svg.hl-brg .c-tick{stroke:var(--accent);stroke-width:2.5}
svg.hl-brg .c-deg{fill:var(--accent);font-weight:700}
.c-latl{fill:var(--ink);font-family:var(--f-display);font-size:24px;font-weight:700}
.c-latb{fill:var(--sunsoft);stroke:var(--sun);stroke-width:2}
.x-grid{fill:none;stroke:var(--line);stroke-width:1.2}
.x-ax{fill:none;stroke:var(--ink);stroke-width:2}
.x-lbl{fill:var(--muted);font-family:var(--f-mono);font-size:13px;text-anchor:middle;dominant-baseline:central}
.x-ttl{fill:var(--accent);font-family:var(--f-body);font-size:15px;font-weight:600}
.x-box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.x-rd{fill:var(--ink);font-family:var(--f-mono);font-size:14px}
.lesson{margin-top:.6rem;padding:.6rem .8rem;border-left:4px solid var(--accent);background:var(--chip);border-radius:0 8px 8px 0}

/* quiz */
.qs{display:grid;gap:1rem;margin-top:1rem;counter-reset:q}
.q h3{font-family:var(--f-body);font-size:1.05rem;font-weight:600;line-height:1.4}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.4rem;margin-top:.5rem}
.opts button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.5rem .7rem}
.opts button.right{border-color:var(--ok);background:var(--ok);color:var(--bg);font-weight:600}
.opts button.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.qex{margin-top:.5rem;font-size:.92rem;color:var(--muted)}
.score{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.kbd{font-size:.78rem;color:var(--muted);margin-top:.6rem}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="28" r="16" fill="var(--sky)" stroke="var(--ink)" stroke-width="2"/><path d="M8 28a16 16 0 0 1 32 0" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M12 28c3-9 21-9 24 0" fill="none" stroke="var(--sun)" stroke-width="3"/><circle cx="31" cy="21.5" r="3.5" fill="var(--sun)"/><rect x="6" y="40" width="36" height="4" rx="2" fill="var(--ink)"/></svg>
      <div><h1 data-i="title"></h1><small data-i="sub"></small></div>
    </div>
    <div class="ctrls">
      <div class="ctl"><span data-i="font"></span>

an:[['hose','बगीचे का पाइप','पाइप को किसी भी जगह दबाइए, पूरे पाइप से निकलने वाला पानी घट जाता है। सीरीज़ स्ट्रिंग के मॉड्यूल भी ऐसे ही हैं: एक मॉड्यूल पर छाया पूरी स्ट्रिंग का करंट घटा देती है। बाईपास डायोड नुकसान कम करते हैं, खत्म नहीं करते।'],
['mirror','घाट रोड का दर्पण','घाट रोड के तीखे मोड़ पर लगा गोल दर्पण पूरा मोड़ एक नज़र में दिखा देता है। पाथफाइंडर का गुंबद भी पूरा 360° क्षितिज एक ही नज़र में दिखाता है।'],
['train','रेल समय-सारणी','सूरज हर साल उसी तारीख को उसी पटरी पर चलता है, जैसे ट्रेन अपनी समय-सारणी पर चलती है। सूर्य-पथ चार्ट आपके अक्षांश के लिए वही समय-सारणी है।'],
['shirt','नाप का कपड़ा','दिल्ली (28.6° N) के लिए छपा चार्ट कोझिकोड (11.3° N) में फिट नहीं होता। यहाँ सूरज ज़्यादा ऊँचाई पर चलता है, इसलिए हर चार्ट एक अक्षांश पट्टी के लिए बनता है।']],
p_h:'सोलर पाथफाइंडर के भाग',p_hint:'भाग का काम देखने के लिए नंबर या नाम पर टैप करें।',side:'साइड व्यू',top:'ऊपर से दृश्य',

parts:[['गुंबद (Dome)','पारदर्शी, चिकना प्लास्टिक गुंबद। यह उत्तल दर्पण की तरह काम करता है और पूरा आकाश तथा आसपास की हर बाधा नीचे के चार्ट पर दिखाता है।'],
['सूर्य-पथ चार्ट','एक अक्षांश पट्टी के लिए छपा कागज़ी चार्ट। घुमावदार रेखाएँ हर महीने का सूर्य-पथ हैं, त्रिज्य (radial) रेखाएँ सौर घंटे हैं, और हर आधे घंटे के खाने की संख्या उस दिन की सौर ऊर्जा का % है।'],
['दिक्पात टैब','टैब और स्केल, जिससे चार्ट को स्थानीय चुंबकीय दिक्पात जितना घुमाया जाता है, ताकि चार्ट चुंबकीय दक्षिण नहीं, वास्तविक (true) दक्षिण की ओर रहे।'],
['कम्पास','अंतर्निर्मित कम्पास। पूरी यूनिट को तब तक घुमाएँ जब तक सुई दक्षिण निशान से न मिल जाए।'],
['बबल लेवल','स्पिरिट लेवल। यूनिट समतल होनी चाहिए, जैसे राजमिस्त्री फर्श की टाइल समतल करता है। झुकी यूनिट चार्ट पर हर बाधा की जगह बदल देती है।'],
['उपकरण बॉडी','चार्ट, गुंबद, लेवल और कम्पास को एक निश्चित स्थिति में साथ रखती है।'],
['बेस','ट्राइपॉड माउंट वाला स्थिर आधार। ढलवाँ छत पर इसे बीनबैग पर रखा जा सकता है।'],
['ट्राइपॉड','समायोज्य पैर ऊँचाई तय करते हैं और बबल को बीच में लाते हैं।'],
['ग्रीस पेंसिल','चार्ट पर बाधाओं की रूपरेखा बनाने के लिए सफ़ेद मोम पेंसिल। अगली साइट के लिए पोंछी जा सकती है।']],
d_h:'सूर्य-पथ चार्ट पढ़ना',month:'महीना',d_nums:'% संख्याएँ दिखाएँ',
d_list:['<b>ऊपरी किनारा = भूमध्य रेखा की ओर</b> (भारत में दक्षिण)। आप उत्तर की ओर खड़े होकर नीचे देखते हैं।',
'<b>घुमावदार रेखाएँ</b> = किसी महीने का सूर्य-पथ। जिन महीनों में सूरज की ऊँचाई एक जैसी है, वे एक ही रेखा साझा करते हैं: जन-नव, फर-अक्टू, मार्च-सित, अप्रैल-अग, मई-जुलाई।',
'<b>त्रिज्य रेखाएँ</b> = सौर समय, हर घंटे की एक। सुबह पूर्व की ओर, दोपहर बाद पश्चिम की ओर।',
'<b>संख्याएँ</b> = हर आधे घंटे में उस दिन की सौर ऊर्जा का %। एक महीने की रेखा के सभी खानों का योग 100 है। दोपहर के खाने सबसे बड़े होते हैं।',

d_k_h:'कम अक्षांश: उत्तर की ओर भी ध्यान दें',

steps:[['अपने अक्षांश का चार्ट चुनें','कोझिकोड लगभग 11.3° N पर है। उस अक्षांश पट्टी का चार्ट लगाएँ जिसमें आपकी साइट आती है। दूसरी पट्टी का चार्ट सूरज को गलत पटरी पर दिखाएगा।'],
['चुंबकीय दिक्पात सेट करें','कम्पास चुंबकीय उत्तर दिखाता है, वास्तविक उत्तर नहीं। साइट और तारीख का दिक्पात पता करें (कोझिकोड में कम, लगभग 1 से 2° W) और टैब से चार्ट को उतना घुमाएँ। जैसे 2 मिनट पीछे चलने वाली दीवार घड़ी: गलती पता है, तो एक बार सुधार दो।'],
['यूनिट वहाँ रखें जहाँ मॉड्यूल लगेंगे','इसे प्रस्तावित ऐरे के निचले किनारे पर रखें, जहाँ छाया सबसे पहले आती है। लंबे ऐरे के लिए दोनों सिरों पर, और बड़ी छत के कोनों पर रीडिंग लें।'],
['समतल करें','ट्राइपॉड के पैर तब तक ठीक करें जब तक बबल बीच के घेरे में न आ जाए। झुकी यूनिट हर बाधा की जगह बदल देती है, जैसे झुका स्पिरिट लेवल फर्श को ढलवाँ बना देता है।'],
['भूमध्य रेखा की ओर मोड़ें','भारत में पूरी यूनिट को तब तक घुमाएँ जब तक कम्पास की सुई दक्षिण निशान से न मिल जाए। दिक्पात पहले से सेट है, इसलिए चार्ट अब वास्तविक दक्षिण की ओर है।'],
['सीधा नीचे देखें','उत्तर की ओर खड़े हों। आँख गुंबद से 30 से 45 cm ऊपर, ठीक केंद्र पर रखें, ताकि आपका सिर प्रतिबिंब के बीच में दिखे। पेड़, इमारतें और टंकियाँ अब चार्ट पर आकृति के रूप में दिखेंगी।'],
['रूपरेखा बनाएँ','सफ़ेद ग्रीस पेंसिल से गुंबद में दिखने वाली क्षितिज-रेखा चार्ट पर उतारें, या सॉफ़्टवेयर के लिए ठीक ऊपर से फ़ोटो लें। बनाने से पहले लेवल और दिशा दोबारा जाँचें।'],
['संख्याएँ पढ़ें','हर महीने की रेखा पर, छाया के बाहर वाले खानों की संख्याएँ जोड़ें। योग उस महीने की % सौर उपलब्धता (solar access) है। उदाहरण: 100 − 18 छाया = 82% उपलब्धता।'],
['दर्ज करें और दोहराएँ','साइट, तारीख, अक्षांश, दिक्पात, स्थिति और मासिक परिणाम लिखें। चार्ट साफ़ करें और अगली स्थिति पर दोहराएँ।']],

['ITI वर्कशॉप की छत, पश्चिम में दो-मंज़िला भवन','भवन उपकरण से 7 m ऊपर और 10 m दूर है, दिशा-कोण 235° से 300°।','θ = tan⁻¹(7 ÷ 10) = 35°','हर महीने हर दोपहर बाद नुकसान, क्योंकि सूरज साल भर पश्चिम में डूबता है। पश्चिम की बाधा अपने आकार से ज़्यादा नुकसान करती है।'],
['घर की छत, उत्तर-पूर्व में पानी टंकी टावर','टंकी का शीर्ष उपकरण से 6 m ऊपर और 4 m दूर है, दिशा-कोण 15° से 75°।','θ = tan⁻¹(6 ÷ 4) = 56°','छाया केवल मई, जून और जुलाई में आती है, जब कोझिकोड में सूरज सिर से उत्तर में चलता है। केवल दक्षिण देखने वाला सर्वे इसे चूक जाएगा।']],

qs:[['कोझिकोड में चार्ट का ऊपरी (भूमध्य रेखा वाला) किनारा किस ओर होना चाहिए?',['चुंबकीय उत्तर','वास्तविक दक्षिण','वास्तविक पूर्व','किसी भी ओर'],1,'कोझिकोड भूमध्य रेखा के उत्तर में है, इसलिए चार्ट वास्तविक दक्षिण की ओर। पहले दिक्पात सेट करें, फिर कम्पास से मिलाएँ।'],
['चार्ट साइट के अक्षांश से क्यों मिलना चाहिए?',['गुंबद का आकार बदलता है','अक्षांश के साथ सूर्य-पथ की ऊँचाई बदलती है','कम्पास को चाहिए','चार्ट के रंग के लिए'],1,'भूमध्य रेखा के पास सूरज ऊँचा चलता है। दूसरी पट्टी का चार्ट हर महीने की रेखा गलत जगह रखता है।'],
['बबल बीच में नहीं है। पहले क्या करें?',['जल्दी से रूपरेखा बनाएँ','ट्राइपॉड के पैर ठीक कर समतल करें','चार्ट घुमाएँ','अनदेखा करें'],1,'पहले समतल करें। झुका गुंबद हर प्रतिबिंबित बाधा को खिसका देता है।'],
['कोझिकोड में जून में सौर दोपहर पर सूरज कहाँ होता है?',['दक्षिण में नीचे','ठीक सिर के ऊपर','सिर से थोड़ा उत्तर में','क्षितिज के नीचे'],2,'जून में सूर्य का झुकाव (23.4° N) अक्षांश (11.3° N) से ज़्यादा है, इसलिए दोपहर का सूरज सिर से लगभग 12° उत्तर में होता है।'],
['मार्च में छाया वाले खानों का योग 18 है। मार्च की सौर उपलब्धता है…',['18%','82%','118%','कह नहीं सकते'],1,'सभी खानों का योग 100 है, इसलिए उपलब्धता = 100 − 18 = 82%।'],
['पेड़ का शीर्ष उपकरण से 9 m ऊपर और 12 m दूर है। उसका शीर्ष कोण लगभग…',['24°','37°','53°','75°'],1,'tan⁻¹(9 ÷ 12) = tan⁻¹(0.75) ≈ 36.9°।'],
['चार्ट पर बाधा की रूपरेखा किससे बनाते हैं?',['चॉक लाइन','सफ़ेद ग्रीस पेंसिल','गुंबद पर मार्कर','सोल्डरिंग आयरन'],1,'सफ़ेद ग्रीस पेंसिल चार्ट पर निशान लगाती है और बाद में पोंछ दी जाती है।']],

ml:{title:'സോളാർ പാത്ത്ഫൈൻഡർ പരിശീലനം',sub:'സോളാർ PV സൈറ്റിലെ നിഴൽ സർവേ · CTS ഇലക്ട്രീഷ്യൻ',font:'അക്ഷരം',theme:'തീം',light:'ലൈറ്റ്',dark:'ഡാർക്ക്',hc:'പ്രൊജക്ടർ',lang:'ഭാഷ',full:'പൂർണ്ണ സ്ക്രീൻ',
place:'സ്ഥലം',lat:'അക്ഷാംശം (° N +)',lon:'രേഖാംശം (° E +)',tz:'UTC വ്യത്യാസം (മണിക്കൂർ)',mdec:'കാന്തിക ദിക്ഭ്രംശം (° E +)',resetLoc:'കോഴിക്കോട്ടേക്ക് മടങ്ങുക',
locNote:'സ്ഥിരം സൈറ്റ്: കോഴിക്കോട്, കേരളം. മറ്റേതു സൈറ്റിനും അക്ഷാംശവും രേഖാംശവും മാറ്റാം. ദിക്ഭ്രംശം ഏകദേശ മൂല്യമാണ്; സർവേ തീയതിക്ക് NOAA അല്ലെങ്കിൽ IGRF കാൽക്കുലേറ്ററിൽ ഉറപ്പാക്കുക.',
tabs:['നിഴൽ എന്തിന് ശ്രദ്ധിക്കണം','ഭാഗങ്ങൾ','സൂര്യപഥ ചാർട്ട്','സെറ്റപ്പ്, അളവ്','സിമുലേറ്റർ','ഉദാഹരണങ്ങൾ','ക്വിസ്'],
i_h:'ഒരു നിഴൽ മതി, മുഴുവൻ സ്ട്രിംഗിന്റെയും ഉൽപാദനം കുറയാൻ',
i_p:'ഒരു മൊഡ്യൂൾ പോലും ഘടിപ്പിക്കുന്നതിനു മുമ്പ്, തിരഞ്ഞെടുത്ത സ്ഥലത്ത് ഒരു വർഷത്തെ സൂര്യപ്രകാശത്തിന്റെ എത്ര ഭാഗം എത്തും എന്ന് സോളാർ പാത്ത്ഫൈൻഡർ കാണിക്കുന്നു. ഇതിന് ബാറ്ററിയോ ഇലക്ട്രോണിക്സോ ഇല്ല. സുതാര്യമായ ഒരു ഡോം (dome) ചുറ്റുമുള്ളതെല്ലാം സൂര്യപഥം അച്ചടിച്ച ചാർട്ടിൽ പ്രതിഫലിപ്പിക്കുന്നു.',
i_cap:'തെങ്ങ് ശ്രദ്ധിക്കുക. രാവിലെ അതിന്റെ നിഴൽ മേൽക്കൂരയിലെ മൊഡ്യൂളുകളിൽ വീഴുന്നു, സ്ട്രിംഗിന്റെ ഉൽപാദനം കുറയുന്നു.',
i_bypass:'ബൈപാസ് ഡയോഡ്',i_power:'സ്ട്രിംഗ് പവർ (ഏകദേശം)',i_play:'പ്ലേ',i_pause:'നിർത്തുക',
i_use_h:'സർവേ ഉപയോഗിച്ച് തീരുമാനിക്കാം',
i_use:['അറേ മേൽക്കൂരയിലോ നിലത്തോ എവിടെ സ്ഥാപിക്കണം','ഏത് മരങ്ങളോ നിർമ്മിതികളോ വെട്ടിയൊതുക്കണം, മാറ്റണം, ഒഴിവാക്കണം','സൈറ്റിന് ക്വട്ടേഷൻ നൽകാൻ യോഗ്യതയുണ്ടോ','നിഴൽ എല്ലാറ്റിലും വീഴാതെ ഒരു സ്ട്രിംഗിൽ മാത്രം വീഴാൻ മൊഡ്യൂളുകൾ എങ്ങനെ സ്ട്രിംഗുകളായി തിരിക്കണം'],
i_src:'റഫറൻസ്: CTS ഇലക്ട്രീഷ്യൻ ട്രേഡ് തിയറി (സോളാർ PV സിസ്റ്റം, സൈറ്റ് സർവേ); ഉപകരണ വിവരങ്ങൾ നിർമ്മാതാവിൽ നിന്ന് (solarpathfinder.com).',
an:[['hose','ഗാർഡൻ ഹോസ്','ഹോസിന്റെ ഏതെങ്കിലും ഒരു ഭാഗത്ത് ചവിട്ടിയാൽ മുഴുവൻ ഹോസിൽ നിന്നുമുള്ള വെള്ളം കുറയും. സീരീസ് സ്ട്രിംഗിലെ മൊഡ്യൂളുകളും അങ്ങനെ തന്നെ: ഒരു മൊഡ്യൂളിലെ നിഴൽ സ്ട്രിംഗിന്റെ മുഴുവൻ കറന്റും കുറയ്ക്കും. ബൈപാസ് ഡയോഡുകൾ നഷ്ടം കുറയ്ക്കും, പൂർണ്ണമായി ഒഴിവാക്കില്ല.'],
['mirror','ചുരത്തിലെ കണ്ണാടി','താമരശ്ശേരി ചുരത്തിലെ ഹെയർപിൻ വളവിലെ വട്ടക്കണ്ണാടി മുഴുവൻ വളവും ഒറ്റനോട്ടത്തിൽ കാണിക്കുന്നു. പാത്ത്ഫൈൻഡറിന്റെ ഡോമും അതുപോലെ ചുറ്റുമുള്ള 360° ചക്രവാളം ഒറ്റനോട്ടത്തിൽ കാണിക്കുന്നു.'],
['train','ട്രെയിൻ ടൈംടേബിൾ','ട്രെയിൻ ടൈംടേബിൾ പാലിക്കുന്നതുപോലെ, എല്ലാ വർഷവും ഒരേ തീയതിയിൽ സൂര്യൻ ഒരേ പാതയിൽ സഞ്ചരിക്കുന്നു. നിങ്ങളുടെ അക്ഷാംശത്തിനായി വരച്ച ആ ടൈംടേബിളാണ് സൂര്യപഥ ചാർട്ട്.'],
['shirt','അളവെടുത്ത് തുന്നിയ ഷർട്ട്','ഡൽഹിക്ക് (28.6° N) വേണ്ടി അച്ചടിച്ച ചാർട്ട് കോഴിക്കോടിന് (11.3° N) ചേരില്ല. ഇവിടെ സൂര്യൻ കൂടുതൽ ഉയരത്തിലാണ് സഞ്ചരിക്കുന്നത്. അതിനാൽ ഓരോ ചാർട്ടും ഒരു അക്ഷാംശ മേഖലയ്ക്ക് വേണ്ടിയുള്ളതാണ്.']],
p_h:'സോളാർ പാത്ത്ഫൈൻഡറിന്റെ ഭാഗങ്ങൾ',p_hint:'ഭാഗത്തിന്റെ ധർമ്മം കാണാൻ നമ്പറിലോ പേരിലോ ടാപ്പ് ചെയ്യുക.',side:'വശത്തുനിന്നുള്ള കാഴ്ച',top:'മുകളിൽ നിന്നുള്ള കാഴ്ച',
p_note:'പരിശീലനത്തിനുള്ള രേഖാചിത്രം, അളവിനനുസരിച്ചല്ല. യഥാർത്ഥ ഘടന മോഡൽ അനുസരിച്ച് മാറാം. ഫോട്ടോകൾക്കും ഔദ്യോഗിക മാനുവലിനും solarpathfinder.com കാണുക.',
parts:[['ഡോം (Dome)','സുതാര്യവും മിനുസമുള്ളതുമായ പ്ലാസ്റ്റിക് ഡോം. ഇത് ഒരു കോൺവെക്സ് കണ്ണാടി പോലെ പ്രവർത്തിച്ച് ആകാശവും ചുറ്റുമുള്ള എല്ലാ തടസ്സങ്ങളും താഴെയുള്ള ചാർട്ടിൽ പ്രതിഫലിപ്പിക്കുന്നു.'],
['സൂര്യപഥ ചാർട്ട്','ഒരു അക്ഷാംശ മേഖലയ്ക്കായി അച്ചടിച്ച കടലാസ് ചാർട്ട്. വളഞ്ഞ വരകൾ ഓരോ മാസത്തെയും സൂര്യപഥം, കേന്ദ്രത്തിൽ നിന്നുള്ള വരകൾ സൗരസമയം (മണിക്കൂർ), ഓരോ അര മണിക്കൂർ കള്ളിയിലെയും സംഖ്യ ആ ദിവസത്തെ സൗരോർജ്ജത്തിന്റെ %.'],
['ദിക്ഭ്രംശ ടാബ്','പ്രാദേശിക കാന്തിക ദിക്ഭ്രംശത്തിന് അനുസരിച്ച് ചാർട്ട് തിരിക്കാനുള്ള ടാബും സ്കെയിലും. അപ്പോൾ ചാർട്ട് കാന്തിക തെക്കിലേക്കല്ല, യഥാർത്ഥ (true) തെക്കിലേക്ക് തിരിയും.'],
['കോമ്പസ്','ഉള്ളിൽ ഘടിപ്പിച്ച കോമ്പസ്. സൂചി തെക്ക് അടയാളവുമായി ഒത്തുവരുന്നതുവരെ യൂണിറ്റ് മുഴുവൻ തിരിക്കുക.'],
['ബബിൾ ലെവൽ','സ്പിരിറ്റ് ലെവൽ. മേസൺ തറയോട് നിരപ്പാക്കുന്നതുപോലെ യൂണിറ്റ് നിരപ്പിലായിരിക്കണം. ചരിഞ്ഞ യൂണിറ്റ് ചാർട്ടിലെ എല്ലാ തടസ്സങ്ങളുടെയും സ്ഥാനം മാറ്റും.'],
['ഉപകരണ ബോഡി','ചാർട്ട്, ഡോം, ലെവൽ, കോമ്പസ് എന്നിവ ഒരു നിശ്ചിത സ്ഥാനത്ത് ഒരുമിച്ച് ഉറപ്പിച്ചു നിർത്തുന്നു.'],
['ബേസ്','ട്രൈപോഡ് ഘടിപ്പിക്കാവുന്ന ഉറച്ച അടിത്തറ. ചരിഞ്ഞ മേൽക്കൂരയിൽ ഒരു ബീൻബാഗിൽ വെക്കാം.'],
['ട്രൈപോഡ്','ക്രമീകരിക്കാവുന്ന കാലുകൾ ഉയരം നിശ്ചയിക്കുകയും ബബിൾ നടുവിൽ കൊണ്ടുവരികയും ചെയ്യുന്നു.'],
['ഗ്രീസ് പെൻസിൽ','തടസ്സങ്ങളുടെ രൂപരേഖ ചാർട്ടിൽ വരയ്ക്കാനുള്ള വെള്ള മെഴുക് പെൻസിൽ. അടുത്ത സൈറ്റിനായി തുടച്ചുമാറ്റാം.']],
d_h:'സൂര്യപഥ ചാർട്ട് വായിക്കുന്ന വിധം',month:'മാസം',d_nums:'% സംഖ്യകൾ കാണിക്കുക',
d_list:['<b>മുകൾ അറ്റം = ഭൂമധ്യരേഖയുടെ ദിശ</b> (ഇന്ത്യയിൽ തെക്ക്). നിങ്ങൾ വടക്കുവശത്ത് നിന്ന് താഴേക്ക് നോക്കുന്നു.',
'<b>വളഞ്ഞ വരകൾ</b> = ഒരു മാസത്തെ സൂര്യപഥം. സൂര്യന്റെ ഉയരം ഒരുപോലെയുള്ള മാസങ്ങൾ ഒരേ വര പങ്കിടുന്നു: ജനു-നവം, ഫെബ്രു-ഒക്ടോ, മാർച്ച്-സെപ്റ്റം, ഏപ്രിൽ-ഓഗ, മേയ്-ജൂലൈ.',
'<b>കേന്ദ്രത്തിൽ നിന്നുള്ള വരകൾ</b> = സൗരസമയം, ഓരോ മണിക്കൂറിനും ഒന്ന്. രാവിലെ കിഴക്കുഭാഗത്ത്, ഉച്ചകഴിഞ്ഞ് പടിഞ്ഞാറുഭാഗത്ത്.',
'<b>സംഖ്യകൾ</b> = ഓരോ അര മണിക്കൂറിലും ആ ദിവസത്തെ സൗരോർജ്ജത്തിന്റെ %. ഒരു മാസവരയിലെ എല്ലാ കള്ളികളുടെയും ആകെത്തുക 100. ഉച്ചസമയത്തെ കള്ളികളാണ് ഏറ്റവും വലുത്.',
'<b>കേന്ദ്രം</b> = നേരെ തലയ്ക്കു മുകളിൽ (90°). <b>പുറം വൃത്തം</b> = ചക്രവാളം (0°). കുത്തുവര വൃത്തങ്ങൾ 30°, 60° കാണിക്കുന്നു.'],
d_k_h:'താഴ്ന്ന അക്ഷാംശം: വടക്കുവശവും ശ്രദ്ധിക്കുക',
d_k:'ഈ സൈറ്റിൽ ഏകദേശം {d1}, {d2} തീയതികളിൽ സൂര്യൻ നേരെ തലയ്ക്കു മുകളിലാണ്. ഈ തീയതികൾക്കിടയിൽ ഉച്ചസൂര്യൻ വടക്കുമാറിയാണ്. അതിനാൽ വടക്കുവശത്തെ മതിലോ ടാങ്കോ മൊഡ്യൂളുകളിൽ നിഴൽ വീഴ്ത്താം.',
d_no:'ഈ അക്ഷാംശത്തിൽ സൂര്യൻ ഒരിക്കലും നേരെ തലയ്ക്കു മുകളിൽ വരില്ല. വർഷം മുഴുവൻ ഭൂമധ്യരേഖയുടെ ഭാഗത്തായിരിക്കും.',
d_t_h:'സൗരസമയവും ക്ലോക്ക് സമയവും',
d_t:'ചാർട്ട് സൗരസമയത്തിലാണ്. വാച്ച് കാണിക്കുന്നത് സ്റ്റാൻഡേർഡ് സമയമാണ്; രേഖാംശവും സമയസമവാക്യവും (equation of time) കാരണം ഇത് വ്യത്യാസപ്പെടും. ഈ സൈറ്റിൽ സൗര ഉച്ച ക്ലോക്ക് സമയം {a} മുതൽ {b} വരെയാണ്.',
st_h:'സെറ്റപ്പും അളവെടുപ്പും, ഘട്ടം ഘട്ടമായി',step:'ഘട്ടം',prev:'പിന്നോട്ട്',next:'അടുത്തത്',
steps:[['അക്ഷാംശത്തിനുള്ള ചാർട്ട് തിരഞ്ഞെടുക്കുക','കോഴിക്കോട് ഏകദേശം 11.3° N ൽ ആണ്. സൈറ്റ് ഉൾപ്പെടുന്ന അക്ഷാംശ മേഖലയ്ക്കുള്ള ചാർട്ട് ഇടുക. മറ്റൊരു മേഖലയുടെ ചാർട്ട് സൂര്യനെ തെറ്റായ പാതയിൽ കാണിക്കും.'],
['കാന്തിക ദിക്ഭ്രംശം ക്രമീകരിക്കുക','കോമ്പസ് കാണിക്കുന്നത് കാന്തിക വടക്കാണ്, യഥാർത്ഥ വടക്കല്ല. സൈറ്റിനും തീയതിക്കുമുള്ള ദിക്ഭ്രംശം കണ്ടെത്തി (കോഴിക്കോട് ചെറുതാണ്, ഏകദേശം 1 മുതൽ 2° W) ടാബ് ഉപയോഗിച്ച് ചാർട്ട് അത്രയും തിരിക്കുക. 2 മിനിറ്റ് പിന്നിൽ ഓടുന്ന ചുമർ ക്ലോക്ക് പോലെ: തെറ്റ് അറിയാം, ഒരിക്കൽ തിരുത്തിവെക്കുക.'],
['മൊഡ്യൂൾ വരുന്നിടത്ത് യൂണിറ്റ് വെക്കുക','ആസൂത്രണം ചെയ്ത അറേയുടെ താഴത്തെ അറ്റത്ത് വെക്കുക; നിഴൽ ആദ്യം എത്തുന്നത് അവിടെയാണ്. നീളമുള്ള അറേയ്ക്ക് രണ്ടറ്റത്തും, വലിയ മേൽക്കൂരയുടെ മൂലകളിലും റീഡിംഗ് എടുക്കുക.'],
['നിരപ്പാക്കുക','ബബിൾ നടുവിലെ വൃത്തത്തിൽ വരുന്നതുവരെ ട്രൈപോഡ് കാലുകൾ ക്രമീകരിക്കുക. ചരിഞ്ഞ സ്പിരിറ്റ് ലെവൽ തറ ചരിക്കുന്നതുപോലെ, ചരിഞ്ഞ യൂണിറ്റ് എല്ലാ തടസ്സങ്ങളുടെയും സ്ഥാനം മാറ്റും.'],
['ഭൂമധ്യരേഖയിലേക്ക് തിരിക്കുക','ഇന്ത്യയിൽ, കോമ്പസ് സൂചി തെക്ക് അടയാളവുമായി ഒത്തുവരുന്നതുവരെ യൂണിറ്റ് മുഴുവൻ തിരിക്കുക. ദിക്ഭ്രംശം നേരത്തെ ക്രമീകരിച്ചതിനാൽ ചാർട്ട് ഇപ്പോൾ യഥാർത്ഥ തെക്കിലേക്കാണ്.'],
['നേരെ താഴേക്ക് നോക്കുക','വടക്കുവശത്ത് നിൽക്കുക. കണ്ണ് ഡോമിന് 30 മുതൽ 45 cm മുകളിൽ, കൃത്യം നടുവിൽ വെക്കുക; നിങ്ങളുടെ തല പ്രതിബിംബത്തിന്റെ നടുവിൽ കാണണം. മരങ്ങളും കെട്ടിടങ്ങളും ടാങ്കുകളും ഇപ്പോൾ ചാർട്ടിൽ രൂപരേഖകളായി കാണാം.'],
['രൂപരേഖ വരയ്ക്കുക','വെള്ള ഗ്രീസ് പെൻസിൽ കൊണ്ട് ഡോമിൽ കാണുന്ന ചക്രവാളരേഖ ചാർട്ടിൽ പകർത്തുക, അല്ലെങ്കിൽ സോഫ്റ്റ്‌വെയറിനായി നേരെ മുകളിൽ നിന്ന് ഫോട്ടോ എടുക്കുക. വരയ്ക്കുന്നതിനു മുമ്പ് ലെവലും ദിശയും വീണ്ടും പരിശോധിക്കുക.'],
['സംഖ്യകൾ വായിക്കുക','ഓരോ മാസവരയിലും, വരച്ച നിഴലിന് പുറത്തുള്ള കള്ളികളിലെ സംഖ്യകൾ കൂട്ടുക. ആകെത്തുകയാണ് ആ മാസത്തെ % സോളാർ ആക്സസ്. ഉദാഹരണം: 100 − 18 നിഴൽ = 82% ആക്സസ്.'],
['രേഖപ്പെടുത്തുക, ആവർത്തിക്കുക','സൈറ്റ്, തീയതി, അക്ഷാംശം, ദിക്ഭ്രംശം, സ്ഥാനം, മാസ ഫലങ്ങൾ എന്നിവ എഴുതുക. ചാർട്ട് വൃത്തിയാക്കി അടുത്ത സ്ഥാനത്ത് ആവർത്തിക്കുക.']],

ex_h:'ചെയ്തു കാണിച്ച ഉദാഹരണങ്ങൾ',ex_p:'മൂന്നും കോഴിക്കോടിന് (11.26° N) വേണ്ടി കണക്കാക്കിയതാണ്. ഏതും സിമുലേറ്ററിൽ തുറന്ന് സൂര്യനെ ചലിപ്പിക്കാം.',

['ITI വർക്ക്ഷോപ്പ് മേൽക്കൂര, പടിഞ്ഞാറ് ഇരുനില കെട്ടിടം','കെട്ടിടം ഉപകരണത്തിൽ നിന്ന് 7 m ഉയരത്തിലും 10 m അകലെയുമാണ്, ദിശാകോൺ 235° മുതൽ 300° വരെ.','θ = tan⁻¹(7 ÷ 10) = 35°','എല്ലാ മാസവും എല്ലാ ഉച്ചകഴിഞ്ഞും നഷ്ടം, കാരണം വർഷം മുഴുവൻ സൂര്യൻ പടിഞ്ഞാറ് അസ്തമിക്കുന്നു. പടിഞ്ഞാറുള്ള തടസ്സം വലിപ്പത്തേക്കാൾ കൂടുതൽ നഷ്ടം വരുത്തും.'],
['വീടിന്റെ ടെറസ്, വടക്കുകിഴക്ക് വാട്ടർ ടാങ്ക് ടവർ','ടാങ്കിന്റെ മുകൾഭാഗം ഉപകരണത്തിൽ നിന്ന് 6 m ഉയരത്തിലും 4 m അകലെയുമാണ്, ദിശാകോൺ 15° മുതൽ 75° വരെ.','θ = tan⁻¹(6 ÷ 4) = 56°','മേയ്, ജൂൺ, ജൂലൈ മാസങ്ങളിൽ മാത്രമാണ് നിഴൽ; അപ്പോൾ കോഴിക്കോട് സൂര്യൻ തലയ്ക്കു മുകളിൽ നിന്ന് വടക്കുമാറി സഞ്ചരിക്കുന്നു. തെക്കുവശം മാത്രം നോക്കുന്ന സർവേ ഇത് കാണാതെ പോകും.']],

tn_p:'സൂര്യപഥ ചാർട്ട് വരച്ചിരിക്കുന്നത് യഥാർത്ഥ (ഭൂമിശാസ്ത്ര) വടക്കിനനുസരിച്ചാണ്; ഭൂമിയുടെ ഭ്രമണ അച്ചുതണ്ടിന്റെ ദിശയാണത്. കോമ്പസ് സൂചി കാണിക്കുന്നത് കാന്തിക വടക്കാണ്. നിങ്ങളുടെ സൈറ്റിൽ ഇവ തമ്മിലുള്ള ചെറിയ കോണാണ് കാന്തിക ദിക്ഭ്രംശം (declination).',

Object.assign(T.en,{tabs:['Why shade matters','Parts','True north','Placement','How the chart is made','Sunpath diagram','Set-up & measure','Simulator','Examples','Quiz'],
xp_h:'Sun chart: what is plotted against what',
xp_p:'The sunpath chart is a graph. It plots the sun’s direction (bearing) against its height above the horizon (altitude), hour by hour, for one day in each month. Step through to see it built.',
xp_st:[['The sky as a dome','Stand at the site and imagine the sky as a dome over you. At any moment the sun’s position needs just two numbers. Altitude is its height above the horizon: 0° at the horizon, 90° straight overhead. Bearing (azimuth) is its direction round the horizon, measured from true north: E 90°, S 180°, W 270°.'],
['Plot one day: bearing vs altitude','Draw a graph with bearing on the horizontal axis and altitude on the vertical axis. Every hour, mark the sun’s (bearing, altitude) as a point. Joined together, the points make the sun’s path for that day.'],
['Add every month','Repeat for the middle day of each month. June gives the highest path and December the lowest. Months with the same sun height, like March and September, fall on one line. At Kozhikode the May to July paths pass north of overhead, so on this flat graph they break at the edges. Choose June to see it.'],
['Bend the graph into a circle','Now roll the bearing axis into a circle. Bearing becomes the direction round the centre. Altitude becomes the distance in from the rim: horizon (0°) on the rim, overhead (90°) at the centre. The break disappears. This round graph matches what the dome reflects. Drag the slider to bend it yourself.'],
['Join the hours','Join the points that share the same solar time across all months. These are the hour lines. The 12 line runs along the true N–S line. The Earth turns 15° each hour, so the lines are evenly spaced in time.'],
['Write the % in each half hour','Split each month line into half-hour cells. In each cell write the share of that day’s solar energy that arrives then. The sun is highest at noon, so noon cells hold the biggest numbers. The cells on one line add up to 100.'],
['Trace obstacles, add up what is left','The dome reflects trees and buildings onto the chart. Any cell inside a traced obstacle is lost. Add the numbers that remain on a month line: that total is the solar access for the month.']],

xp_st:[['आकाश एक गुंबद की तरह','साइट पर खड़े होकर आकाश को अपने ऊपर एक गुंबद मानें। किसी भी क्षण सूर्य की स्थिति के लिए बस दो संख्याएँ चाहिए। उन्नतांश (altitude) क्षितिज से उसकी ऊँचाई है: क्षितिज पर 0°, ठीक सिर के ऊपर 90°। दिशा-कोण (azimuth/bearing) वास्तविक उत्तर से क्षितिज के साथ मापी गई दिशा है: पूर्व 90°, दक्षिण 180°, पश्चिम 270°।'],
['एक दिन प्लॉट करें: दिशा-कोण बनाम उन्नतांश','एक ग्राफ़ बनाएँ जिसके क्षैतिज अक्ष पर दिशा-कोण और ऊर्ध्वाधर अक्ष पर उन्नतांश हो। हर घंटे सूर्य का (दिशा-कोण, उन्नतांश) एक बिंदु के रूप में अंकित करें। बिंदुओं को जोड़ने पर उस दिन का सूर्य-पथ बनता है।'],
['हर महीना जोड़ें','हर महीने के मध्य दिन के लिए यही दोहराएँ। जून का पथ सबसे ऊँचा और दिसंबर का सबसे नीचा होता है। जिन महीनों में सूरज की ऊँचाई एक जैसी है, जैसे मार्च और सितंबर, वे एक ही रेखा पर आते हैं। कोझिकोड में मई से जुलाई के पथ सिर से उत्तर में जाते हैं, इसलिए इस सपाट ग्राफ़ पर वे किनारों पर टूट जाते हैं। देखने के लिए जून चुनें।'],
['ग्राफ़ को मोड़कर वृत्त बनाएँ','अब दिशा-कोण अक्ष को मोड़कर वृत्त बना दें। दिशा-कोण केंद्र के चारों ओर की दिशा बन जाता है। उन्नतांश किनारे से अंदर की दूरी बन जाता है: क्षितिज (0°) किनारे पर, सिर के ऊपर (90°) केंद्र पर। टूटन गायब हो जाती है। यह गोल ग्राफ़ वही दिखाता है जो गुंबद प्रतिबिंबित करता है। स्लाइडर खींचकर खुद मोड़ें।'],
['घंटों को जोड़ें','सभी महीनों में एक ही सौर समय वाले बिंदुओं को जोड़ें। ये घंटा रेखाएँ हैं। 12 की रेखा वास्तविक उ–द रेखा पर रहती है। पृथ्वी हर घंटे 15° घूमती है, इसलिए रेखाएँ समय में बराबर दूरी पर हैं।'],
['हर आधे घंटे में % लिखें','हर महीने की रेखा को आधे-आधे घंटे के खानों में बाँटें। हर खाने में लिखें कि उस दिन की सौर ऊर्जा का कितना हिस्सा उस समय आता है। दोपहर में सूरज सबसे ऊँचा होता है, इसलिए दोपहर के खानों में सबसे बड़ी संख्याएँ होती हैं। एक रेखा के सभी खानों का योग 100 है।'],
['बाधाएँ बनाएँ, बचा हुआ जोड़ें','गुंबद पेड़ों और इमारतों को चार्ट पर प्रतिबिंबित करता है। बनाई गई बाधा के अंदर का हर खाना नष्ट हो जाता है। किसी महीने की रेखा पर बची संख्याएँ जोड़ें: यही उस महीने की सौर उपलब्धता है।']],

lg:[['month','महीने की रेखाएँ','हर घुमावदार रेखा किसी महीने के मध्य दिन का सूर्य-पथ है, पूर्व की ओर सूर्योदय से पश्चिम की ओर सूर्यास्त तक। सूरज की ऊँचाई साल में दो बार दोहराती है, इसलिए एक रेखा दो महीनों के काम आती है: जन/नव, फर/अक्टू, मार्च/सित, अप्रै/अग और मई/जुला। जून और दिसंबर की अपनी-अपनी रेखा है। महीनों के नाम हर रेखा के पश्चिमी सिरे के पास छपे हैं। मार्च/सित रेखा विषुव (equinox) है: सूरज ठीक पूर्व में उगता और ठीक पश्चिम में डूबता है। चार्ट के नीचे महीना चुनकर उसकी रेखा हाइलाइट करें।'],
['hour','घंटा रेखाएँ','महीने की रेखाओं को काटने वाली रेखाएँ सौर घंटे हैं, जिनके नंबर क्षितिज वाले सिरे के पास हैं। सौर समय 12 (सौर दोपहर) वास्तविक उ–द रेखा पर है, जब सूरज सबसे ऊँचा होता है। सुबह के घंटे पूर्व (बाईं) ओर और दोपहर बाद के पश्चिम (दाईं) ओर हैं। पृथ्वी हर घंटे 15° घूमती है। दो घंटा रेखाओं के बीच आधे घंटे के दो खाने हैं, जैसे 9:00–9:30 और 9:30–10:00। ये सौर समय हैं, घड़ी का समय नहीं; बदलने के लिए नीचे का बॉक्स देखें।'],
['pct','प्रतिशत संख्याएँ','हर संख्या किसी महीने की रेखा पर आधे घंटे के एक खाने में है। यह उस दिन की कुल सौर ऊर्जा का वह हिस्सा है जो उस आधे घंटे में आता है। {m} में सबसे बड़ा खाना {a}–{b} है, जिसमें “{v}” है: दिन की {v}% ऊर्जा उसी समय आती है। एक रेखा के सभी खानों का योग 100 है। दोपहर के खाने सबसे बड़े हैं क्योंकि सूरज ऊँचा होता है और उसकी रोशनी कम हवा से गुज़रती है; सुबह-शाम के खाने छोटे हैं। इस ट्रेनर में संख्याएँ साफ़-आकाश मॉडल से निकाली गई हैं; छपे चार्ट पर ये निर्माता की होती हैं।'],
['ring','उन्नतांश वृत्त','केंद्र से दूरी सूरज की ऊँचाई दिखाती है। बाहरी किनारा क्षितिज (0°) है। डैश वाले वृत्त 30° और 60° हैं। केंद्र ठीक सिर के ऊपर (90°) है। जिस बाधा का शीर्ष 30° वृत्त तक पहुँचता है, वह उस दिशा में सूरज के 30° से नीचे रहने पर उसे रोकती है। इस ट्रेनर में वृत्त बराबर दूरी पर हैं; छपे चार्ट का पैमाना उसके गुंबद से मिलाया जाता है।'],
['brg','दिशा-कोण स्केल','किनारे के चारों ओर की डिग्री वास्तविक उत्तर से दिशा बताती हैं: उ 0°, पू 90°, द 180°, प 270°, हर 10° पर निशान। भूमध्य रेखा के उत्तर की साइट के लिए चार्ट में द ऊपर, पू बाईं ओर और प दाईं ओर है। बाधाओं की दिशा पता करने और यह जाँचने के लिए इसका उपयोग करें कि चार्ट चुंबकीय दिक्पात जितना घुमाया गया है।'],
['lat','अक्षांश','हर छपा चार्ट एक अक्षांश पट्टी के लिए बनता है, और वह पट्टी उस पर छपी होती है (यहाँ ऊपर बाएँ कोने में)। अक्षांश तय करता है कि सूरज कितना ऊँचा चलेगा। भूमध्य रेखा के पास पथ ऊँचे होते हैं और जून की रेखा उत्तर की ओर चली जाती है। और उत्तर में वे दक्षिणी किनारे की ओर नीचे आ जाते हैं। आपकी साइट, {p}, {lat} पर है। नीचे के चार छोटे चार्ट जून की रेखा हाइलाइट करके अक्षांशों की तुलना करते हैं।']],

xp_p:'സൂര്യപഥ ചാർട്ട് ഒരു ഗ്രാഫാണ്. ഓരോ മാസത്തെയും ഒരു ദിവസത്തിനായി, മണിക്കൂർ തോറും, സൂര്യന്റെ ദിശയെ (ദിശാകോൺ) ചക്രവാളത്തിൽ നിന്നുള്ള ഉയരത്തിനെതിരെ (ഉന്നതി) ഇതിൽ പ്ലോട്ട് ചെയ്യുന്നു. ഘട്ടം ഘട്ടമായി ഇത് ഉണ്ടാകുന്നത് കാണുക.',
xp_st:[['ആകാശം ഒരു ഡോം പോലെ','സൈറ്റിൽ നിന്ന് ആകാശത്തെ നിങ്ങൾക്കു മുകളിലുള്ള ഒരു ഡോം ആയി സങ്കൽപ്പിക്കുക. ഏതു നിമിഷവും സൂര്യന്റെ സ്ഥാനം അറിയാൻ രണ്ട് സംഖ്യകൾ മതി. ഉന്നതി (altitude) ചക്രവാളത്തിൽ നിന്നുള്ള ഉയരമാണ്: ചക്രവാളത്തിൽ 0°, നേരെ തലയ്ക്കു മുകളിൽ 90°. ദിശാകോൺ (azimuth/bearing) യഥാർത്ഥ വടക്കിൽ നിന്ന് ചക്രവാളത്തിലൂടെ അളക്കുന്ന ദിശയാണ്: കിഴക്ക് 90°, തെക്ക് 180°, പടിഞ്ഞാറ് 270°.'],
['ഒരു ദിവസം പ്ലോട്ട് ചെയ്യുക: ദിശാകോൺ × ഉന്നതി','തിരശ്ചീന അക്ഷത്തിൽ ദിശാകോണും ലംബ അക്ഷത്തിൽ ഉന്നതിയും ഉള്ള ഒരു ഗ്രാഫ് വരയ്ക്കുക. ഓരോ മണിക്കൂറിലും സൂര്യന്റെ (ദിശാകോൺ, ഉന്നതി) ഒരു ബിന്ദുവായി അടയാളപ്പെടുത്തുക. ബിന്ദുക്കൾ യോജിപ്പിച്ചാൽ ആ ദിവസത്തെ സൂര്യപഥം കിട്ടും.'],
['എല്ലാ മാസവും ചേർക്കുക','ഓരോ മാസത്തിന്റെയും മധ്യദിവസത്തിനായി ഇത് ആവർത്തിക്കുക. ജൂണിലെ പഥം ഏറ്റവും ഉയരത്തിലും ഡിസംബറിലേത് ഏറ്റവും താഴെയുമാണ്. മാർച്ച്, സെപ്റ്റംബർ പോലെ സൂര്യന്റെ ഉയരം ഒരുപോലെയുള്ള മാസങ്ങൾ ഒരേ വരയിൽ വരും. കോഴിക്കോട് മേയ് മുതൽ ജൂലൈ വരെയുള്ള പഥങ്ങൾ തലയ്ക്കു മുകളിൽ നിന്ന് വടക്കോട്ട് കടക്കുന്നു; അതിനാൽ ഈ പരന്ന ഗ്രാഫിൽ അവ അറ്റങ്ങളിൽ മുറിയുന്നു. കാണാൻ ജൂൺ തിരഞ്ഞെടുക്കുക.'],
['ഗ്രാഫ് വളച്ച് വൃത്തമാക്കുക','ഇനി ദിശാകോൺ അക്ഷം വളച്ച് ഒരു വൃത്തമാക്കുക. ദിശാകോൺ കേന്ദ്രത്തിനു ചുറ്റുമുള്ള ദിശയാകുന്നു. ഉന്നതി അരികിൽ നിന്ന് ഉള്ളിലേക്കുള്ള ദൂരമാകുന്നു: ചക്രവാളം (0°) അരികിൽ, തലയ്ക്കു മുകളിൽ (90°) കേന്ദ്രത്തിൽ. മുറിവ് ഇല്ലാതാകുന്നു. ഡോം പ്രതിഫലിപ്പിക്കുന്നതിനോട് ഈ വട്ട ഗ്രാഫ് ചേരുന്നു. സ്ലൈഡർ വലിച്ച് സ്വയം വളയ്ക്കുക.'],
['മണിക്കൂറുകൾ യോജിപ്പിക്കുക','എല്ലാ മാസങ്ങളിലും ഒരേ സൗരസമയമുള്ള ബിന്ദുക്കൾ യോജിപ്പിക്കുക. ഇവയാണ് മണിക്കൂർ വരകൾ. 12 ന്റെ വര യഥാർത്ഥ വ–തെ രേഖയിലാണ്. ഭൂമി ഓരോ മണിക്കൂറിലും 15° തിരിയുന്നതിനാൽ വരകൾ സമയത്തിൽ തുല്യ അകലത്തിലാണ്.'],
['ഓരോ അര മണിക്കൂറിലും % എഴുതുക','ഓരോ മാസവരയും അര മണിക്കൂർ കള്ളികളായി തിരിക്കുക. ആ ദിവസത്തെ സൗരോർജ്ജത്തിന്റെ എത്ര ഭാഗം ആ സമയത്ത് എത്തുന്നു എന്ന് ഓരോ കള്ളിയിലും എഴുതുക. ഉച്ചയ്ക്ക് സൂര്യൻ ഏറ്റവും ഉയരത്തിലായതിനാൽ ഉച്ചസമയ കള്ളികളിൽ ഏറ്റവും വലിയ സംഖ്യകൾ. ഒരു വരയിലെ എല്ലാ കള്ളികളും കൂടി 100.'],
['തടസ്സങ്ങൾ വരയ്ക്കുക, ബാക്കി കൂട്ടുക','ഡോം മരങ്ങളെയും കെട്ടിടങ്ങളെയും ചാർട്ടിൽ പ്രതിഫലിപ്പിക്കുന്നു. വരച്ച തടസ്സത്തിനുള്ളിലെ ഓരോ കള്ളിയും നഷ്ടമാണ്. ഒരു മാസവരയിൽ ബാക്കിയുള്ള സംഖ്യകൾ കൂട്ടുക: അതാണ് ആ മാസത്തെ സോളാർ ആക്സസ്.']],
xp_alt:'ഉന്നതി',xp_brg:'ദിശാകോൺ',xp_xaxis:'ദിശാകോൺ (°) →',xp_yaxis:'ഉന്നതി (°) ↑',xp_hz:'ചക്രവാളം 0°',xp_zen:'തലയ്ക്കു മുകളിൽ 90°',xp_sum:'ആകെ',xp_k:'ഗ്രാഫ് വളയ്ക്കുക',xp_access:'സോളാർ ആക്സസ്',xp_replay:'വീണ്ടും',xp_time:'സൗരസമയം',
xp_ax:['രണ്ട് കോണുകൾ സൂര്യന്റെ സ്ഥാനം നിശ്ചയിക്കുന്നു: ഉന്നതി, ദിശാകോൺ','X അക്ഷം: ദിശാകോൺ 0–360° · Y അക്ഷം: ഉന്നതി 0–90°','കേന്ദ്രത്തിനു ചുറ്റുമുള്ള കോൺ: ദിശാകോൺ · അരികിൽ നിന്ന് ഉള്ളിലേക്കുള്ള ദൂരം: ഉന്നതി'],
lg_h:'ചാർട്ടിലെ ലേബലുകൾ: ഹൈലൈറ്റ് ചെയ്യാൻ ഒന്നിൽ ടാപ്പ് ചെയ്യുക',lg_none:'ചാർട്ടിൽ ഹൈലൈറ്റ് ചെയ്യാൻ മുകളിലെ ഒരു ലേബലിൽ ടാപ്പ് ചെയ്യുക.',
lg:[['month','മാസ വരകൾ','ഓരോ വളഞ്ഞ വരയും ഒരു മാസത്തിന്റെ മധ്യദിവസത്തെ സൂര്യപഥമാണ്, കിഴക്കുവശത്തെ ഉദയം മുതൽ പടിഞ്ഞാറുവശത്തെ അസ്തമയം വരെ. സൂര്യന്റെ ഉയരം വർഷത്തിൽ രണ്ടുതവണ ആവർത്തിക്കുന്നതിനാൽ ഒരു വര രണ്ട് മാസങ്ങൾക്ക് ഉപയോഗിക്കുന്നു: ജനു/നവം, ഫെബ്രു/ഒക്ടോ, മാർച്ച്/സെപ്റ്റം, ഏപ്രി/ഓഗ, മേയ്/ജൂലൈ. ജൂണിനും ഡിസംബറിനും ഓരോ വര സ്വന്തമായുണ്ട്. മാസപ്പേരുകൾ ഓരോ വരയുടെയും പടിഞ്ഞാറേ അറ്റത്തിനടുത്താണ്. മാർച്ച്/സെപ്റ്റം വര വിഷുവമാണ് (equinox): സൂര്യൻ കൃത്യം കിഴക്ക് ഉദിച്ച് കൃത്യം പടിഞ്ഞാറ് അസ്തമിക്കുന്നു. ചാർട്ടിനു താഴെ മാസം തിരഞ്ഞെടുത്ത് അതിന്റെ വര ഹൈലൈറ്റ് ചെയ്യുക.'],
['hour','മണിക്കൂർ വരകൾ','മാസവരകളെ മുറിച്ചുകടക്കുന്ന വരകൾ സൗര മണിക്കൂറുകളാണ്; അവയുടെ നമ്പറുകൾ ചക്രവാള അറ്റത്തിനടുത്താണ്. സൗരസമയം 12 (സൗര ഉച്ച) യഥാർത്ഥ വ–തെ രേഖയിലാണ്; അപ്പോൾ സൂര്യൻ ഏറ്റവും ഉയരത്തിൽ. രാവിലത്തെ മണിക്കൂറുകൾ കിഴക്ക് (ഇടത്) ഭാഗത്തും ഉച്ചകഴിഞ്ഞുള്ളവ പടിഞ്ഞാറ് (വലത്) ഭാഗത്തും. ഭൂമി ഓരോ മണിക്കൂറിലും 15° തിരിയുന്നു. രണ്ട് മണിക്കൂർ വരകൾക്കിടയിൽ രണ്ട് അര മണിക്കൂർ കള്ളികൾ, ഉദാഹരണം 9:00–9:30, 9:30–10:00. ഇവ സൗരസമയമാണ്, വാച്ചിലെ സമയമല്ല; മാറ്റാൻ താഴെയുള്ള ബോക്സ് കാണുക.'],
['pct','ശതമാന സംഖ്യകൾ','ഓരോ സംഖ്യയും ഒരു മാസവരയിലെ ഒരു അര മണിക്കൂർ കള്ളിയിലാണ്. ആ ദിവസത്തെ ആകെ സൗരോർജ്ജത്തിൽ ആ അര മണിക്കൂറിൽ എത്തുന്ന ഭാഗമാണ് അത്. {m} മാസത്തിൽ ഏറ്റവും വലിയ കള്ളി {a}–{b} ആണ്, അതിൽ “{v}”: ദിവസത്തെ ഊർജ്ജത്തിന്റെ {v}% ആ സമയത്ത് എത്തുന്നു. ഒരു വരയിലെ എല്ലാ കള്ളികളും കൂടി 100. സൂര്യൻ ഉയരത്തിലായതിനാലും പ്രകാശം കുറഞ്ഞ വായുവിലൂടെ കടന്നുപോകുന്നതിനാലും ഉച്ചസമയ കള്ളികൾ ഏറ്റവും വലുതാണ്; അതിരാവിലെയും വൈകുന്നേരവുമുള്ളവ ചെറുതാണ്. ഈ ട്രെയിനറിൽ സംഖ്യകൾ തെളിഞ്ഞ ആകാശ മോഡലിൽ നിന്നാണ്; അച്ചടിച്ച ചാർട്ടിൽ അവ നിർമ്മാതാവിന്റേതാണ്.'],
['ring','ഉന്നതി വൃത്തങ്ങൾ','കേന്ദ്രത്തിൽ നിന്നുള്ള ദൂരം സൂര്യന്റെ ഉയരം കാണിക്കുന്നു. പുറം അരിക് ചക്രവാളം (0°). കുത്തുവര വൃത്തങ്ങൾ 30°, 60°. കേന്ദ്രം നേരെ തലയ്ക്കു മുകളിൽ (90°). മുകൾഭാഗം 30° വൃത്തം വരെ എത്തുന്ന തടസ്സം, ആ ദിശയിൽ സൂര്യൻ 30° ൽ താഴെയാകുമ്പോഴെല്ലാം അതിനെ മറയ്ക്കും. ഈ ട്രെയിനറിൽ വൃത്തങ്ങൾ തുല്യ അകലത്തിലാണ്; അച്ചടിച്ച ചാർട്ടിന്റെ സ്കെയിൽ അതിന്റെ ഡോമിനനുസരിച്ചാണ്.'],
['brg','ദിശാകോൺ സ്കെയിൽ','അരികിനു ചുറ്റുമുള്ള ഡിഗ്രികൾ യഥാർത്ഥ വടക്കിൽ നിന്നുള്ള ദിശ കാണിക്കുന്നു: വ 0°, കി 90°, തെ 180°, പ 270°, ഓരോ 10° ലും ഒരു അടയാളം. ഭൂമധ്യരേഖയ്ക്ക് വടക്കുള്ള സൈറ്റിന് ചാർട്ടിൽ തെ മുകളിൽ, കി ഇടതുവശത്ത്, പ വലതുവശത്ത്. തടസ്സങ്ങളുടെ ദിശ കണ്ടെത്താനും ചാർട്ട് കാന്തിക ദിക്ഭ്രംശത്തിന്റെ അളവിൽ തിരിച്ചിട്ടുണ്ടോ എന്ന് പരിശോധിക്കാനും ഇത് ഉപയോഗിക്കുക.'],

/* ================= SOLAR ENGINE ================= */
const D2R=Math.PI/180, norm360=b=>((b%360)+360)%360;
const decl=n=>23.45*Math.sin(D2R*360*(284+n)/365);
const eot=n=>{const B=D2R*360*(n-81)/364;return 9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B)};
const MID=[17,47,75,105,135,162,198,228,258,288,318,344];
function sunAt(lat,dec,ts){const p=lat*D2R,d=dec*D2R,h=15*(ts-12)*D2R;
  const alt=Math.asin(Math.sin(p)*Math.sin(d)+Math.cos(p)*Math.cos(d)*Math.cos(h))/D2R;
  const A=Math.atan2(Math.sin(h),Math.cos(h)*Math.sin(p)-Math.tan(d)*Math.cos(p))/D2R;
  return {alt,brg:norm360(180+A)}}
function dayLen(lat,dec){const x=-Math.tan(lat*D2R)*Math.tan(dec*D2R);if(x<=-1)return 12;if(x>=1)return 0;return Math.acos(x)/D2R/15}
function slots(lat,n){const dec=decl(n),out=[];let sum=0;
  for(let k=0;k<48;k++){const ts=k*.5+.25,s=sunAt(lat,dec,ts);let w=0;
    if(s.alt>.5){const sa=Math.sin(Math.max(s.alt,1)*D2R);w=sa*Math.pow(.7,Math.pow(1/sa,.678))}
    sum+=w;out.push({ts,alt:s.alt,brg:s.brg,w})}
  out.forEach(o=>o.w=sum?o.w/sum*100:0);return out.filter(o=>o.w>0)}
function inSpan(b,b1,b2){const sp=norm360(b2-b1)||360,d=norm360(b-b1);return d<=sp?(d/sp)*2-1:null}
function obsElev(o,b){const u=inSpan(b,o.b1,o.b2);if(u===null)return 0;return o.type==='tree'?o.e*(.6+.4*Math.sqrt(Math.max(0,1-u*u))):o.e}
const blocked=(alt,brg,obs)=>obs.some(o=>alt<obsElev(o,brg));
function access(lat,m,obs){let a=0;slots(lat,MID[m]).forEach(s=>{if(!blocked(s.alt,s.brg,obs))a+=s.w});return a}
function clockOf(ts,n){return ts-(4*(S.lon-15*S.tz)+eot(n))/60}
function hhmm(h){h=((h%24)+24)%24;let H=Math.floor(h),M=Math.round((h-H)*60);if(M===60){H=(H+1)%24;M=0}return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')}

/* ================= CHART (dome view) ================= */
const CX=300,CY=300,R=262;
const eqB=()=>S.lat>=0?180:0;
function P(alt,brg){const r=R*(90-Math.max(0,Math.min(90,alt)))/90,d=(brg-eqB())*D2R;return [CX+r*Math.sin(d),CY-r*Math.cos(d)]}
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const PAIRS=[[11],[0,10],[1,9],[2,8],[3,7],[4,6],[5]];
function pairName(pr){const m=t('months');return pr.map(i=>m[i]).join('/')}
function chartSVG(o){
  const lat=S.lat;let s='';const gid='g'+Math.random().toString(36).slice(2,7);
  s+=`<defs><radialGradient id="${gid}" cx="38%" cy="30%" r="70%"><stop offset="0" stop-color="var(--glass)" stop-opacity=".9"/><stop offset=".35" stop-color="var(--glass)" stop-opacity=".15"/><stop offset="1" stop-color="var(--glass)" stop-opacity="0"/></radialGradient></defs>`;
  s+=`<circle cx="${CX}" cy="${CY}" r="${R}" class="c-sky"/><g class="g g-ring">`;
  [30,60].forEach(a=>s+=`<circle cx="${CX}" cy="${CY}" r="${(R*(90-a)/90).toFixed(1)}" class="c-ring"/>`);
  if(!o.compact){
    s+=`<text x="${CX+4}" y="${CY-R*60/90+12}" class="c-deg" text-anchor="start">30°</text><text x="${CX+4}" y="${CY-R*30/90+12}" class="c-deg">60°</text>`;
    if(o.ringX)s+=`<text x="${CX+4}" y="${CY-R+12}" class="c-deg">0°</text><circle cx="${CX}" cy="${CY}" r="5" fill="var(--accent)"/><text x="${CX+10}" y="${CY+14}" class="c-deg" text-anchor="start">90°</text>`;
  }
  s+=`</g><g class="g g-hr">`;
  // hour lines
  for(let hr=5;hr<=19;hr++){const ln=[];let lab=null,minA=99;
    for(let d=-23.44;d<=23.45;d+=1){const sp=sunAt(lat,d,hr);if(sp.alt>0){const p=P(sp.alt,sp.brg);ln.push(p);if(sp.alt<minA&&sp.alt>2){minA=sp.alt;lab={p,alt:sp.alt,brg:sp.brg}}}}
    if(ln.length>1){s+=`<polyline points="${pts(ln)}" class="c-hr"/>`;
      if(lab&&!o.compact){const q=P(lab.alt-9,lab.brg);s+=`<text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}" class="c-hrl">${hr}</text>`}}}
  s+=`</g><g class="g g-mo">`;
  // month arcs (paired)
  PAIRS.forEach((pr,i)=>{const dec=pr.reduce((a,m)=>a+decl(MID[m]),0)/pr.length,H=dayLen(lat,dec);if(H<=0)return;const ln=[];
    for(let ts=12-H;ts<=12+H+1e-6;ts+=H/40){const sp=sunAt(lat,dec,ts);ln.push(P(sp.alt,sp.brg))}
    const sel=o.month!=null&&pr.includes(o.month);
    s+=`<polyline points="${pts(ln)}" class="c-arc${sel?' sel':''}"/>`;
    if(!o.compact){const ss=sunAt(lat,dec,12+H-.45),q=P(ss.alt,ss.brg),rt=q[0]>CX;s+=`<text x="${(q[0]+(rt?-6:6)).toFixed(1)}" y="${(q[1]).toFixed(1)}" class="c-ml" text-anchor="${rt?'end':'start'}">${pairName(pr)}</text>`}});
  s+=`</g>`;
  // obstacles
  (o.obs||[]).forEach(ob=>{const sp=norm360(ob.b2-ob.b1)||360,up=[],dn=[];
    for(let d=0;d<=sp+1e-6;d+=Math.max(.5,sp/80)){const b=ob.b1+d;up.push(P(obsElev(ob,norm360(b)+0),b));dn.unshift(P(0,b))}
    s+=`<polygon points="${pts(up.concat(dn))}" class="c-obs"/>`;
    if(!o.compact&&ob.name){const mb=ob.b1+sp/2,q=P(Math.max(ob.e*.45,4),mb);s+=`<text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}" class="c-obl">${esc(ob.name)}</text>`}});
  // numbers
  s+=`<g class="g g-num">`;
  if(o.nums&&o.month!=null){slots(lat,MID[o.month]).forEach(c=>{const v=Math.round(c.w);if(v<1)return;const q=P(c.alt,c.brg);const sh=blocked(c.alt,c.brg,o.obs||[]);
    s+=`<text x="${q[0].toFixed(1)}" y="${q[1].toFixed(1)}" class="c-num${sh?' sh':''}">${v}</text>`})}
  s+=`</g>`;
  // edge + ticks + labels
  s+=`<circle cx="${CX}" cy="${CY}" r="${R}" class="c-edge"/><g class="g g-brg">`;
  const dirs=t('dirs');
  for(let b=0;b<360;b+=10){const a=P(0,b),c=P(b%30?3:6,b);s+=`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${c[0].toFixed(1)}" y2="${c[1].toFixed(1)}" class="c-tick"/>`;
    const d=(b-eqB())*D2R,rr=R+(b%90?18:24),x=CX+rr*Math.sin(d),y=CY-rr*Math.cos(d);
    if(b%90===0)s+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="c-dir">${dirs[b/90]}</text>`;
    else if(b%30===0&&!o.compact)s+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" class="c-deg">${b}°</text>`}
  s+=`</g>`;
  if(o.latLabel){const lt=`${Math.abs(lat).toFixed(1)}° ${lat>=0?'N':'S'}`;s+=`<g class="g g-lat"><rect x="-36" y="-36" width="150" height="40" rx="6" class="c-latb"/><text x="-26" y="-8" class="c-latl">${lt}</text></g>`}
  // sun
  if(o.sun&&o.sun.alt>0){const q=P(o.sun.alt,o.sun.brg),sh=blocked(o.sun.alt,o.sun.brg,o.obs||[]);
    s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="15" class="c-sun${sh?' sh':''}"/>`;
    if(!sh)for(let k=0;k<8;k++){const a=k*Math.PI/4;s+=`<line x1="${(q[0]+19*Math.cos(a)).toFixed(1)}" y1="${(q[1]+19*Math.sin(a)).toFixed(1)}" x2="${(q[0]+26*Math.cos(a)).toFixed(1)}" y2="${(q[1]+26*Math.sin(a)).toFixed(1)}" stroke="var(--sun)" stroke-width="3" stroke-linecap="round"/>`}}
  if(o.glass)s+=`<circle cx="${CX}" cy="${CY}" r="${R}" fill="url(#${gid})" class="c-glare"/>`;
  return s}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderQuiz(){const Q=t('qs');let sc=0;
  $('qList').innerHTML=Q.map((q,i)=>{const a=S.quiz[i];if(a===q[2])sc++;
    return `<div class="card q"><h3>${i+1}. ${q[0]}</h3><div class="opts">${q[1].map((o,k)=>`<button data-q="${i}" data-o="${k}" class="${a!=null?(k===q[2]?'right':(k===a?'wrong':'')):''}" ${a!=null?'disabled':''}>${o}</button>`).join('')}</div>${a!=null?`<p class="qex">${q[3]}</p>`:''}</div>`}).join('');
  $('qScore').textContent=`${t('q_score')}: ${sc} / ${Q.length}`}

/* ================= NAV / EVENTS ================= */
function setTab(i){S.tab=((i%NP)+NP)%NP;document.querySelectorAll('section.panel').forEach((p,k)=>p.classList.toggle('on',k===S.tab));
  document.querySelectorAll('#tabs button').forEach((b,k)=>b.setAttribute('aria-selected',k===S.tab));
  const b=$('tab'+S.tab);b&&b.scrollIntoView({block:'nearest',inline:'nearest'});savePrefs()}
function setTheme(th){S.theme=th;if(th)document.documentElement.setAttribute('data-theme',th);else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('#themeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===th));savePrefs()}
function setFs(v){S.fs=Math.max(12,Math.min(36,v));document.documentElement.style.fontSize=S.fs+'px';$('fsVal').textContent=S.fs;savePrefs()}
function savePrefs(){store.set({lang:S.lang,theme:S.theme,fs:S.fs,tab:S.tab})}
function readLoc(){S.lat=Math.max(-66,Math.min(66,+$('locLat').value||0));S.lon=+$('locLon').value||0;S.tz=+$('locTz').value||0;S.mdec=+$('locDec').value||0;
  renderParts();renderTN();renderPL();renderDiagram();renderStep();renderSim();}

document.addEventListener('click',e=>{const el=e.target.closest('[data-lgd],[data-xp],[data-tab],[data-part],[data-step],[data-rm],[data-q],[data-ex],.bar-g,[data-th],[data-lg]');if(!el)return;
  if(el.dataset.lgd!=null){S.hl=S.hl===el.dataset.lgd?null:el.dataset.lgd;renderDiagram()}
  else if(el.dataset.xp!=null){xpGo(+el.dataset.xp)}
  else if(el.dataset.tab!=null)setTab(+el.dataset.tab);
  else if(el.dataset.part!=null){S.part=+el.dataset.part;renderParts()}
  else if(el.dataset.step!=null){S.step=+el.dataset.step;renderStep()}
  else if(el.dataset.rm!=null){S.obs.splice(+el.dataset.rm,1);S.preset=-1;$('sPreset').value=-1;renderObsList();renderSim()}
  else if(el.dataset.q!=null){S.quiz[+el.dataset.q]=+el.dataset.o;renderQuiz()}
  else if(el.dataset.ex!=null){$('locLat').value=KOZ.lat;$('locLon').value=KOZ.lon;$('locTz').value=KOZ.tz;$('locName').value=KOZ.name;loadPreset(+el.dataset.ex);$('sPreset').value=S.preset;S.sMonth=+el.dataset.wm;$('sMonth').value=S.sMonth;S.sT=7;readLoc();renderObsList();renderSim();setTab(TAB.sim)}
  else if(el.classList.contains('bar-g')){S.sMonth=+el.dataset.m;$('sMonth').value=S.sMonth;renderSim()}
  else if(el.dataset.th!=null)setTheme(S.theme===el.dataset.th?null:el.dataset.th);
  else if(el.dataset.lg!=null){S.lang=el.dataset.lg;S.obs=S.obs.map(o=>o);if(S.preset>=0)loadPreset(S.preset);savePrefs();applyText()}});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;
  if(e.key==='ArrowRight'){setTab(S.tab+1);e.preventDefault()}else if(e.key==='ArrowLeft'){setTab(S.tab-1);e.preventDefault()}
  else if((e.key==='Enter'||e.key===' ')&&e.target.closest('.hot')){S.part=+e.target.closest('.hot').dataset.part;renderParts();e.preventDefault()}});
$('fsDn').onclick=()=>setFs(S.fs-2);$('fsUp').onclick=()=>setFs(S.fs+2);$('fsVal').onclick=()=>setFs(18);
$('fsBtn').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(err){}};
['locLat','locLon','locTz','locDec'].forEach(id=>$(id).addEventListener('input',readLoc));
$('locName').addEventListener('input',()=>renderStep());
$('locReset').onclick=()=>{$('locName').value=KOZ.name;$('locLat').value=KOZ.lat;$('locLon').value=KOZ.lon;$('locTz').value=KOZ.tz;$('locDec').value=KOZ.dec;readLoc()};
$('scPlay').onclick=()=>{scPlay=!scPlay;renderScene()};$('scBy').onchange=renderScene;
$('stPrev').onclick=()=>{S.step=Math.max(0,S.step-1);renderStep()};$('stNext').onclick=()=>{S.step=Math.min(8,S.step+1);renderStep()};
$('dMonth').onchange=e=>{S.dMonth=+e.target.value;S.dT=12-dayLen(S.lat,decl(MID[S.dMonth]))+.05;renderDiagram()};
$('dNums').onchange=renderDiagram;$('dPlay').onclick=()=>{S.dPlaying=!S.dPlaying;renderDiagram()};
$('sMonth').onchange=e=>{S.sMonth=+e.target.value;renderSim()};
$('sTime').oninput=e=>{S.sT=+e.target.value;S.sPlaying=false;renderSim()};
$('sPlay').onclick=()=>{S.sPlaying=!S.sPlaying;renderSim()};
$('sPreset').onchange=e=>{loadPreset(+e.target.value);renderObsList();renderSim()};
$('obsList').addEventListener('input',e=>{const el=e.target;if(el.dataset.ob==null)return;const o=S.obs[+el.dataset.ob],k=el.dataset.k;
  o[k]=(k==='name'||k==='type')?el.value:(+el.value||0);if(k==='e')o.e=Math.max(0,Math.min(89,o.e));S.preset=-1;$('sPreset').value=-1;renderSim()});
$('obAdd').onclick=()=>{const H1=+$('cH').value,h1=+$('ch').value,D1=+$('cD').value;const e=D1>0?Math.round(Math.atan((H1-h1)/D1)/D2R*10)/10:30;
  S.obs.push({name:t('newob'),type:'bldg',b1:200,b2:230,e:Math.max(0,e)});S.preset=-1;$('sPreset').value=-1;renderObsList();renderSim()};
['cH','ch','cD','sKwp','sYld'].forEach(id=>$(id).addEventListener('input',renderSim));
$('tnX').onchange=renderTN;$('tnMag').addEventListener('input',renderTN);
$('tnMonth').onchange=e=>{S.tnMonth=+e.target.value;renderShadow()};
$('tnPlay').onclick=()=>{S.tnPlaying=!S.tnPlaying;renderShadow()};
$('xpPrev').onclick=()=>xpGo(XP.st-1);$('xpNext').onclick=()=>xpGo(XP.st+1);
$('xpPlay').onclick=()=>{XP.play=!XP.play;xpRender()};
$('xpReplay').onclick=()=>{XP.t=0;XP.k=null;XP.play=true;xpRender()};
$('xpMonth').onchange=e=>{XP.m=+e.target.value;xpRender()};
$('xpK').oninput=e=>{XP.k=+e.target.value;XP.play=false;xpRender()};
$('qReset').onclick=()=>{S.quiz={};renderQuiz()};

let last=0;function loop(ts){const dt=last?(ts-last)/1000:0;last=ts;
  if(S.dPlaying&&S.tab===TAB.diag){const H=dayLen(S.lat,decl(MID[S.dMonth]));S.dT+=dt*1.2;if(S.dT>12+H)S.dT=12-H+.05;renderDiagram()}
  if(S.sPlaying&&S.tab===TAB.sim){const H=dayLen(S.lat,decl(MID[S.sMonth]));S.sT+=dt*1.0;if(S.sT>12+H)S.sT=12-H+.05;renderSim()}
  if(S.tnPlaying&&S.tab===TAB.tn){const H=dayLen(S.lat,decl(MID[S.tnMonth]));S.tnT+=dt*1.0;if(S.tnT>12+H-.2)S.tnT=12-H+.3;renderShadow()}
  if(S.tab===TAB.xp&&XP.play){XP.t+=dt;xpRender()}
  requestAnimationFrame(loop)}

/* ================= INIT ================= */
(function init(){const p=store.get();if(p.lang&&T[p.lang])S.lang=p.lang;if(p.fs)S.fs=p.fs;if(p.tab!=null&&p.tab<NP)S.tab=p.tab;
  setFs(S.fs);setTheme(p.theme||null);loadPreset(1);applyText();setTab(S.tab);requestAnimationFrame(scLoop);requestAnimationFrame(loop)})();
</script>

</body></html>
