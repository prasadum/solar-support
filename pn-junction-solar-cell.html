<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semiconductors, PN Junction and Solar Cell</title>
<style>
:root{
  --paper:#F6F8FB; --card:#FFFFFF; --ink:#13202E; --muted:#4B5A6B;
  --navy:#1B3A66; --sky:#E4EDF7; --line:#C8D3DF; --sun:#B86E00; --sunfill:#F2B233;
  --fs:20px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#111A24;--card:#18232F;--ink:#E9EEF4;--muted:#A9B6C4;--navy:#8DB4E8;--sky:#1F2E3E;--line:#34475B}}
:root[data-theme="dark"]{--paper:#111A24;--card:#18232F;--ink:#E9EEF4;--muted:#A9B6C4;--navy:#8DB4E8;--sky:#1F2E3E;--line:#34475B}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);line-height:1.5;
 font-family:"Segoe UI","Nirmala UI","Noto Sans","Noto Sans Devanagari","Noto Sans Malayalam",Arial,sans-serif}
html[lang="hi"] body,html[lang="ml"] body{line-height:1.65}
h1,h2,h3,.tabbtn,.big,th{font-family:Bahnschrift,"DIN Alternate","Segoe UI Semibold","Nirmala UI","Noto Sans Devanagari","Noto Sans Malayalam",Arial,sans-serif}
h1{font-size:1.55rem;margin:0;font-weight:600}
h2{font-size:1.5rem;margin:0 0 .7rem;color:var(--navy);font-weight:600}
h3{font-size:1.15rem;margin:1.6rem 0 .5rem;font-weight:600}
p{margin:.4rem 0 .7rem}
header.top{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:flex-end;justify-content:space-between;padding:.9rem clamp(1rem,3vw,2.2rem) .6rem;background:var(--card);border-bottom:1px solid var(--line)}
header .sub{color:var(--muted);font-size:.82rem}
.stamp{font-size:.72rem;color:var(--muted);text-align:right;margin-top:.25rem}
.tools{display:flex;gap:.35rem;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.tools button,.tools select{font:inherit;font-size:.8rem;padding:.25rem .6rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px;cursor:pointer}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);overflow-x:auto;white-space:nowrap;padding:0 clamp(.5rem,2vw,1.6rem)}
.tabbtn{display:inline-block;font-size:.85rem;color:#DCE7F5;background:none;border:0;padding:.7rem .8rem .6rem;cursor:pointer;border-bottom:4px solid transparent}
.tabbtn[aria-selected="true"]{color:#fff;border-bottom-color:var(--sunfill);font-weight:600}
.tabbtn .n{opacity:.7;margin-right:.3rem}
:focus-visible{outline:3px solid var(--sunfill);outline-offset:2px}
main{max-width:1280px;margin:0 auto;padding:1.2rem clamp(1rem,3vw,2.2rem) 3rem}
section.panel{display:none}section.panel.active{display:block}
.stage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);gap:1.2rem 1.6rem;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem}
svg{display:block;width:100%;height:auto;user-select:none}
svg text{font-family:"Segoe UI","Nirmala UI","Noto Sans Devanagari","Noto Sans Malayalam",Arial,sans-serif}
.ctrl{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.8rem 1rem}
.ctrl p{font-size:.92rem}
.lbl{display:block;font-size:.8rem;color:var(--muted);margin:.7rem 0 .2rem}
input[type=range]{width:100%;accent-color:var(--navy);height:1.6rem}
.seg{display:flex;flex-wrap:wrap;gap:.3rem;margin:.3rem 0}
.seg button,.btn{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.4rem .75rem;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary{background:var(--sunfill);border-color:var(--sun);color:#13202E;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:.4rem;margin:.6rem 0}
.readout{display:flex;justify-content:space-between;gap:.8rem;align-items:baseline;border-bottom:1px dashed var(--line);padding:.3rem 0;font-size:.88rem}
.readout b{font-family:Bahnschrift,"Segoe UI",sans-serif;font-size:1.15rem;color:var(--navy)}
.big{font-size:1.6rem;font-weight:600;color:var(--navy)}
.note{background:var(--sky);border-left:5px solid var(--sun);padding:.55rem .8rem;margin:.8rem 0;font-size:.88rem}
.steps{padding-left:0;list-style:none;margin:.5rem 0}
.steps li{padding:.4rem .6rem;margin:.25rem 0;border-radius:5px;font-size:.88rem;color:var(--muted);border-left:4px solid var(--line)}
.steps li.on{background:#FFF4D6;color:var(--ink);border-left-color:var(--sunfill);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.78rem;color:var(--muted);margin:.5rem .3rem 0}
.legend span{display:inline-flex;align-items:center;gap:.35rem}
.chk{display:flex;gap:.45rem;align-items:center;font-size:.85rem;margin:.35rem 0;cursor:pointer}
.chk input{width:1.1rem;height:1.1rem;accent-color:var(--navy)}
.tablewrap{overflow-x:auto;margin:.6rem 0;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:.4rem .6rem;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--sky)}
td.n,th.n{text-align:right;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:.5rem}
.stepper button{font:inherit;width:2.2rem;height:2.2rem;border:1px solid var(--line);background:var(--card);border-radius:5px;cursor:pointer;font-size:1.1rem}
.stepper b{min-width:2.5rem;text-align:center;font-size:1.3rem;color:var(--navy)}
.formula{font-family:Consolas,"Cascadia Mono",monospace;font-size:.85rem;background:var(--paper);padding:.5rem .7rem;border-radius:5px;white-space:pre-wrap}
footer{max-width:1280px;margin:0 auto;padding:1rem clamp(1rem,3vw,2.2rem) 2rem;color:var(--muted);font-size:.72rem;border-top:1px solid var(--line)}
@media print{nav.tabs,.tools{display:none}section.panel{display:block;page-break-after:always}}
</style>
</head>
<body>
<header class="top">
 <div><h1 data-t="title"></h1><div class="sub" data-t="subtitle"></div></div>
 <div>
  <div class="tools">
   <select id="langSel" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="ml">മലയാളം</option></select>
   <button id="playBtn" title="Pause / play animation">⏸</button>
   <button id="fsDown">A−</button><button id="fsUp">A+</button>
   <button id="prevTab">◀</button><button id="nextTab">▶</button>
  </div>
  <div class="stamp" data-t="stamp"></div>
 </div>
</header>
<nav class="tabs" role="tablist" id="tablist"></nav>
<main>

<!-- 1 ATOM & BANDS -->
<section class="panel" id="atom" role="tabpanel">
 <h2 data-t="atom_h"></h2>
 <div class="stage">
  <figure><svg id="atomSVG" viewBox="0 0 440 440" role="img" aria-label="Atom model"></svg></figure>
  <aside class="ctrl">
   <p data-t="atom_p"></p>
   <span class="lbl" data-t="atom_pick"></span>
   <div class="seg" id="atomSeg"></div>
   <div class="readout"><span data-t="atom_val"></span><b id="atomVal">4</b></div>
   <div class="readout"><span data-t="group"></span><b id="atomGroup"></b></div>
   <label class="chk"><input type="checkbox" id="atomHL" checked><span data-t="atom_hl"></span></label>
  </aside>
 </div>
 <h3 data-t="bands_h"></h3>
 <div class="stage">
  <figure><svg id="bandSVG" viewBox="0 0 560 380" role="img" aria-label="Energy bands"></svg></figure>
  <aside class="ctrl">
   <p data-t="bands_p"></p>
   <div class="seg" id="bandSeg"></div>
   <span class="lbl"><span data-t="temp"></span>: <b id="bandTv"></b></span>
   <input type="range" id="bandT" min="0" max="500" value="300">
   <div class="note" id="bandOut"></div>
  </aside>
 </div>
</section>

<!-- 2 CRYSTAL -->
<section class="panel" id="crystal" role="tabpanel">
 <h2 data-t="crystal_h"></h2>
 <div class="stage">
  <figure><svg id="xtalSVG" viewBox="0 0 640 440" role="img" aria-label="Silicon crystal lattice"></svg><div class="legend" data-legend="1"></div></figure>
  <aside class="ctrl">
   <p data-t="crystal_p1"></p><p data-t="crystal_p2"></p>
   <span class="lbl" data-t="energy"></span>
   <input type="range" id="xtalE" min="0" max="8" value="3">
   <span class="lbl" data-t="field"></span>
   <div class="seg" id="xtalField"><button data-v="0" aria-pressed="true" data-t="fieldOff"></button><button data-v="1" aria-pressed="false" data-t="fieldOn"></button></div>
   <div class="readout"><span data-t="nfree"></span><b id="xtalN">0</b></div>
   <div class="readout"><span data-t="nholes"></span><b id="xtalP">0</b></div>
   <div class="note" data-t="intrinsic_note"></div>
  </aside>
 </div>
</section>

<!-- 3 DOPING -->
<section class="panel" id="doping" role="tabpanel">
 <h2 data-t="doping_h"></h2>
 <div class="stage">
  <figure><svg id="dopSVG" viewBox="0 0 640 440" role="img" aria-label="Doping lattice"></svg><div class="legend" data-legend="2"></div></figure>
  <aside class="ctrl">
   <p data-t="doping_p"></p>
   <div class="seg" id="dopSeg"><button data-v="P" aria-pressed="true" data-t="addP"></button><button data-v="B" aria-pressed="false" data-t="addB"></button></div>
   <div class="btns"><button class="btn primary" id="dopAuto" data-t="auto"></button><button class="btn" id="dopClear" data-t="clear"></button></div>
   <div class="readout"><span data-t="nfree"></span><b id="dopE">0</b></div>
   <div class="readout"><span data-t="nholes"></span><b id="dopH">0</b></div>
   <div class="readout"><span data-t="ions_pos"></span><b id="dopIP">0</b></div>
   <div class="readout"><span data-t="ions_neg"></span><b id="dopIN">0</b></div>
   <div class="big" id="dopRes"></div>
   <div class="note"><span data-t="dop_note1"></span><br><span data-t="dop_note2"></span><br><span data-t="dop_note3"></span></div>
  </aside>
 </div>
</section>

<!-- 4 N & P -->
<section class="panel" id="np" role="tabpanel">
 <h2 data-t="np_h"></h2>
 <div class="stage">
  <figure><svg id="npSVG" viewBox="0 0 800 330" role="img" aria-label="n-type and p-type blocks"></svg><div class="legend" data-legend="3"></div></figure>
  <aside class="ctrl">
   <span class="lbl" data-t="fieldDir"></span>
   <div class="seg" id="npField"><button data-v="0" aria-pressed="true" data-t="fieldOff"></button><button data-v="1" aria-pressed="false" data-t="fieldOn"></button></div>
   <div class="note" data-t="np_note"></div>
   <div class="note" data-t="np_drift"></div>
  </aside>
 </div>
 <div class="tablewrap"><table>
  <thead><tr><th></th><th data-t="ntype"></th><th data-t="ptype"></th></tr></thead>
  <tbody>
   <tr><td data-t="dopant"></td><td data-t="donor"></td><td data-t="acceptor"></td></tr>
   <tr><td data-t="maj"></td><td data-t="electrons"></td><td data-t="holes"></td></tr>
   <tr><td data-t="min"></td><td data-t="holes"></td><td data-t="electrons"></td></tr>
   <tr><td data-t="fixedions"></td><td>⊕</td><td>⊖</td></tr>
   <tr><td data-t="neutral"></td><td data-t="neutralv"></td><td data-t="neutralv"></td></tr>
  </tbody></table></div>
</section>

<!-- 5 JUNCTION -->
<section class="panel" id="junction" role="tabpanel">
 <h2 data-t="junc_h"></h2>
 <div class="stage">
  <figure><svg id="juncSVG" viewBox="0 0 800 330" role="img" aria-label="PN junction formation"></svg><div class="legend" data-legend="3"></div></figure>
  <aside class="ctrl">
   <div class="btns"><button class="btn primary" id="juncJoin" data-t="join"></button><button class="btn" id="juncReset" data-t="reset"></button></div>
   <div class="seg" id="juncMat"><button data-v="Si" aria-pressed="true" data-t="si"></button><button data-v="Ge" aria-pressed="false" data-t="ge"></button></div>
   <ol class="steps" id="juncSteps"><li data-t="step1"></li><li data-t="step2"></li><li data-t="step3"></li><li data-t="step4"></li></ol>
   <div class="readout"><span data-t="barrier"></span><b id="juncV">0.00 V</b></div>
  </aside>
 </div>
</section>

<!-- 6 DEPLETION -->
<section class="panel" id="depl" role="tabpanel">
 <h2 data-t="depl_h"></h2>
 <div class="stage">
  <figure><svg id="deplSVG" viewBox="0 0 800 560" role="img" aria-label="Depletion layer profiles"></svg></figure>
  <aside class="ctrl">
   <span class="lbl"><span data-t="bias"></span>: <b id="deplVv"></b></span>
   <input type="range" id="deplV" min="-5" max="0.6" step="0.05" value="0">
   <span class="lbl" data-t="ratio"></span>
   <div class="seg" id="deplR"><button data-v="1,1" aria-pressed="true">1 : 1</button><button data-v="1,4" aria-pressed="false">1 : 4</button><button data-v="4,1" aria-pressed="false">4 : 1</button></div>
   <div class="readout"><span data-t="width"></span><b id="deplW"></b></div>
   <div class="readout"><span data-t="barrierNow"></span><b id="deplB"></b></div>
   <div class="note" data-t="depl_note"></div>
  </aside>
 </div>
</section>

<!-- 7 BIAS -->
<section class="panel" id="bias" role="tabpanel">
 <h2 data-t="bias_h"></h2>
 <div class="stage">
  <figure><svg id="biasSVG" viewBox="0 0 800 400" role="img" aria-label="Diode bias circuit"></svg><div class="legend" data-legend="3"></div></figure>
  <aside class="ctrl">
   <div class="seg" id="biasMode"><button data-v="f" aria-pressed="true" data-t="fwd"></button><button data-v="r" aria-pressed="false" data-t="rev"></button></div>
   <span class="lbl"><span data-t="volt"></span>: <b id="biasVv"></b></span>
   <input type="range" id="biasV" min="0" max="100" value="40">
   <div class="readout"><span data-t="current"></span><b id="biasI"></b></div>
   <div class="readout"><span data-t="barrierNow"></span><b id="biasB"></b></div>
   <div class="big" id="biasState" style="font-size:1rem"></div>
   <div class="note" id="biasNote"></div>
  </aside>
 </div>
</section>

<!-- 8 VI -->
<section class="panel" id="vi" role="tabpanel">
 <h2 data-t="vi_h"></h2>
 <div class="stage">
  <figure><svg id="viSVG" viewBox="0 0 840 440" role="img" aria-label="Diode V-I characteristic"></svg></figure>
  <aside class="ctrl">
   <div class="seg" id="viMat"><button data-v="Si" aria-pressed="true" data-t="si"></button><button data-v="Ge" aria-pressed="false" data-t="ge"></button></div>
   <span class="lbl"><span data-t="volt"></span>: <b id="viVv"></b></span>
   <input type="range" id="viV" min="0" max="1000" value="850">
   <div class="readout"><span data-t="current"></span><b id="viI"></b></div>
   <div class="btns"><button class="btn primary" id="viRec" data-t="record"></button><button class="btn" id="viTrace" data-t="trace"></button><button class="btn" id="viClr" data-t="clearTbl"></button></div>
   <div class="tablewrap" style="max-height:9rem;overflow-y:auto"><table><thead><tr><th>#</th><th class="n" data-t="vcol"></th><th class="n" data-t="icol"></th></tr></thead><tbody id="viTbl"></tbody></table></div>
   <div class="note" data-t="vi_note"></div>
  </aside>
 </div>
</section>

<!-- 9 SOLAR CELL -->
<section class="panel" id="solar" role="tabpanel">
 <h2 data-t="solar_h"></h2>
 <div class="stage">
  <figure><svg id="solSVG" viewBox="0 0 800 440" role="img" aria-label="Solar cell working"></svg><div class="legend" data-legend="3"></div></figure>
  <aside class="ctrl">
   <span class="lbl"><span data-t="irr"></span>: <b id="solGv"></b></span>
   <input type="range" id="solG" min="0" max="1000" step="50" value="800">
   <div class="seg" id="solMode"><button data-v="o" aria-pressed="false" data-t="openC"></button><button data-v="l" aria-pressed="true" data-t="loadC"></button><button data-v="s" aria-pressed="false" data-t="shortC"></button></div>
   <div class="readout"><span>V</span><b id="solV"></b></div>
   <div class="readout"><span>I</span><b id="solI"></b></div>
   <div class="readout"><span data-t="power"></span><b id="solP"></b></div>
   <ol class="steps"><li class="on" data-t="solar_note1"></li><li class="on" data-t="solar_note2"></li><li class="on" data-t="solar_note3"></li></ol>
  </aside>
 </div>
</section>

<!-- 10 SOLAR IV -->
<section class="panel" id="iv" role="tabpanel">
 <h2 data-t="iv_h"></h2>
 <div class="stage">
  <figure><svg id="ivSVG" viewBox="0 0 800 450" role="img" aria-label="Solar cell I-V and P-V curves"></svg></figure>
  <aside class="ctrl">
   <span class="lbl"><span data-t="irr"></span>: <b id="ivGv"></b></span>
   <input type="range" id="ivG" min="100" max="1200" step="50" value="1000">
   <span class="lbl"><span data-t="temp2"></span>: <b id="ivTv"></b></span>
   <input type="range" id="ivT" min="0" max="75" value="25">
   <span class="lbl"><span data-t="loadR"></span>: <b id="ivRv"></b></span>
   <input type="range" id="ivR" min="0" max="100" value="45">
   <label class="chk"><input type="checkbox" id="ivPV" checked><span data-t="showPV"></span></label>
   <label class="chk"><input type="checkbox" id="ivFam"><span data-t="showFam"></span></label>
   <label class="chk"><input type="checkbox" id="ivFF" checked><span data-t="showFF"></span></label>
  </aside>
 </div>
 <div class="stage" style="margin-top:1rem">
  <div class="tablewrap"><table id="ivTbl"></table></div>
  <div class="ctrl">
   <div class="formula">FF = (Vmp × Imp) ÷ (Voc × Isc)
η  = Pmax ÷ (G × A) × 100</div>
   <p class="lbl" data-t="we_title"></p>
   <p style="font-size:.85rem" data-t="we_text"></p>
   <div class="formula">FF = (0.61 × 13.1) ÷ (0.72 × 13.9)
   = 7.99 ÷ 10.01 = 0.80
η  = 7.99 ÷ (1000 × 0.0331) × 100 = 24.1 %</div>
   <div class="note" data-t="iv_note"></div>
  </div>
 </div>
</section>

<!-- 11 ARRAY -->
<section class="panel" id="array" role="tabpanel">
 <h2 data-t="arr_h"></h2>
 <div class="stage">
  <figure><svg id="arrSVG" viewBox="0 0 800 400" role="img" aria-label="Array layout"></svg></figure>
  <aside class="ctrl">
   <span class="lbl" data-t="cellsPer"></span>
   <div class="seg" id="arrCells"><button data-v="36" aria-pressed="false">36</button><button data-v="60" aria-pressed="false">60</button><button data-v="72" aria-pressed="true">72</button></div>
   <span class="lbl" data-t="modSeries"></span>
   <div class="stepper"><button id="arrNmM">−</button><b id="arrNm">10</b><button id="arrNmP">+</button></div>
   <span class="lbl" data-t="strPar"></span>
   <div class="stepper"><button id="arrNpM">−</button><b id="arrNp">2</b><button id="arrNpP">+</button></div>
   <span class="lbl"><span data-t="irr"></span>: <b id="arrGv"></b></span>
   <input type="range" id="arrG" min="100" max="1200" step="50" value="1000">
   <div class="note" data-t="arr_note"></div>
  </aside>
 </div>
 <div class="stage" style="margin-top:1rem">
  <figure><svg id="arrPlot" viewBox="0 0 640 360" role="img" aria-label="Array I-V curve"></svg></figure>
  <div class="tablewrap"><table id="arrTbl"></table></div>
 </div>
</section>
</main>
<footer data-t="footer"></footer>

<script>
(function(){
"use strict";
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
function el(tag,a,p,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;if(p)p.appendChild(e);return e;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const C={e:"#1D5FD1",h:"#C0392B",don:"#F6C9C9",donS:"#B23A3A",acc:"#CFE0F7",accS:"#1B3A66",pReg:"#FCE9DD",nReg:"#E2EEFB",dep:"#FFF1B8",ink:"#13202E",mut:"#4B5A6B",line:"#C8D3DF",sun:"#F2B233",metal:"#9AA3AD"};

/* ================= LANGUAGE ================= */
const T={en:{
title:"Semiconductors, PN Junction and Solar Cell",
subtitle:"From the silicon atom to a working solar array – interactive",
stamp:"Prepared by PRASAD UM, VI, Vocational Instructor, NSTI Calicut",

const panels=[...document.querySelectorAll("section.panel")];
const tablist=$("tablist");
panels.forEach((p,i)=>{const b=document.createElement("button");b.className="tabbtn";b.setAttribute("role","tab");b.id="tab-"+p.id;b.onclick=()=>show(i);tablist.appendChild(b);});
const tabs=[...tablist.children];
let cur=0;
const onShow={};const ticks={};const renders=[];
function show(i){cur=(i+panels.length)%panels.length;panels.forEach((p,j)=>p.classList.toggle("active",j===cur));
 tabs.forEach((b,j)=>{b.setAttribute("aria-selected",j===cur);b.tabIndex=j===cur?0:-1});tabs[cur].scrollIntoView({block:"nearest",inline:"nearest"});
 try{history.replaceState(null,"","#"+panels[cur].id)}catch(e){} window.scrollTo({top:0}); if(onShow[panels[cur].id])onShow[panels[cur].id]();}
$("prevTab").onclick=()=>show(cur-1);$("nextTab").onclick=()=>show(cur+1);
document.addEventListener("keydown",e=>{const tg=e.target.tagName;if(tg==="INPUT"||tg==="SELECT")return;if(e.key==="ArrowRight"||e.key==="PageDown"){show(cur+1);e.preventDefault()}if(e.key==="ArrowLeft"||e.key==="PageUp"){show(cur-1);e.preventDefault()}});

function drawH(g,x,y,r){r=r||7;const c=el("g",{},g);el("circle",{cx:0,cy:0,r:r,fill:"#fff",stroke:C.h,"stroke-width":2.5},c);c.setAttribute("transform",`translate(${x},${y})`);return c;}
function drawIon(g,x,y,kind,s){s=s||20;const c=el("g",{},g);el("rect",{x:-s/2,y:-s/2,width:s,height:s,rx:3,fill:kind==="d"?C.don:C.acc,stroke:kind==="d"?C.donS:C.accS,"stroke-width":1.5},c);

const mv=(o)=>o.el.setAttribute("transform",`translate(${o.x.toFixed(1)},${o.y.toFixed(1)})`);
function flash(g,x,y,list){const c=el("circle",{cx:x,cy:y,r:4,fill:"none",stroke:C.sun,"stroke-width":3},g);list.push({el:c,t:0});}

function legendHTML(kind){const ic={e:`<svg width="18" height="18" viewBox="-9 -9 18 18" style="width:18px"><circle r="7" fill="${C.e}"/><rect x="-3.5" y="-1.2" width="7" height="2.4" fill="#fff"/></svg>`,
 h:`<svg width="18" height="18" viewBox="-9 -9 18 18" style="width:18px"><circle r="6.5" fill="#fff" stroke="${C.h}" stroke-width="2.5"/></svg>`,
 b:`<svg width="18" height="18" viewBox="-9 -9 18 18" style="width:18px"><circle r="5" fill="${C.e}"/></svg>`,
 d:`<svg width="18" height="18" viewBox="-9 -9 18 18" style="width:18px"><rect x="-8" y="-8" width="16" height="16" rx="3" fill="${C.don}" stroke="${C.donS}"/><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="${C.donS}">+</text></svg>`,

 const sets={1:["e","h","b"],2:["e","h","b"],3:["e","h","d","a"]};return sets[kind].map(k=>`<span>${ic[k]}${t("lg_"+k)}</span>`).join("");}
function sci(v){if(!(v>0))return "0";const s=v.toExponential(1).split("e");const sup={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","+":""};return s[0]+" × 10"+s[1].split("").map(c=>sup[c]).join("");}
function fmtI(A){const a=Math.abs(A);if(a>=1)return A.toFixed(2)+" A";if(a>=1e-3)return (A*1e3).toFixed(2)+" mA";if(a>=1e-6)return (A*1e6).toFixed(2)+" µA";return (A*1e9).toFixed(1)+" nA";}

/* ================= 1 ATOM ================= */
const ELEM={B:{Z:5,sh:[2,3],g:"g3"},Si:{Z:14,sh:[2,8,4],g:"g4"},P:{Z:15,sh:[2,8,5],g:"g5"},Ge:{Z:32,sh:[2,8,18,4],g:"g4"}};

function drawAtom(){const s=$("atomSVG");s.innerHTML="";const E=ELEM[atomSel],cx=220,cy=220;atomShells=[];const step=E.sh.length>3?45:56;
 E.sh.forEach((n,i)=>{const r=62+i*step,last=i===E.sh.length-1;el("circle",{cx,cy,r,fill:"none",stroke:last?"#E8A317":C.line,"stroke-width":last?2.5:2,"stroke-dasharray":"5 5"},s);
  const g=el("g",{},s);for(let j=0;j<n;j++){const a=2*Math.PI*j/n;el("circle",{cx:cx+r*Math.cos(a),cy:cy+r*Math.sin(a),r:last?10:7,fill:last&&$("atomHL").checked?"#E8A317":C.e,stroke:"#fff","stroke-width":1.5},g);}
  atomShells.push({g,ang:Math.random()*360,sp:50/(i+1)});});
 el("circle",{cx,cy,r:36,fill:"#B23A3A"},s);el("text",{x:cx,y:cy+2,"text-anchor":"middle",fill:"#fff","font-size":22,"font-weight":700},s,atomSel);
 el("text",{x:cx,y:cy+22,"text-anchor":"middle",fill:"#fff","font-size":14},s,E.Z+"+");
 el("text",{x:12,y:430,"font-size":15,fill:C.mut},s,E.sh.join(", "));

/* bands */
const MAT={cond:{Eg:-1,k:"mat_cond"},Ge:{Eg:0.66,k:"ge"},Si:{Eg:1.12,k:"si"},ins:{Eg:5.5,k:"mat_ins"}};
let bandSel="Si",bandDots=[];
(function(){const g=$("bandSeg");Object.keys(MAT).forEach(k=>{const b=document.createElement("button");b.dataset.v=k;b.dataset.k=MAT[k].k;b.setAttribute("aria-pressed",k===bandSel);g.appendChild(b);});
 seg("bandSeg",v=>{bandSel=v;drawBands();});$("bandT").oninput=drawBands;})();
function drawBands(){const s=$("bandSVG");s.innerHTML="";bandDots=[];[...$("bandSeg").children].forEach(b=>b.textContent=t(b.dataset.k));
 const M=MAT[bandSel],T_=+$("bandT").value;$("bandTv").textContent=T_+" K  ("+(T_-273)+" °C)";
 const sc=34,vbT=270,x=110,w=300;const gap=M.Eg>0?Math.min(M.Eg*sc,200):0;const cbB=M.Eg>0?vbT-gap:vbT+25,cbT=cbB-62;
 el("rect",{x,y:vbT,width:w,height:62,rx:4,fill:"#F3C7A0"},s);el("rect",{x,y:cbT,width:w,height:62,rx:4,fill:"#CFE2F7",opacity:.9},s);
 el("text",{x:x+w+12,y:cbT+36,"font-size":15,fill:C.ink},s,t("cb"));el("text",{x:x+w+12,y:vbT+36,"font-size":15,fill:C.ink},s,t("vb"));
 if(M.Eg>0){el("line",{x1:80,y1:cbB,x2:80,y2:vbT,stroke:C.ink,"stroke-width":2,"marker-start":"url(#m2)","marker-end":"url(#m2)"},s);
  el("text",{x:20,y:(cbB+vbT)/2+5,"font-size":15,"font-weight":700,fill:"#B86E00"},s,"Eg");el("text",{x:20,y:(cbB+vbT)/2+24,"font-size":13,fill:C.mut},s,M.Eg+" eV");}
 const defs=el("defs",{},s);const m=el("marker",{id:"m2",viewBox:"0 0 10 10",refX:5,refY:5,markerWidth:6,markerHeight:6,orient:"auto-start-reverse"},defs);el("path",{d:"M0,0 L10,5 L0,10z",fill:C.ink},m);
 let n=0,msg="";const k=8.617e-5;
 if(bandSel==="cond"){n=12;msg=t("overlap");}
 else if(T_<=0){n=0;msg=t("zeroK");}
 else{const ni=2.5e19*Math.pow(T_/300,1.5)*Math.exp(-M.Eg/(2*k*T_));n=ni>1?clamp(Math.round(Math.log10(ni)-6),0,14):0;msg=(M.Eg>3&&n===0)?t("noFree"):t("ni")+" "+sci(ni)+" "+t("percm");}
 const pos=[];for(let r=0;r<2;r++)for(let c=0;c<7;c++)pos.push([x+25+c*42+(r?21:0),vbT+20+r*24]);
 pos.forEach((p,i)=>{if(i<n&&bandSel!=="cond"){drawH(s,p[0],p[1]);const ex=x+25+(i%7)*42+rnd(-8,8),ey=cbT+20+(i>6?24:0);
   el("line",{x1:p[0],y1:p[1]-8,x2:ex,y2:ey+8,stroke:"#E8A317","stroke-width":1.5,"stroke-dasharray":"3 3"},s);const o={x:ex,y:ey,bx:ex,by:ey,el:drawE(s,ex,ey)};bandDots.push(o);}
  else{const o={x:p[0],y:p[1],bx:p[0],by:p[1],el:drawE(s,p[0],p[1],6)};if(bandSel==="cond")bandDots.push(o);}});
 if(bandSel==="cond")for(let i=0;i<10;i++){const o={x:x+25+i*28,y:cbT+30,bx:x+25+i*28,by:cbT+30};o.el=drawE(s,o.x,o.y);bandDots.push(o);}
 $("bandOut").textContent=msg;}
ticks.atom=dt=>{atomShells.forEach(o=>{o.ang+=o.sp*dt;o.g.setAttribute("transform",`rotate(${o.ang.toFixed(1)} 220 220)`)});
 bandDots.forEach(o=>{o.x=o.bx+Math.sin(performance.now()/300+o.bx)*6;o.y=o.by+Math.cos(performance.now()/350+o.bx)*3;mv(o);});};

/* ================= LATTICE (crystal + doping) ================= */
function makeLattice(svgId,onClick){
 const Lt={svg:$(svgId),atoms:[],bonds:[],free:[],field:0,flashes:[],hopT:0};
 const cols=7,rows=5,dx=86,dy=80,x0=62,y0=60;Lt.W=x0*2+(cols-1)*dx;Lt.H=y0*2+(rows-1)*dy;
 Lt.build=function(){const s=Lt.svg;s.innerHTML="";Lt.atoms=[];Lt.bonds=[];Lt.free=[];
  const gB=el("g",{},s),gD=el("g",{},s),gA=el("g",{},s);Lt.gF=el("g",{},s);Lt.gX=el("g",{},s);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)Lt.atoms.push({x:x0+c*dx,y:y0+r*dy,r,c,type:"Si",bonds:[]});
  const A=(r,c)=>Lt.atoms[r*cols+c];
  Lt.atoms.forEach(a=>{[[0,1],[1,0]].forEach(([dr,dc])=>{if(a.r+dr<rows&&a.c+dc<cols){const b=A(a.r+dr,a.c+dc);const h=dr===0;
    const bd={a,b,h,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,slots:[1,1],dots:[],nb:[]};
    [-7,7].forEach(o=>{el("line",{x1:a.x+(h?0:o),y1:a.y+(h?o:0),x2:b.x+(h?0:o),y2:b.y+(h?o:0),stroke:C.metal,"stroke-width":2},gB);});
    [-7,7].forEach(o=>bd.dots.push(el("circle",{cx:bd.mx+(h?0:o),cy:bd.my+(h?o:0),r:5.5,fill:C.e},gD)));
    Lt.bonds.push(bd);a.bonds.push(bd);b.bonds.push(bd);}});
   if(a.c===0)[-7,7].forEach(o=>el("line",{x1:a.x-40,y1:a.y+o,x2:a.x,y2:a.y+o,stroke:C.line,"stroke-width":2},gB));
   if(a.c===cols-1)[-7,7].forEach(o=>el("line",{x1:a.x,y1:a.y+o,x2:a.x+40,y2:a.y+o,stroke:C.line,"stroke-width":2},gB));
   if(a.r===0)[-7,7].forEach(o=>el("line",{x1:a.x+o,y1:a.y-40,x2:a.x+o,y2:a.y,stroke:C.line,"stroke-width":2},gB));
   if(a.r===rows-1)[-7,7].forEach(o=>el("line",{x1:a.x+o,y1:a.y,x2:a.x+o,y2:a.y+40,stroke:C.line,"stroke-width":2},gB));});
  Lt.bonds.forEach(b=>{b.nb=[...new Set([...b.a.bonds,...b.b.bonds])].filter(x=>x!==b);});
  Lt.atoms.forEach(a=>{a.g=el("g",{style:onClick?"cursor:pointer":""},gA);a.circ=el("circle",{cx:a.x,cy:a.y,r:22,fill:"#DCE6F2",stroke:C.accS,"stroke-width":2},a.g);
   a.txt=el("text",{x:a.x,y:a.y+6,"text-anchor":"middle","font-size":16,"font-weight":700,fill:C.ink},a.g,"Si");if(onClick)a.g.addEventListener("click",()=>onClick(a));});};
 Lt.setSlot=(b,i,v)=>{b.slots[i]=v;const d=b.dots[i];if(v){d.setAttribute("fill",C.e);d.setAttribute("stroke","none");d.setAttribute("r",5.5);}else{d.setAttribute("fill","#fff");d.setAttribute("stroke",C.h);d.setAttribute("stroke-width",2.5);d.setAttribute("r",6.5);}};
 Lt.holes=()=>{const h=[];Lt.bonds.forEach(b=>b.slots.forEach((v,i)=>{if(!v)h.push([b,i])}));return h;};
 Lt.addFree=(x,y)=>{const o={x,y,vx:rnd(-40,40),vy:rnd(-40,40),el:drawE(Lt.gF,x,y)};Lt.free.push(o);return o;};
 Lt.dotPos=(b,i)=>[+b.dots[i].getAttribute("cx"),+b.dots[i].getAttribute("cy")];
 Lt.breakBond=()=>{const c=Lt.bonds.filter(b=>b.slots[0]&&b.slots[1]);if(!c.length)return;const b=c[Math.floor(Math.random()*c.length)];Lt.setSlot(b,0,0);const p=Lt.dotPos(b,0);Lt.addFree(p[0],p[1]);flash(Lt.gX,p[0],p[1],Lt.flashes);};
 Lt.recombine=()=>{const h=Lt.holes();if(!Lt.free.length||!h.length)return;const f=Lt.free.pop();f.el.remove();const [b,i]=h[Math.floor(Math.random()*h.length)];Lt.setSlot(b,i,1);const p=Lt.dotPos(b,i);flash(Lt.gX,p[0],p[1],Lt.flashes);};
 Lt.tick=dt=>{const xmin=x0-34,xmax=Lt.W-x0+34,ymin=y0-34,ymax=Lt.H-y0+34;
  Lt.free.forEach(o=>{o.vx+=rnd(-1,1)*500*dt;o.vy+=rnd(-1,1)*500*dt;o.vx*=0.96;o.vy*=0.96;const sp=Math.hypot(o.vx,o.vy);if(sp>90){o.vx*=90/sp;o.vy*=90/sp;}
   o.x+=(o.vx-Lt.field*90)*dt;o.y+=o.vy*dt;if(o.y<ymin||o.y>ymax){o.vy*=-1;o.y=clamp(o.y,ymin,ymax);}
   if(Lt.field){if(o.x<xmin)o.x=xmax;if(o.x>xmax)o.x=xmin;}else if(o.x<xmin||o.x>xmax){o.vx*=-1;o.x=clamp(o.x,xmin,xmax);} mv(o);});
  Lt.hopT+=dt;if(Lt.hopT>(Lt.field?0.22:0.45)){Lt.hopT=0;Lt.holes().forEach(([b,i])=>{if(Math.random()<0.5)return;
   let cand=b.nb.filter(n=>n.slots[0]||n.slots[1]);if(!cand.length)return;let pick;
   if(Lt.field){const right=cand.filter(n=>n.mx>b.mx+1);if(right.length&&Math.random()<0.85)pick=right[Math.floor(Math.random()*right.length)];
     else if(!right.length&&b.mx>=Lt.W-x0-dx){const lefts=Lt.bonds.filter(n=>n.mx<x0+dx/2+2&&(n.slots[0]||n.slots[1])&&Math.abs(n.my-b.my)<dy);if(lefts.length)pick=lefts[Math.floor(Math.random()*lefts.length)];}}
   if(!pick)pick=cand[Math.floor(Math.random()*cand.length)];const j=pick.slots[0]?0:1;Lt.setSlot(pick,j,0);Lt.setSlot(b,i,1);});}
  tickFlashes(Lt.flashes,dt);};
 Lt.build();return Lt;}

/* ================= 3 DOPING ================= */
let dopKind="P";
const Dp=makeLattice("dopSVG",a=>dope(a));
function dope(a){if(a.type!=="Si")return;a.type=dopKind;
 if(dopKind==="P"){a.circ.setAttribute("fill",C.don);a.circ.setAttribute("stroke",C.donS);a.txt.textContent="P⁺";const o=Dp.addFree(a.x+16,a.y-18);o.vx=60;o.vy=-60;flash(Dp.gX,a.x+16,a.y-18,Dp.flashes);}
 else{a.circ.setAttribute("fill",C.acc);a.circ.setAttribute("stroke",C.accS);a.txt.textContent="B⁻";const c=a.bonds.filter(b=>b.slots[0]&&b.slots[1]);if(c.length){const b=c[0];Dp.setSlot(b,0,0);const p=Dp.dotPos(b,0);flash(Dp.gX,p[0],p[1],Dp.flashes);}}
 dopCount();}
function dopCount(){const ip=Dp.atoms.filter(a=>a.type==="P").length,ineg=Dp.atoms.filter(a=>a.type==="B").length,e=Dp.free.length,h=Dp.holes().length;
 $("dopE").textContent=e;$("dopH").textContent=h;$("dopIP").textContent=ip;$("dopIN").textContent=ineg;
 const r=e>h?"res_n":h>e?"res_p":(ip?"res_c":"res_i");const R=$("dopRes");R.textContent=t(r);R.style.color=r==="res_n"?C.e:r==="res_p"?C.h:"";}
seg("dopSeg",v=>dopKind=v);
$("dopClear").onclick=()=>{Dp.build();dopCount();};
$("dopAuto").onclick=()=>{const c=Dp.atoms.filter(a=>a.type==="Si"&&a.c>0&&a.c<6&&a.r>0&&a.r<4);for(let i=0;i<3&&c.length;i++){const k=Math.floor(Math.random()*c.length);dope(c.splice(k,1)[0]);}};
ticks.doping=dt=>{Dp.tick(dt);dopCount();};
renders.push(dopCount);

function makeBlock(g,x,y,w,h,type,nMaj,nMin){const B={x,y,w,h,car:[],field:0};
 el("rect",{x,y,width:w,height:h,rx:6,fill:type==="n"?C.nReg:C.pReg,stroke:C.line,"stroke-width":2},g);
 for(let r=0;r<4;r++)for(let c=0;c<6;c++)drawIon(g,x+w*(c+.5)/6,y+h*(r+.5)/4,type==="n"?"d":"a",18);
 B.g=el("g",{},g);
 const add=(k)=>{const o={k,x:rnd(x+10,x+w-10),y:rnd(y+10,y+h-10),vx:0,vy:0};o.el=k==="e"?drawE(B.g,o.x,o.y):drawH(B.g,o.x,o.y);B.car.push(o);};
 for(let i=0;i<nMaj;i++)add(type==="n"?"e":"h");for(let i=0;i<nMin;i++)add(type==="n"?"h":"e");
 B.tick=dt=>{B.car.forEach(o=>{o.vx+=rnd(-1,1)*400*dt;o.vy+=rnd(-1,1)*400*dt;o.vx*=.95;o.vy*=.95;const d=B.field*(o.k==="e"?-70:45);
  o.x+=(o.vx+d)*dt;o.y+=o.vy*dt;if(o.y<y+9||o.y>y+h-9){o.vy*=-1;o.y=clamp(o.y,y+9,y+h-9);}
  if(B.field){if(o.x<x+9)o.x=x+w-9;if(o.x>x+w-9)o.x=x+9;}else if(o.x<x+9||o.x>x+w-9){o.vx*=-1;o.x=clamp(o.x,x+9,x+w-9);}mv(o);});};
 return B;}

  el("line",{x1:cx-60,y1:315,x2:cx+60,y2:315,stroke:"#B86E00","stroke-width":3,"marker-end":"url(#mE)"},npFieldG);el("text",{x:cx+70,y:320,"font-size":15,"font-weight":700,fill:"#B86E00"},npFieldG,"E");});

function buildJ(){const s=$("juncSVG");s.innerHTML="";J.prog=0;J.joined=false;J.car=[];J.flashes=[];
 const d=el("defs",{},s),m=el("marker",{id:"mJ",viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:7,markerHeight:7,orient:"auto"},d);el("path",{d:"M0,0 L10,5 L0,10z",fill:"#B86E00"},m);

const cellI=(p,V)=>p.Isc-p.I0*(Math.exp(V/(p.n*p.Vt))-1);
function solveOP(p,R){if(p.Isc<=0)return {V:0,I:0};if(R<=0)return {V:0,I:p.Isc};if(!isFinite(R))return {V:p.Voc,I:0};let a=0,b=p.Voc;for(let i=0;i<50;i++){const m=(a+b)/2;if(cellI(p,m)-m/R>0)a=m;else b=m;}const V=(a+b)/2;return {V,I:V/R};}
function findMPP(p){let best={V:0,I:0,P:0};for(let i=0;i<=500;i++){const V=p.Voc*i/500,I=cellI(p,V),P=V*I;if(P>best.P)best={V,I,P};}return best;}

/* ================= 9 SOLAR CELL ================= */
const SC={ph:[],car:[],dots:[],flashes:[],mode:"l",acc:0};
seg("solMode",v=>{SC.mode=v;buildSol();});$("solG").oninput=updSol;
function buildSol(){const s=$("solSVG");s.innerHTML="";SC.ph=[];SC.car=[];SC.flashes=[];
 const wire="#3A4654";
 // sun
 el("circle",{cx:70,cy:55,r:32,fill:C.sun},s);for(let i=0;i<8;i++){const a=i*Math.PI/4;el("line",{x1:70+40*Math.cos(a),y1:55+40*Math.sin(a),x2:70+52*Math.cos(a),y2:55+52*Math.sin(a),stroke:C.sun,"stroke-width":4},s);}
 el("text",{x:115,y:30,"font-size":14,fill:C.mut},s,t("sunlight"));
 // cell layers
 el("rect",{x:120,y:112,width:440,height:30,fill:"#B9D3F0"},s);el("rect",{x:120,y:142,width:440,height:14,fill:C.dep},s);el("rect",{x:120,y:156,width:440,height:164,fill:C.pReg},s);el("rect",{x:120,y:320,width:440,height:14,fill:C.metal},s);
 for(let x=140;x<=540;x+=50)el("rect",{x:x-5,y:102,width:10,height:10,fill:"#6B7480"},s);
 el("rect",{x:120,y:98,width:440,height:5,fill:"#6B7480"},s);
 el("text",{x:128,y:132,"font-size":13,fill:C.ink},s,t("nlayer"));el("text",{x:128,y:240,"font-size":14,fill:C.ink},s,t("player"));
 el("text",{x:128,y:152,"font-size":10,fill:"#7A5B00"},s,t("deplLayer"));
 el("text",{x:200,y:92,"font-size":13,fill:C.mut},s,t("frontC"));el("text",{x:128,y:356,"font-size":13,fill:C.mut},s,t("rearC"));
 // circuit
 el("path",{d:"M560,100 L700,100 L700,190 M700,270 L700,327 L560,327",fill:"none",stroke:wire,"stroke-width":4},s);
 const lg=el("g",{},s);SC.glow=null;
 if(SC.mode==="o"){el("line",{x1:700,y1:190,x2:725,y2:215,stroke:wire,"stroke-width":4},lg);el("circle",{cx:700,cy:270,r:4,fill:wire},lg);el("text",{x:712,y:250,"font-size":13,fill:C.mut},lg,t("openL"));}
 else if(SC.mode==="s"){el("line",{x1:700,y1:190,x2:700,y2:270,stroke:wire,"stroke-width":4},lg);el("text",{x:712,y:235,"font-size":13,fill:C.mut},lg,t("shortL"));}
 else{SC.glow=el("circle",{cx:700,cy:230,r:34,fill:C.sun,opacity:0},lg);el("circle",{cx:700,cy:230,r:20,fill:"#FFF8D8",stroke:wire,"stroke-width":3},lg);el("path",{d:"M690,236 q5,-14 10,0 q5,-14 10,0",fill:"none",stroke:"#B86E00","stroke-width":2},lg);
  el("line",{x1:700,y1:190,x2:700,y2:210,stroke:wire,"stroke-width":4},lg);el("line",{x1:700,y1:250,x2:700,y2:270,stroke:wire,"stroke-width":4},lg);el("text",{x:732,y:236,"font-size":13,fill:C.mut},lg,t("load"));}
 // meters text
 SC.mtxt=el("text",{x:590,y:390,"font-size":16,"font-weight":700,fill:C.accS},s,"");
 SC.gP=el("g",{},s);SC.gC=el("g",{},s);SC.gX=el("g",{},s);
 SC.path=[[560,100],[700,100],[700,327],[560,327]];SC.seg=[];SC.len=0;for(let i=0;i<SC.path.length-1;i++){const a=SC.path[i],b=SC.path[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);SC.seg.push({a,b,l,s0:SC.len});SC.len+=l;}
 SC.dots=[];for(let i=0;i<16;i++){const d={s:i*SC.len/16};d.el=drawE(s,0,0,5.5);SC.dots.push(d);}
 updSol();}
function updSol(){const G=+$("solG").value;$("solGv").textContent=G+" W/m²";const p=cellP(G,25);let op;
 if(SC.mode==="o")op={V:p.Voc,I:0};else if(SC.mode==="s")op={V:0,I:p.Isc};else op=solveOP(p,0.045);
 SC.op=op;$("solV").textContent=op.V.toFixed(3)+" V";$("solI").textContent=op.I.toFixed(2)+" A";$("solP").textContent=(op.V*op.I).toFixed(2)+" W";
 if(SC.mtxt)SC.mtxt.textContent="V = "+op.V.toFixed(3)+" V    I = "+op.I.toFixed(2)+" A";
 if(SC.glow)SC.glow.setAttribute("opacity",clamp(op.V*op.I/8,0,0.9));}
ticks.solar=dt=>{const G=+$("solG").value;SC.acc+=dt*G/1000*14;
 while(SC.acc>1){SC.acc-=1;const x=rnd(135,545);const o={x,y:-5+rnd(0,40),ty:rnd(118,312)};o.el=el("path",{d:"M0,-14 l0,12 m-4,-4 l4,5 l4,-5",stroke:"#E8A317","stroke-width":2.5,fill:"none"},SC.gP);SC.ph.push(o);}
 for(let i=SC.ph.length-1;i>=0;i--){const o=SC.ph[i];o.y+=320*dt;o.el.setAttribute("transform",`translate(${o.x},${o.y})`);
  if(o.y>=o.ty){o.el.remove();SC.ph.splice(i,1);flash(SC.gX,o.x,o.y,SC.flashes);
   const lost=o.ty>280&&Math.random()<0.4;const e={k:"e",x:o.x+4,y:o.ty,lost};e.el=drawE(SC.gC,e.x,e.y,5.5);const h={k:"h",x:o.x-4,y:o.ty,lost};h.el=drawH(SC.gC,h.x,h.y,5.5);SC.car.push(e,h);}}
 for(let i=SC.car.length-1;i>=0;i--){const o=SC.car[i];o.x+=rnd(-1,1)*50*dt;
  if(o.lost){o.y+=(o.k==="e"?-1:1)*rnd(-30,30)*dt;o.age=(o.age||0)+dt;if(o.age>0.8){o.el.remove();SC.car.splice(i,1);continue;}}
  else if(o.k==="e"){const inField=o.y>138&&o.y<160;o.y-=(inField?260:o.y>156?70:90)*dt;if(o.y<104){o.el.remove();SC.car.splice(i,1);continue;}}
  else{const inField=o.y>138&&o.y<160;o.y+=(inField?260:o.y<142?90:70)*dt;if(o.y>322){o.el.remove();SC.car.splice(i,1);continue;}}
  o.x=clamp(o.x,124,556);mv(o);}
 const I=SC.op?SC.op.I:0;const sp=I*14;SC.dots.forEach(d=>{d.s+=sp*dt;const p=pathPt(SC.seg,SC.len,d.s);d.el.setAttribute("transform",`translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);d.el.setAttribute("opacity",I>0.01?1:0.25);});
 tickFlashes(SC.flashes,dt);};
renders.push(buildSol);

/* ================= 10 SOLAR IV ================= */
function ivR(){const s=+$("ivR").value;if(s<=0)return 0;if(s>=100)return Infinity;return 0.005*Math.pow(10,(s-1)/98*3);}
["ivG","ivT","ivR","ivPV","ivFam","ivFF"].forEach(id=>$(id).addEventListener("input",drawIV));
function drawIV(){const s=$("ivSVG");s.innerHTML="";const G=+$("ivG").value,Tc=+$("ivT").value,R=ivR();
 $("ivGv").textContent=G+" W/m²";$("ivTv").textContent=Tc+" °C";$("ivRv").textContent=R===0?"0 ("+t("shortL")+")":!isFinite(R)?"∞ ("+t("openL")+")":(R*1000).toFixed(R<0.1?1:0)+" mΩ";
 const X0=80,Y0=390,W=620,H=340,Vm=0.8,Im=18,Pm=12;const sx=v=>X0+v/Vm*W,sy=i=>Y0-i/Im*H,syP=p=>Y0-p/Pm*H;
 for(let i=0;i<=8;i++){const x=sx(i*0.1);el("line",{x1:x,y1:Y0,x2:x,y2:Y0-H,stroke:C.line},s);el("text",{x,y:Y0+20,"text-anchor":"middle","font-size":13,fill:C.mut},s,(i*0.1).toFixed(1));}
 for(let i=0;i<=6;i++){const y=sy(i*3);el("line",{x1:X0,y1:y,x2:X0+W,y2:y,stroke:C.line},s);el("text",{x:X0-8,y:y+5,"text-anchor":"end","font-size":13,fill:C.accS},s,i*3);}
 el("text",{x:X0+W/2,y:Y0+44,"text-anchor":"middle","font-size":15,"font-weight":700,fill:C.ink},s,"V (V)");el("text",{x:22,y:Y0-H-12,"font-size":15,"font-weight":700,fill:C.accS},s,"I (A)");
 const showP=$("ivPV").checked;if(showP){for(let i=0;i<=6;i++)el("text",{x:X0+W+8,y:syP(i*2)+5,"font-size":13,fill:"#B86E00"},s,i*2);el("text",{x:X0+W-10,y:Y0-H-12,"font-size":15,"font-weight":700,fill:"#B86E00"},s,"P (W)");}
 const curve=(p,f)=>{let d="";for(let i=0;i<=120;i++){const V=p.Voc*i/120;const v=f(V,cellI(p,V));d+=(i?"L":"M")+sx(V).toFixed(1)+","+v.toFixed(1);}return d;};
 if($("ivFam").checked)[200,400,600,800,1000].forEach(g=>{const q=cellP(g,Tc);el("path",{d:curve(q,(V,I)=>sy(I)),fill:"none",stroke:"#9AB4D6","stroke-width":2,"stroke-dasharray":"6 4"},s);el("text",{x:sx(0)+6,y:sy(q.Isc)-4,"font-size":12,fill:C.mut},s,g+" W/m²");});
 const p=cellP(G,Tc),M=findMPP(p);
 if($("ivFF").checked){el("rect",{x:X0,y:sy(p.Isc),width:sx(p.Voc)-X0,height:Y0-sy(p.Isc),fill:"none",stroke:C.mut,"stroke-width":2,"stroke-dasharray":"6 4"},s);
  el("rect",{x:X0,y:sy(M.I),width:sx(M.V)-X0,height:Y0-sy(M.I),fill:"#F2B23340",stroke:"#B86E00","stroke-width":1.5},s);}
 el("path",{d:curve(p,(V,I)=>sy(I)),fill:"none",stroke:C.accS,"stroke-width":4},s);
 if(showP)el("path",{d:curve(p,(V,I)=>syP(V*I)),fill:"none",stroke:"#B86E00","stroke-width":3},s);
 // markers
 el("circle",{cx:sx(0),cy:sy(p.Isc),r:7,fill:C.accS},s);el("text",{x:sx(0)+10,y:sy(p.Isc)+20,"font-size":14,"font-weight":700,fill:C.accS},s,"Isc = "+p.Isc.toFixed(2)+" A");
 el("circle",{cx:sx(p.Voc),cy:Y0,r:7,fill:C.accS},s);el("text",{x:sx(p.Voc)-10,y:Y0-12,"text-anchor":"end","font-size":14,"font-weight":700,fill:C.accS},s,"Voc = "+p.Voc.toFixed(3)+" V");
 el("line",{x1:sx(M.V),y1:Y0,x2:sx(M.V),y2:sy(M.I),stroke:"#B86E00","stroke-dasharray":"4 3"},s);
 el("circle",{cx:sx(M.V),cy:sy(M.I),r:8,fill:"#fff",stroke:"#B86E00","stroke-width":3},s);el("text",{x:sx(M.V)+10,y:sy(M.I)-10,"font-size":14,"font-weight":700,fill:"#B86E00"},s,"MPP");
 if(showP){el("circle",{cx:sx(M.V),cy:syP(M.P),r:6,fill:"#B86E00"},s);el("text",{x:sx(M.V)+10,y:syP(M.P)+4,"font-size":13,fill:"#B86E00"},s,"Pmax = "+M.P.toFixed(2)+" W");}
 // load line and op
 const op=solveOP(p,R);
 if(R>0&&isFinite(R)){const Ve=Math.min(Vm,Im*R);el("line",{x1:sx(0),y1:sy(0),x2:sx(Ve),y2:sy(Ve/R),stroke:"#2D7A4B","stroke-width":2},s);}
 el("circle",{cx:sx(op.V),cy:sy(op.I),r:9,fill:"#2D7A4B",stroke:"#fff","stroke-width":2},s);
 const ff=M.P/(p.Voc*p.Isc),eta=M.P/(G*0.0331)*100;
 const rows=[["Isc",p.Isc.toFixed(2)+" A"],["Voc",p.Voc.toFixed(3)+" V"],["Imp",M.I.toFixed(2)+" A"],["Vmp",M.V.toFixed(3)+" V"],["Pmax",M.P.toFixed(2)+" W"],[t("ff"),ff.toFixed(3)],[t("eff"),eta.toFixed(1)+" %"],[t("op"),op.V.toFixed(3)+" V, "+op.I.toFixed(2)+" A, "+(op.V*op.I).toFixed(2)+" W"]];
 $("ivTbl").innerHTML=`<thead><tr><th>${t("param")}</th><th class="n">${t("value")}</th></tr></thead><tbody>`+rows.map(r=>`<tr><td>${r[0]}</td><td class="n"><b>${r[1]}</b></td></tr>`).join("")+"</tbody>";}
renders.push(drawIV);

/* ================= 11 ARRAY ================= */
let arrCells=72,arrNm=10,arrNp=2;
seg("arrCells",v=>{arrCells=+v;drawArr();});
$("arrNmM").onclick=()=>{arrNm=Math.max(1,arrNm-1);drawArr();};$("arrNmP").onclick=()=>{arrNm=Math.min(20,arrNm+1);drawArr();};
$("arrNpM").onclick=()=>{arrNp=Math.max(1,arrNp-1);drawArr();};$("arrNpP").onclick=()=>{arrNp=Math.min(10,arrNp+1);drawArr();};
$("arrG").oninput=drawArr;
function modIcon(g,x,y,w,h){el("rect",{x,y,width:w,height:h,rx:2,fill:C.accS,stroke:"#C8D3DF"},g);const c=arrCells===36?[4,9]:arrCells===60?[6,10]:[6,12];
 for(let i=1;i<c[0];i++)el("line",{x1:x+w*i/c[0],y1:y,x2:x+w*i/c[0],y2:y+h,stroke:"#5B7DB0","stroke-width":.6},g);for(let j=1;j<c[1];j++)el("line",{x1:x,y1:y+h*j/c[1],x2:x+w,y2:y+h*j/c[1],stroke:"#5B7DB0","stroke-width":.6},g);}
function drawArr(){$("arrNm").textContent=arrNm;$("arrNp").textContent=arrNp;const G=+$("arrG").value;$("arrGv").textContent=G+" W/m²";
 const s=$("arrSVG");s.innerHTML="";const showM=Math.min(arrNm,10),showS=Math.min(arrNp,4),mw=44,mh=64,gx=56,gy=84,x0=70,y0=40;
 const H=y0+showS*gy+(arrNp>4?30:0)+30;s.setAttribute("viewBox",`0 0 800 ${Math.max(H,200)}`);
 el("line",{x1:40,y1:y0-10,x2:40,y2:y0+(showS-1)*gy+mh/2+10,stroke:C.h,"stroke-width":4},s);
 const xr=x0+showM*gx+(arrNm>10?40:0)+10;el("line",{x1:xr,y1:y0-10,x2:xr,y2:y0+(showS-1)*gy+mh/2+10,stroke:C.e,"stroke-width":4},s);
 el("text",{x:30,y:y0-16,"font-size":18,"font-weight":700,fill:C.h},s,"+");el("text",{x:xr-4,y:y0-16,"font-size":18,"font-weight":700,fill:C.e},s,"−");
 for(let r=0;r<showS;r++){const y=y0+r*gy;el("line",{x1:40,y1:y+mh/2,x2:xr,y2:y+mh/2,stroke:"#3A4654","stroke-width":2},s);
  for(let c=0;c<showM;c++)modIcon(s,x0+c*gx,y,mw,mh);if(arrNm>10)el("text",{x:x0+10*gx+4,y:y+mh/2+6,"font-size":18,fill:C.ink},s,"…");}
 if(arrNp>4)el("text",{x:x0,y:y0+4*gy+10,"font-size":18,fill:C.ink},s,"⋮ ("+arrNp+")");
 el("text",{x:xr+16,y:y0+20,"font-size":14,fill:C.ink},s,arrNm+" × "+arrNp+" = "+(arrNm*arrNp)+" "+t("modsTxt"));
 el("text",{x:xr+16,y:y0+42,"font-size":13,fill:C.mut},s,"1 "+t("module")+" = "+arrCells+" "+t("cellsTxt"));
 // values
 const p=cellP(G,25),M=findMPP(p);const lv=[[t("cell"),1,1],[t("module"),arrCells,1],[t("string"),arrCells*arrNm,1],[t("array"),arrCells*arrNm,arrNp]];
 $("arrTbl").innerHTML=`<thead><tr><th></th><th class="n">Voc</th><th class="n">Isc</th><th class="n">Vmp</th><th class="n">Imp</th><th class="n">Pmax</th></tr></thead><tbody>`+
  lv.map(([n,ns,np])=>{const P=M.P*ns*np;return `<tr><td><b>${n}</b></td><td class="n">${(p.Voc*ns).toFixed(ns>1?1:3)} V</td><td class="n">${(p.Isc*np).toFixed(2)} A</td><td class="n">${(M.V*ns).toFixed(ns>1?1:3)} V</td><td class="n">${(M.I*np).toFixed(2)} A</td><td class="n"><b>${P>=1000?(P/1000).toFixed(2)+" kW":P.toFixed(1)+" W"}</b></td></tr>`;}).join("")+"</tbody>";
 // plot array IV
 const q=$("arrPlot");q.innerHTML="";const ns=arrCells*arrNm,np=arrNp,Voc=p.Voc*ns,Isc=p.Isc*np,X0=70,Y0=310,W=520,Hh=270;
 const Vmax=Math.ceil(Voc*1.1/50)*50||50,Imax=Math.ceil(Isc*1.15/5)*5||5;const sx=v=>X0+v/Vmax*W,sy=i=>Y0-i/Imax*Hh;
 for(let i=0;i<=5;i++){el("line",{x1:sx(Vmax*i/5),y1:Y0,x2:sx(Vmax*i/5),y2:Y0-Hh,stroke:C.line},q);el("text",{x:sx(Vmax*i/5),y:Y0+18,"text-anchor":"middle","font-size":13,fill:C.mut},q,Math.round(Vmax*i/5));
  el("line",{x1:X0,y1:sy(Imax*i/5),x2:X0+W,y2:sy(Imax*i/5),stroke:C.line},q);el("text",{x:X0-8,y:sy(Imax*i/5)+5,"text-anchor":"end","font-size":13,fill:C.mut},q,(Imax*i/5).toFixed(Imax<10?1:0));}
 let d="";for(let i=0;i<=100;i++){const v=p.Voc*i/100;d+=(i?"L":"M")+sx(v*ns).toFixed(1)+","+sy(cellI(p,v)*np).toFixed(1);}
 el("path",{d,fill:"none",stroke:C.accS,"stroke-width":4},q);el("circle",{cx:sx(M.V*ns),cy:sy(M.I*np),r:8,fill:"#fff",stroke:"#B86E00","stroke-width":3},q);
 el("text",{x:sx(M.V*ns)-10,y:sy(M.I*np)-14,"text-anchor":"end","font-size":14,"font-weight":700,fill:"#B86E00"},q,"MPP "+(M.P*ns*np/1000).toFixed(2)+" kW");
 el("text",{x:X0+W/2,y:Y0+42,"text-anchor":"middle","font-size":14,"font-weight":700,fill:C.ink},q,"V (V)");el("text",{x:10,y:24,"font-size":14,"font-weight":700,fill:C.ink},q,"I (A)");
 el("text",{x:X0+8,y:24,"font-size":14,fill:C.mut},q,t("array")+" I–V");}
renders.push(drawArr);

/* ================= LANGUAGE APPLY ================= */
function applyLang(){document.documentElement.lang=lang;document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=t(e.dataset.t));

 tabs.forEach((b,i)=>b.innerHTML=`<span class="n">${i+1}</span>`+t("tab_"+panels[i].id));
 renders.forEach(f=>f());buildJ();updJ();}
$("langSel").value=lang;$("langSel").onchange=e=>{lang=e.target.value;try{localStorage.setItem("pnlang",lang)}catch(x){}applyLang();};
applyLang();
const start=panels.findIndex(p=>"#"+p.id===location.hash);show(start<0?0:start);
let last=performance.now();
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;const id=panels[cur].id;if(playing&&ticks[id])ticks[id](dt);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
