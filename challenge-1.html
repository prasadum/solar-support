<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar Smart Technician Challenge</title>
<style>
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  *{box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#f5f8fa;color:#222;margin:0;padding:16px clamp(12px,2.5vw,32px) 32px}
  h1,h2{text-align:center;margin:6px 0}
  h1{font-size:clamp(20px,3.2vw,28px);color:#0a4a8a}
  h2{font-size:clamp(14px,2vw,17px);font-weight:normal;color:#555;margin-bottom:12px}
  .score{position:sticky;top:0;z-index:2;background:#0a4a8a;color:#fff;text-align:center;padding:8px;border-radius:8px;font-weight:bold;margin-bottom:6px}
  #quiz{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:14px;margin-top:10px}
  .question{background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
  .options label{display:flex;gap:8px;align-items:flex-start;margin:6px 0;padding:6px 8px;border-radius:6px;cursor:pointer}
  .options label:hover{background:#f0f5fb}
  .options input{margin-top:3px}
  button{background:#007bff;color:#fff;padding:10px 18px;border:none;border-radius:6px;cursor:pointer;font:inherit;font-weight:bold}
  button:hover{background:#0056b3}
  button:disabled{background:#9db8d6;cursor:default}
  .feedback{margin-top:8px;font-style:italic;min-height:1.2em}
  .result{text-align:center;font-size:1.2em;margin-top:20px}
  .finish{display:block;margin:22px auto 0}
  .warn{color:#b45309;text-align:center;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<h1>☀️ Solar Smart Technician Challenge</h1>
<h2>Rooftop Solar PV Installation &amp; Maintenance (NSQF Level 3)</h2>
<div class="score" id="score">Answered 0 · Correct 0</div>
<div id="quiz"></div>
<button class="finish" id="finish" type="button">Finish quiz</button>
<div class="warn" id="warn"></div>
<div class="result" id="result"></div>
<script>
const quizData=[{"q": "The solar constant represents:", "o": ["Energy received from the Sun per unit area", "Electrical energy generated by a PV panel", "Earth's temperature constant", "Solar panel rating"], "a": 0, "f": "It is about 1.36 kW/m² of solar radiation reaching the top of Earth's atmosphere."}, {"q": "Solar radiation is highest when the sun is at:", "o": ["Dawn", "Noon", "Dusk", "Midnight"], "a": 1, "f": "Maximum irradiance occurs at solar noon."}, {"q": "In India, solar panels should face:", "o": ["North", "South", "East", "West"], "a": 1, "f": "Facing south gives maximum sunlight in the northern hemisphere."}, {"q": "The instrument used to measure solar irradiance is:", "o": ["Anemometer", "Pyranometer", "Barometer", "Multimeter"], "a": 1, "f": "A pyranometer measures solar radiation in W/m²."}, {"q": "Global Horizontal Irradiance (GHI) includes:", "o": ["Direct and diffuse radiation", "Only direct radiation", "Only reflected radiation", "UV radiation only"], "a": 0, "f": "GHI is the direct (beam) plus diffuse radiation on a horizontal surface."}, {"q": "A single silicon solar cell typically produces around:", "o": ["0.5 V", "1.2 V", "5 V", "12 V"], "a": 0, "f": "Each PV cell produces about 0.5 to 0.6 volts."}, {"q": "Increasing temperature on a PV cell will:", "o": ["Increase voltage", "Decrease voltage", "Have no effect", "Double power"], "a": 1, "f": "Voltage decreases as temperature rises."}, {"q": "The I-V curve shows:", "o": ["Power vs time", "Current vs voltage", "Current vs irradiance", "Voltage vs resistance"], "a": 1, "f": "It shows how current changes with voltage in a PV cell."}, {"q": "Monocrystalline panels are usually:", "o": ["Blue and less efficient", "Black and more efficient", "Transparent", "Thin and flexible"], "a": 1, "f": "They are black and more efficient."}, {"q": "Standard Test Conditions (STC) are:", "o": ["1000 W/m², 25°C", "500 W/m², 35°C", "1500 W/m², 45°C", "None"], "a": 0, "f": "STC: 1000 W/m², 25°C cell temperature, AM1.5."}, {"q": "MC4 connectors are used for:", "o": ["AC wiring", "Waterproof DC connections", "Data transfer", "Mechanical mounting"], "a": 1, "f": "They give safe, weatherproof DC connections."}, {"q": "In a PV module, bypass diodes prevent:", "o": ["Current flow", "Hotspot heating of shaded cells", "Voltage drop", "Earth faults"], "a": 1, "f": "A bypass diode lets the string current flow around a shaded cell group, so the shaded cells do not overheat."}, {"q": "A Single Line Diagram (SLD) is used for:", "o": ["Drawing roof layout", "Showing electrical connections", "Testing inverter", "Measuring irradiance"], "a": 1, "f": "It shows the electrical connections between components."}, {"q": "Area needed for a 1 kW solar system:", "o": ["2 m²", "6–10 m²", "25 m²", "50 m²"], "a": 1, "f": "About 6–10 square metres are required per kW."}, {"q": "The formula for power is:", "o": ["P = V × I", "P = V / I", "P = I / R", "P = R × V"], "a": 0, "f": "Power equals voltage × current."}, {"q": "Panels in series will increase:", "o": ["Voltage", "Current", "Resistance", "Power loss"], "a": 0, "f": "Series connection adds voltage."}, {"q": "Panels in parallel will increase:", "o": ["Voltage", "Current", "Resistance", "Power factor"], "a": 1, "f": "Parallel connection adds current."}, {"q": "Panel tilt angle in India is approximately:", "o": ["0°", "15°", "Latitude of the location", "Longitude of the location"], "a": 2, "f": "Tilt ≈ latitude gives the best year-round output."}, {"q": "Most important during a site survey:", "o": ["Shadow-free area", "Roof colour", "Wire colour", "Inverter size"], "a": 0, "f": "Avoid shading for maximum output."}, {"q": "Always use ______ while installing panels on a roof:", "o": ["Cotton gloves", "Safety belt and helmet", "Slippers", "Plastic shoes"], "a": 1, "f": "Always wear fall protection and a helmet."}, {"q": "Before connecting an inverter to the grid, ensure:", "o": ["Load is off", "Voltages are equal", "Both a & b", "None"], "a": 2, "f": "Make sure the load is off and the voltages match."}, {"q": "Earthing protects against:", "o": ["Overload", "Lightning & faults", "Sunlight", "Dust"], "a": 1, "f": "It protects against lightning and shock from faults."}, {"q": "A combiner box is used to:", "o": ["Combine AC circuits", "Combine DC strings", "Mount panels", "Store energy"], "a": 1, "f": "It combines multiple DC strings."}, {"q": "A lightning arrester protects:", "o": ["Battery", "Inverter", "Entire system", "Panels from dust"], "a": 2, "f": "It protects the whole system from lightning surges."}, {"q": "Cleaning panels helps to:", "o": ["Reduce light", "Increase power output", "Prevent corrosion only", "Increase reflection"], "a": 1, "f": "Clean panels produce more power."}, {"q": "Battery electrolyte is topped up with:", "o": ["Tap water", "Acid", "Distilled water", "Sea water"], "a": 2, "f": "Use only distilled water."}, {"q": "Inverter message “GRID FAIL” means:", "o": ["Panel issue", "Grid power not available", "Battery full", "Solar off"], "a": 1, "f": "Grid supply is off or has failed."}, {"q": "Low output can be caused by:", "o": ["Oversized battery", "Dust or shading", "High inverter capacity", "Sunny weather"], "a": 1, "f": "Dust or shading reduces output."}, {"q": "During maintenance, use tools that are:", "o": ["Metallic", "Insulated", "Wet", "Rusty"], "a": 1, "f": "Use insulated tools for safety."}, {"q": "First step in troubleshooting:", "o": ["Replace inverter", "Check connections & fuses", "Change panels", "Call manufacturer"], "a": 1, "f": "Always check wiring and fuses first."}];
let score=0,answered=0,confirmPending=false;
const quiz=document.getElementById('quiz');
function upd(){document.getElementById('score').textContent='Answered '+answered+' / '+quizData.length+' · Correct '+score;}
quizData.forEach((item,i)=>{
  const div=document.createElement('div');div.className='question';
  div.innerHTML='<b>Q'+(i+1)+'. '+item.q+'</b><div class="options">'+item.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> <span>'+o+'</span></label>').join('')+'</div><button type="button">Check answer</button><div class="feedback"></div>';
  const btn=div.querySelector('button'),fb=div.querySelector('.feedback');
  btn.onclick=()=>{
    const sel=div.querySelector('input:checked');
    if(!sel){fb.textContent='Please select an option first.';fb.style.color='#b45309';return;}
    if(+sel.value===item.a){fb.textContent='✅ Correct! '+item.f;fb.style.color='#006400';score++;}
    else{fb.textContent='❌ Incorrect. Correct answer: '+item.o[item.a]+'. '+item.f;fb.style.color='#a00000';}
    btn.disabled=true;div.querySelectorAll('input').forEach(e=>e.disabled=true);answered++;upd();
  };
  quiz.appendChild(div);
});
document.getElementById('finish').onclick=function(){
  const warn=document.getElementById('warn');
  if(answered<quizData.length&&!confirmPending){
    warn.textContent=(quizData.length-answered)+' questions are unanswered. Click “Finish quiz” again to submit anyway.';
    confirmPending=true;return;
  }
  warn.textContent='';
  const p=Math.round(score/quizData.length*100);
  const g=p>=85?'Excellent':p>=65?'Good':p>=50?'Pass':'Needs improvement';
  document.getElementById('result').innerHTML='<strong>Your score: '+score+'/'+quizData.length+' ('+p+'%)</strong><br><br>Grade: <strong>'+g+'</strong><br><br>🎓 All the best for your exam and your career in solar energy! ☀️';
  this.disabled=true;
};
upd();
</script>
</body>
</html>
