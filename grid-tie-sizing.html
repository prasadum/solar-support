<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid-Tie Solar PV Sizing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap">
<style>
/* Layout: header band + sticky step bar; each step = theory column + picture column, then calculation sheet. Sizes in rem so the text-size control scales everything. */
:root{
  --scale:1;
  --navy:#16325c; --navy-2:#24497f; --head:#16325c; --head-ink:#ffffff; --head-muted:#c9d6ec;
  --tab:#24497f; --tab-ink:#d6e1f3; --tab-small:#9fb5d8;
  --sun:#e39b0b; --sun-ink:#1c1300; --sun-soft:#fff3d6; --sun-text:#8a5a00;
  --green:#2c7a4b; --green-soft:#e3f3e9; --red:#b3362c; --red-soft:#fbe7e5;
  --ink:#1c2533; --muted:#5a6578; --line:#d5dbe5; --paper:#ffffff; --ground:#f3f5f9; --chip:#e9eef6; --input:#ffffff; --input-line:#b9c3d3;
  --title:#16325c; --sel:#e3f3e9;
  --body:"Noto Sans","Segoe UI",Roboto,"Nirmala UI","Noto Sans Devanagari","Noto Sans Malayalam",Mangal,Kartika,Arial,sans-serif;
  --mono:"Consolas","Cascadia Mono","Roboto Mono","Courier New",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --head:#0e1a2e; --head-ink:#f2f5fa; --head-muted:#9fb0cc; --tab:#1b2a44; --tab-ink:#b8c7e0; --tab-small:#7f93b6;
    --sun:#f0ae2c; --sun-ink:#1c1300; --sun-soft:#3a2d10; --sun-text:#f2c86b;
    --green:#74d39c; --green-soft:#15342a; --red:#ff8f80; --red-soft:#3f1c19;
    --ink:#e6ebf3; --muted:#9aa6ba; --line:#33405a; --paper:#141c29; --ground:#0d131d; --chip:#1f2a3d; --input:#0f1622; --input-line:#3d4b66;
    --title:#a9c4f0; --sel:#15342a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --head:#0e1a2e; --head-ink:#f2f5fa; --head-muted:#9fb0cc; --tab:#1b2a44; --tab-ink:#b8c7e0; --tab-small:#7f93b6;
    --sun:#f0ae2c; --sun-ink:#1c1300; --sun-soft:#3a2d10; --sun-text:#f2c86b;
    --green:#74d39c; --green-soft:#15342a; --red:#ff8f80; --red-soft:#3f1c19;
    --ink:#e6ebf3; --muted:#9aa6ba; --line:#33405a; --paper:#141c29; --ground:#0d131d; --chip:#1f2a3d; --input:#0f1622; --input-line:#3d4b66;
    --title:#a9c4f0; --sel:#15342a; color-scheme:dark;
}
/* SVG drawings use fixed colours; remap them for the dark theme */
:root[data-theme="dark"] svg rect[fill="#fff"]{fill:#141c29}
:root[data-theme="dark"] svg [fill="#16325c"]{fill:#a9c4f0}
:root[data-theme="dark"] svg [stroke="#16325c"]{stroke:#a9c4f0}
:root[data-theme="dark"] svg [fill="#1c2533"]{fill:#e6ebf3}
:root[data-theme="dark"] svg [fill="#5a6578"]{fill:#9aa6ba}
:root[data-theme="dark"] svg [stroke="#5a6578"]{stroke:#7d8aa1}
:root[data-theme="dark"] svg [fill="#e9eef6"]{fill:#1f2a3d}
:root[data-theme="dark"] svg [fill="#f3f5f9"]{fill:#1a2333}
:root[data-theme="dark"] svg [fill="#e3f3e9"]{fill:#15342a}
:root[data-theme="dark"] svg [fill="#2c7a4b"]{fill:#74d39c}
:root[data-theme="dark"] svg [stroke="#2c7a4b"]{stroke:#74d39c}
:root[data-theme="dark"] svg [fill="#fff3d6"]{fill:#3a2d10}
:root[data-theme="dark"] svg [fill="#8a5a00"]{fill:#f2c86b}
:root[data-theme="dark"] svg [fill="#b3362c"]{fill:#ff8f80}
:root[data-theme="dark"] svg [stroke="#b3362c"]{stroke:#ff8f80}
:root[data-theme="dark"] svg [stroke="#d5dbe5"],:root[data-theme="dark"] svg [stroke="#e9eef6"]{stroke:#33405a}
:root[data-theme="dark"] svg [fill="#24497f"]{fill:#6f97d8}
:root[data-theme="dark"] svg [stroke="#1f3f73"]{stroke:#8fb0e8}
:root[data-theme="dark"] figure img{background:#fff;border-radius:6px}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:1rem/1.65 var(--body)}
html[lang="ml"] body{line-height:1.8}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding-inline:18px}
html.proj .wrap{max-width:1600px}
header.top{background:var(--head);color:var(--head-ink);padding-block:16px 14px}
.top .meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.82rem;color:var(--head-muted);letter-spacing:.02em}
.top h1{margin:6px 0 4px;font-size:clamp(1.35rem,3vw,2rem);line-height:1.25;text-wrap:balance}
.top p.sub{margin:0 0 12px;color:var(--head-muted);max-width:75ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.tgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tgroup .lbl{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--head-muted)}
button{font:inherit;font-size:.9rem;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;line-height:1.3}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn-sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:600}
.btn-h{background:transparent;border-color:rgba(255,255,255,.35);color:var(--head-ink)}
.btn-h[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:600}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--head-ink);padding:6px 11px}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);font-weight:700}
.seg button+button{border-left:1px solid rgba(255,255,255,.25)}
#sizeVal{min-width:3.2em;text-align:center;font-size:.85rem;color:var(--head-ink);font-variant-numeric:tabular-nums}
select.hsel{background:var(--input);color:var(--ink);border:1px solid var(--input-line);border-radius:6px;font:inherit;font-size:.95rem;padding:5px 8px}
.tabbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);border-bottom:3px solid var(--sun);box-shadow:0 2px 6px rgba(0,0,0,.18)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-top:6px}
nav.tabs button{border:0;border-radius:8px 8px 0 0;background:var(--tab);color:var(--tab-ink);padding:8px 13px;white-space:nowrap;font-size:.88rem;line-height:1.3;text-align:left}
nav.tabs button small{display:block;font-size:.72rem;letter-spacing:.02em;color:var(--tab-small)}
nav.tabs button[aria-selected="true"]{background:var(--sun);color:var(--sun-ink);font-weight:700}
nav.tabs button[aria-selected="true"] small{color:var(--sun-ink)}
main{padding-block:22px 40px}
section.panel{display:none}
section.panel.on{display:block}
.steptag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sun-text);background:var(--sun-soft);padding:3px 10px;border-radius:20px}
h2{font-size:clamp(1.3rem,2.6vw,1.75rem);color:var(--title);margin:8px 0 6px;line-height:1.3;text-wrap:balance}
h3{font-size:1.15rem;color:var(--title);margin:22px 0 8px}
h4{font-size:1rem;margin:14px 0 6px;color:var(--title)}
p{margin:0 0 12px;max-width:78ch}
.lead{font-size:1.08rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
html.proj .grid2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:860px){.grid2,html.proj .grid2{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
figcaption{font-size:.85rem;color:var(--muted);margin-top:8px}
svg{display:block;width:100%;height:auto}
.note,.why,.warn{padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.note{border-left:4px solid var(--sun);background:var(--sun-soft)}
.why{border-left:4px solid var(--green);background:var(--green-soft)}
.warn{border-left:4px solid var(--red);background:var(--red-soft)}
.note b:first-child,.why b:first-child,.warn b:first-child{display:block;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.tablebox{overflow-x:auto;margin:10px 0 14px}
table{border-collapse:collapse;width:100%;background:var(--paper);font-size:.92rem}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:middle}
th{background:var(--chip);color:var(--title);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;background:var(--sun-soft)}
tr.sel td{background:var(--sel);font-weight:600}
tr.bad td{color:var(--muted)}
td.pos{color:var(--green);font-weight:600} td.neg{color:var(--red);font-weight:600}
.calc{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 0;margin:12px 0}
.calc ol{margin:0;padding:0;list-style:none;counter-reset:c}
.calc li{counter-increment:c;display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:4px 10px;padding:10px 16px;border-bottom:1px dashed var(--line)}
.calc li:last-child{border-bottom:0}
.calc li::before{content:counter(c);width:1.65rem;height:1.65rem;border-radius:50%;background:var(--navy-2);color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center;margin-top:2px}
.calc .t{font-weight:600;color:var(--title)}
.f{font-family:var(--mono),var(--body);font-size:.92rem;background:var(--ground);border-radius:6px;padding:6px 10px;margin-top:4px;overflow-x:auto;white-space:nowrap}
.res{font-weight:700;color:var(--green)}
.big{font-size:1.25rem;font-weight:700;color:var(--title)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.82rem;font-weight:600}
.ok{background:var(--green-soft);color:var(--green)}
.no{background:var(--red-soft);color:var(--red)}
.try{background:var(--chip);border:1px dashed var(--input-line);border-radius:10px;padding:12px 16px;margin:16px 0}
.try h4{margin-top:0}
.fields{display:flex;flex-wrap:wrap;gap:10px 18px}
.fields label{display:flex;flex-direction:column;font-size:.82rem;color:var(--muted);gap:3px}
input[type=number],input[type=text],select{font:inherit;font-size:.95rem;padding:5px 8px;border:1px solid var(--input-line);border-radius:6px;background:var(--input);color:var(--ink);width:7rem}
input[type=text]{width:100%;min-width:9rem}
.fields select{width:auto}
td input[type=number]{width:5.2rem}
.inp-psh{width:4.2rem!important}
.carry{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 16px;font-size:.85rem}
.carry span{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.carry span.cl{border:0;background:none;padding-left:0;color:var(--muted)}
.carry b{color:var(--title)}
details.q{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-top:18px}
details.q summary{cursor:pointer;font-weight:600;color:var(--title)}
details.q p{margin-top:8px}
.seq{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:8px;margin:12px 0}
.seq div{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--navy-2);border-radius:8px;padding:8px 10px;font-size:.9rem}
.seq div span{display:block;font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--sun-text);text-transform:uppercase}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:30px}
.dim{color:var(--muted);font-size:.85rem}
@media (prefers-reduced-motion:no-preference){section.panel.on{animation:fade .2s ease}}
@keyframes fade{from{opacity:.5}to{opacity:1}}
@media print{
  @page{size:A4;margin:12mm}
  html{font-size:12px!important}
  body{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top{background:#fff;color:#1c2533;border-bottom:3px solid #16325c;padding-block:0 6px}
  .top h1{color:#16325c} .top p.sub,.top .meta{color:#5a6578}
  .tabbar,.toolbar,.navrow,.try,.noprint{display:none!important}
  section.panel{display:block!important;break-before:page}
  section.panel:first-of-type{break-before:auto}
  .card,figure,.calc li,table,.note,.why,.warn{break-inside:avoid}
  .grid2{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)!important}
  .f{white-space:normal;overflow:visible}
  main{padding-block:8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="meta"><span data-t="meta1"></span><span data-t="meta2"></span><span data-t="meta3"></span></div>
    <h1 data-t="h1"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="toolbar">
      <div class="tgroup"><label class="lbl" for="langSel" data-t="lblLang"></label>
        <select id="langSel" class="hsel"><option value="0">English</option><option value="1">हिन्दी</option><option value="2">മലയാളം</option></select></div>
      <div class="tgroup"><span class="lbl" data-t="lblSize"></span>
        <div class="seg"><button type="button" id="fsDown" aria-label="Smaller text">A−</button><button type="button" id="fsReset" aria-label="Normal text size"><span id="sizeVal">100%</span></button><button type="button" id="fsUp" aria-label="Larger text">A+</button></div></div>
      <div class="tgroup"><span class="lbl" data-t="lblTheme"></span>
        <div class="seg"><button type="button" id="thLight" data-t="thLight" aria-pressed="false"></button><button type="button" id="thDark" data-t="thDark" aria-pressed="false"></button></div></div>
      <button type="button" class="btn-h" id="btnProj" data-t="btnProj" aria-pressed="false"></button>
      <button type="button" class="btn-sun" id="btnPrint" data-t="btnPrint"></button>
      <button type="button" class="btn-h" id="btnReset" data-t="btnReset"></button>
    </div>
  </div>
</header>
<div class="tabbar"><div class="wrap"><nav class="tabs" role="tablist" id="tabs"></nav></div></div>

<main class="wrap" id="main">

<!-- ============ TAB 0 ============ -->
<section class="panel" id="t0" data-tab="tab0">
  <span class="steptag" data-t="before"></span>
  <h2 data-t="h2_0"></h2>
  <div class="grid2">
    <div>
      <p class="lead" data-t="p0a"></p>
      <p data-t="p0b"></p>
      <p data-t="p0c"></p>
      <div class="warn" data-t="warn0"></div>
      <h3 data-t="h3seq"></h3>
      <div class="seq" id="seqBox"></div>
    </div>
    <figure>
      <svg viewBox="0 0 460 380" role="img" aria-label="Grid-tie block diagram">
        <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#16325c"/></marker></defs>
        <rect width="460" height="380" fill="#fff"/>
        <circle cx="40" cy="38" r="20" fill="#f5b52e"/>
        <g stroke="#f5b52e" stroke-width="3"><line x1="40" y1="6" x2="40" y2="0"/><line x1="72" y1="38" x2="80" y2="38"/><line x1="8" y1="38" x2="2" y2="38"/><line x1="63" y1="15" x2="69" y2="9"/><line x1="63" y1="61" x2="69" y2="67"/></g>
        <g transform="translate(90,16)"><rect width="120" height="64" rx="4" fill="#1f3f73" stroke="#0f2342" stroke-width="2"/>
          <g stroke="#7fa0d6"><line x1="30" y1="0" x2="30" y2="64"/><line x1="60" y1="0" x2="60" y2="64"/><line x1="90" y1="0" x2="90" y2="64"/><line x1="0" y1="21" x2="120" y2="21"/><line x1="0" y1="42" x2="120" y2="42"/></g></g>
        <text x="150" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#16325c" data-t="sv_pv" data-fit="110"></text>

        <path d="M315,268 L315,318 L254,318" fill="none" stroke="#16325c" stroke-width="2.5" marker-end="url(#ar)"/>
        <rect x="390" y="216" width="62" height="96" rx="6" fill="#f3f5f9" stroke="#16325c" stroke-width="1.5"/>
        <polygon points="390,216 421,192 452,216" fill="#16325c"/>

        <text x="421" y="266" text-anchor="middle" font-size="11" fill="#16325c" data-t="sv_loads" data-fit="56"></text>
        <line x1="377" y1="241" x2="386" y2="241" stroke="#16325c" stroke-width="2.5" marker-end="url(#ar)"/>
        <g transform="translate(40,250)" stroke="#5a6578" stroke-width="2" fill="none"><path d="M30,0 L10,90 M30,0 L50,90 M12,30 L48,30 M18,55 L42,55 M0,30 L60,30"/></g>
        <text x="70" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#16325c" data-t="sv_grid" data-fit="120"></text>
        <line x1="138" y1="318" x2="102" y2="318" stroke="#16325c" stroke-width="2.5" marker-end="url(#ar)"/>
        <line x1="102" y1="330" x2="138" y2="330" stroke="#2c7a4b" stroke-width="2" stroke-dasharray="5 3"/>
        <g font-size="11" font-weight="700" fill="#fff">
          <circle cx="216" cy="98" r="11" fill="#e39b0b"/><text x="216" y="102" text-anchor="middle">3-4</text>
          <circle cx="388" cy="148" r="11" fill="#e39b0b"/><text x="388" y="152" text-anchor="middle">5-6</text>
          <circle cx="388" cy="48" r="11" fill="#e39b0b"/><text x="388" y="52" text-anchor="middle">8</text>
          <circle cx="421" cy="328" r="11" fill="#e39b0b"/><text x="421" y="332" text-anchor="middle">1-2</text>

      <figcaption data-t="cap0"></figcaption>
    </figure>
  </div>
  <div class="tablebox"><table>
    <tr><th></th><th data-t="c_gt"></th><th data-t="c_sa"></th></tr>
    <tr><td data-t="c_r1"></td><td data-t="c_r1a"></td><td data-t="c_r1b"></td></tr>

h2_0:["What is a grid-tie solar PV system?","ग्रिड-टाई सोलर पीवी सिस्टम क्या है?","എന്താണ് ഗ്രിഡ്-ടൈ സോളാർ പിവി സിസ്റ്റം?"],
p0a:["A grid-tie system works together with the KSEB supply. It has <b>no battery and no charge controller</b>. The grid itself acts like a very large battery.","ग्रिड-टाई सिस्टम KSEB (बिजली बोर्ड) की सप्लाई के साथ मिलकर काम करता है। इसमें <b>न बैटरी होती है, न चार्ज कंट्रोलर</b>। ग्रिड स्वयं एक बहुत बड़ी बैटरी की तरह काम करता है।","ഗ്രിഡ്-ടൈ സിസ്റ്റം KSEB സപ്ലൈയോടൊപ്പം ചേർന്നാണ് പ്രവർത്തിക്കുന്നത്. ഇതിൽ <b>ബാറ്ററിയോ ചാർജ് കൺട്രോളറോ ഇല്ല</b>. ഗ്രിഡ് തന്നെ വളരെ വലിയ ഒരു ബാറ്ററി പോലെ പ്രവർത്തിക്കുന്നു."],
p0b:["During the day the PV modules produce DC. The <b>grid-tie inverter</b> converts it to 230 V AC that is exactly in step (same voltage, frequency and phase) with the grid. The house loads use this solar power first. If solar produces more than the house is using, the extra energy flows out to the grid through a <b>bi-directional (net) meter</b>. At night, or on a cloudy day, the house takes energy from the grid as usual. At the end of the billing period you pay only for the <b>net</b> energy: imported minus exported.","दिन में पीवी मॉड्यूल DC बनाते हैं। <b>ग्रिड-टाई इन्वर्टर</b> इसे 230 V AC में बदलता है जो ग्रिड के साथ बिल्कुल तालमेल में होता है (समान वोल्टेज, आवृत्ति और फेज़)। घर के लोड पहले इसी सौर बिजली का उपयोग करते हैं। यदि सौर उत्पादन घर के उपयोग से अधिक है, तो अतिरिक्त ऊर्जा <b>द्वि-दिशात्मक (नेट) मीटर</b> से होकर ग्रिड में चली जाती है। रात में या बादल वाले दिन घर सामान्य रूप से ग्रिड से ऊर्जा लेता है। बिलिंग अवधि के अंत में आप केवल <b>शुद्ध (नेट)</b> ऊर्जा का भुगतान करते हैं: आयात घटा निर्यात।","പകൽ സമയത്ത് പിവി മൊഡ്യൂളുകൾ DC ഉത്പാദിപ്പിക്കുന്നു. <b>ഗ്രിഡ്-ടൈ ഇൻവെർട്ടർ</b> അതിനെ ഗ്രിഡുമായി കൃത്യമായി ഒത്തുപോകുന്ന (ഒരേ വോൾട്ടേജ്, ഫ്രീക്വൻസി, ഫേസ്) 230 V AC ആക്കി മാറ്റുന്നു. വീട്ടിലെ ലോഡുകൾ ആദ്യം ഈ സൗരോർജ്ജം ഉപയോഗിക്കുന്നു. വീട്ടിലെ ഉപയോഗത്തേക്കാൾ കൂടുതൽ സൗരോർജ്ജം ഉണ്ടെങ്കിൽ, അധിക ഊർജ്ജം <b>ബൈ-ഡയറക്ഷണൽ (നെറ്റ്) മീറ്റർ</b> വഴി ഗ്രിഡിലേക്ക് പോകുന്നു. രാത്രിയിലോ മേഘാവൃതമായ ദിവസങ്ങളിലോ വീട് സാധാരണ പോലെ ഗ്രിഡിൽ നിന്ന് ഊർജ്ജം എടുക്കുന്നു. ബില്ലിംഗ് കാലാവധിയുടെ അവസാനം <b>നെറ്റ്</b> ഊർജ്ജത്തിന് മാത്രം പണം നൽകിയാൽ മതി: ഇറക്കുമതി ചെയ്തതിൽ നിന്ന് കയറ്റുമതി ചെയ്തത് കുറച്ചത്."],
p0c:["Because the grid always fills any shortfall, a failure of the PV system does not cause loss of load. So we do not size the plant to carry the loads at every moment. We size it to <b>produce the energy the house uses over the year</b>, limited by roof area, budget and the inverter's input limits.","क्योंकि ग्रिड हमेशा कमी को पूरा करता है, पीवी सिस्टम के खराब होने पर भी लोड बंद नहीं होता। इसलिए हम प्लांट को हर क्षण लोड चलाने के लिए साइज़ नहीं करते। हम इसे <b>घर द्वारा वर्ष भर में उपयोग की जाने वाली ऊर्जा का उत्पादन करने</b> के लिए साइज़ करते हैं, जो छत के क्षेत्रफल, बजट और इन्वर्टर की इनपुट सीमाओं से सीमित होता है।","ഏത് കുറവും ഗ്രിഡ് എപ്പോഴും നികത്തുന്നതിനാൽ, പിവി സിസ്റ്റം തകരാറിലായാലും ലോഡ് മുടങ്ങുന്നില്ല. അതിനാൽ ഓരോ നിമിഷവും ലോഡുകൾ വഹിക്കാനല്ല പ്ലാന്റ് സൈസ് ചെയ്യുന്നത്. <b>വീട് ഒരു വർഷം ഉപയോഗിക്കുന്ന ഊർജ്ജം ഉത്പാദിപ്പിക്കാൻ</b> വേണ്ടിയാണ് സൈസ് ചെയ്യുന്നത്; മേൽക്കൂരയുടെ വിസ്തീർണ്ണം, ബജറ്റ്, ഇൻവെർട്ടറിന്റെ ഇൻപുട്ട് പരിധികൾ എന്നിവ ഇതിനെ പരിമിതപ്പെടുത്തുന്നു."],
warn0:["<b>Safety: anti-islanding</b>When the grid fails, a grid-tie inverter must switch off automatically within a fraction of a second. Otherwise it would keep the dead line alive and could kill a lineman working on it. This is called anti-islanding protection. For the same reason, a pure grid-tie system gives <b>no power during a power cut</b>.","<b>सुरक्षा: एंटी-आइलैंडिंग</b>जब ग्रिड बंद हो जाता है, तो ग्रिड-टाई इन्वर्टर को एक सेकंड के अंश में स्वतः बंद होना चाहिए। अन्यथा वह बंद लाइन को चालू रखेगा और उस पर काम कर रहे लाइनमैन की जान जा सकती है। इसे एंटी-आइलैंडिंग सुरक्षा कहते हैं। इसी कारण शुद्ध ग्रिड-टाई सिस्टम <b>बिजली कटौती के समय बिजली नहीं देता</b>।","<b>സുരക്ഷ: ആന്റി-ഐലൻഡിംഗ്</b>ഗ്രിഡ് നിലച്ചാൽ, ഗ്രിഡ്-ടൈ ഇൻവെർട്ടർ ഒരു സെക്കൻഡിന്റെ അംശത്തിനുള്ളിൽ സ്വയം ഓഫ് ആകണം. അല്ലെങ്കിൽ അത് ഓഫ് ആയ ലൈനിൽ വൈദ്യുതി നിലനിർത്തുകയും അതിൽ ജോലി ചെയ്യുന്ന ലൈൻമാന്റെ ജീവന് അപകടം ഉണ്ടാക്കുകയും ചെയ്യും. ഇതിനെ ആന്റി-ഐലൻഡിംഗ് സംരക്ഷണം എന്ന് പറയുന്നു. ഇതേ കാരണത്താൽ, ശുദ്ധ ഗ്രിഡ്-ടൈ സിസ്റ്റം <b>വൈദ്യുതി മുടക്കസമയത്ത് വൈദ്യുതി നൽകില്ല</b>."],

cap0:["Grid-tie rooftop system. No battery: surplus goes to the grid, shortfall comes from the grid. Circled numbers show the sizing step for each part.","ग्रिड-टाई रूफटॉप सिस्टम। कोई बैटरी नहीं: अधिशेष ग्रिड को जाता है, कमी ग्रिड से आती है। गोले में अंक प्रत्येक भाग का साइज़िंग चरण दिखाते हैं।","ഗ്രിഡ്-ടൈ റൂഫ്‌ടോപ്പ് സിസ്റ്റം. ബാറ്ററി ഇല്ല: അധികം ഗ്രിഡിലേക്ക് പോകുന്നു, കുറവ് ഗ്രിഡിൽ നിന്ന് വരുന്നു. വൃത്തത്തിലെ സംഖ്യകൾ ഓരോ ഭാഗവും സൈസ് ചെയ്യുന്ന ഘട്ടം കാണിക്കുന്നു."],

q0:["Why does a grid-tie system not need a battery or a charge controller?","ग्रिड-टाई सिस्टम को बैटरी या चार्ज कंट्रोलर की आवश्यकता क्यों नहीं होती?","ഗ്രിഡ്-ടൈ സിസ്റ്റത്തിന് ബാറ്ററിയോ ചാർജ് കൺട്രോളറോ എന്തുകൊണ്ട് ആവശ്യമില്ല?"],
a0:["The grid accepts surplus energy and supplies any shortfall, so no storage is needed. The MPPT that extracts maximum power from the array is built into the grid-tie inverter.","ग्रिड अतिरिक्त ऊर्जा स्वीकार करता है और कमी पूरी करता है, इसलिए भंडारण की आवश्यकता नहीं। ऐरे से अधिकतम शक्ति निकालने वाला MPPT ग्रिड-टाई इन्वर्टर में ही बना होता है।","ഗ്രിഡ് അധിക ഊർജ്ജം സ്വീകരിക്കുകയും കുറവ് നികത്തുകയും ചെയ്യുന്നതിനാൽ സംഭരണം ആവശ്യമില്ല. അറേയിൽ നിന്ന് പരമാവധി പവർ എടുക്കുന്ന MPPT ഗ്രിഡ്-ടൈ ഇൻവെർട്ടറിനുള്ളിൽ തന്നെയുണ്ട്."],

h2_1:["Survey of equipment and their wattage","उपकरणों और उनके वाटेज का सर्वे","ഉപകരണങ്ങളുടെയും അവയുടെ വാട്ടേജിന്റെയും സർവേ"],
p1lead:["We visit the house and list every appliance with its power rating in watts, the number of units and the hours it is used each day.","हम घर जाकर हर उपकरण की सूची बनाते हैं: वाट में उसकी पावर रेटिंग, संख्या और प्रतिदिन उपयोग के घंटे।","വീട് സന്ദർശിച്ച് ഓരോ ഉപകരണവും അതിന്റെ വാട്ടിലുള്ള പവർ റേറ്റിംഗ്, എണ്ണം, ദിവസേന ഉപയോഗിക്കുന്ന മണിക്കൂറുകൾ എന്നിവ സഹിതം പട്ടികപ്പെടുത്തുന്നു."],
p1a:["The watt rating is printed on the appliance's rating plate or box. Multiplying watts by quantity gives the connected load of each item; adding all items gives the <b>total connected load</b>.","वाट रेटिंग उपकरण की रेटिंग प्लेट या डिब्बे पर छपी होती है। वाट × संख्या से हर उपकरण का कनेक्टेड लोड मिलता है; सभी को जोड़ने पर <b>कुल कनेक्टेड लोड</b> मिलता है।","വാട്ട് റേറ്റിംഗ് ഉപകരണത്തിന്റെ റേറ്റിംഗ് പ്ലേറ്റിലോ പെട്ടിയിലോ അച്ചടിച്ചിരിക്കും. വാട്ടിനെ എണ്ണം കൊണ്ട് ഗുണിച്ചാൽ ഓരോ ഇനത്തിന്റെയും കണക്റ്റഡ് ലോഡ് കിട്ടും; എല്ലാം കൂട്ടിയാൽ <b>ആകെ കണക്റ്റഡ് ലോഡ്</b> കിട്ടും."],
p1b:["In a grid-tie system the connected load does <b>not</b> decide the inverter size (that comes from the PV array in Step 5). It tells us two useful things. First, the type of supply the house has: in Kerala a house with a connected load up to about 5 kW is usually given single-phase supply, and a bigger load three-phase. The grid-tie inverter must match this supply. Second, it shows which loads run in the daytime, when solar power is available and can be used directly in the house.","ग्रिड-टाई सिस्टम में कनेक्टेड लोड इन्वर्टर का आकार तय <b>नहीं</b> करता (वह चरण 5 में पीवी ऐरे से आता है)। यह हमें दो उपयोगी बातें बताता है। पहली, घर में किस प्रकार की सप्लाई है: केरल में लगभग 5 kW तक कनेक्टेड लोड वाले घर को सामान्यतः सिंगल-फेज़ सप्लाई और अधिक लोड पर थ्री-फेज़ सप्लाई दी जाती है। ग्रिड-टाई इन्वर्टर इस सप्लाई से मेल खाना चाहिए। दूसरी, कौन से लोड दिन में चलते हैं, जब सौर बिजली उपलब्ध होती है और सीधे घर में उपयोग हो सकती है।","ഗ്രിഡ്-ടൈ സിസ്റ്റത്തിൽ കണക്റ്റഡ് ലോഡ് ഇൻവെർട്ടറിന്റെ വലുപ്പം <b>നിശ്ചയിക്കുന്നില്ല</b> (അത് ഘട്ടം 5-ൽ പിവി അറേയിൽ നിന്നാണ് വരുന്നത്). ഇത് രണ്ട് ഉപയോഗപ്രദമായ കാര്യങ്ങൾ പറയുന്നു. ഒന്ന്, വീടിന് ഏത് തരം സപ്ലൈ ആണ്: കേരളത്തിൽ ഏകദേശം 5 kW വരെ കണക്റ്റഡ് ലോഡുള്ള വീടിന് സാധാരണയായി സിംഗിൾ-ഫേസ് സപ്ലൈയും, കൂടുതൽ ലോഡിന് ത്രീ-ഫേസ് സപ്ലൈയും നൽകുന്നു. ഗ്രിഡ്-ടൈ ഇൻവെർട്ടർ ഈ സപ്ലൈയുമായി യോജിക്കണം. രണ്ട്, സൗരോർജ്ജം ലഭ്യമായ പകൽ സമയത്ത് ഏതൊക്കെ ലോഡുകൾ പ്രവർത്തിക്കുന്നു എന്നും, അവയ്ക്ക് നേരിട്ട് സൗരോർജ്ജം ഉപയോഗിക്കാമെന്നും ഇത് കാണിക്കുന്നു."],
note1:["<b>Field practice</b>Check the KSEB bill as well. It shows the connected load registered for the consumer and the actual units used, which is a good cross-check for our survey.","<b>क्षेत्र अभ्यास</b>KSEB बिल भी देखें। इसमें उपभोक्ता का पंजीकृत कनेक्टेड लोड और वास्तविक उपयोग की गई यूनिट होती हैं, जो हमारे सर्वे की अच्छी जाँच है।","<b>ഫീൽഡ് പ്രാക്ടീസ്</b>KSEB ബില്ലും പരിശോധിക്കുക. ഉപഭോക്താവിന്റെ രജിസ്റ്റർ ചെയ്ത കണക്റ്റഡ് ലോഡും യഥാർത്ഥത്തിൽ ഉപയോഗിച്ച യൂണിറ്റുകളും അതിൽ കാണാം; നമ്മുടെ സർവേ ഒത്തുനോക്കാൻ ഇത് നല്ലതാണ്."],

h3_1:["Load survey sheet","लोड सर्वे शीट","ലോഡ് സർവേ ഷീറ്റ്"],
p1c:["Filled with a worked example of a Kerala house. Edit any cell or add rows; all later steps update.","केरल के एक घर के उदाहरण से भरा है। कोई भी सेल बदलें या पंक्ति जोड़ें; आगे के सभी चरण अपडेट होंगे।","ഒരു കേരള വീടിന്റെ ഉദാഹരണം കൊണ്ട് പൂരിപ്പിച്ചിരിക്കുന്നു. ഏത് സെല്ലും മാറ്റുകയോ വരികൾ ചേർക്കുകയോ ചെയ്യാം; തുടർന്നുള്ള എല്ലാ ഘട്ടങ്ങളും പുതുക്കപ്പെടും."],

c1f:["Connected load (W) = Rating (W) × Quantity","कनेक्टेड लोड (W) = रेटिंग (W) × संख्या","കണക്റ്റഡ് ലോഡ് (W) = റേറ്റിംഗ് (W) × എണ്ണം"],

supply1:["Connected load {a} kW (up to about 5 kW) → usually <b>single-phase</b> supply; a single-phase grid-tie inverter will be used if the plant is within single-phase limits.","कनेक्टेड लोड {a} kW (लगभग 5 kW तक) → सामान्यतः <b>सिंगल-फेज़</b> सप्लाई; प्लांट सिंगल-फेज़ सीमा में हो तो सिंगल-फेज़ ग्रिड-टाई इन्वर्टर लगेगा।","കണക്റ്റഡ് ലോഡ് {a} kW (ഏകദേശം 5 kW വരെ) → സാധാരണയായി <b>സിംഗിൾ-ഫേസ്</b> സപ്ലൈ; പ്ലാന്റ് സിംഗിൾ-ഫേസ് പരിധിക്കുള്ളിലാണെങ്കിൽ സിംഗിൾ-ഫേസ് ഗ്രിഡ്-ടൈ ഇൻവെർട്ടർ ഉപയോഗിക്കും."],
supply3:["Connected load {a} kW (above about 5 kW) → usually <b>three-phase</b> supply.","कनेक्टेड लोड {a} kW (लगभग 5 kW से अधिक) → सामान्यतः <b>थ्री-फेज़</b> सप्लाई।","കണക്റ്റഡ് ലോഡ് {a} kW (ഏകദേശം 5 kW-ൽ കൂടുതൽ) → സാധാരണയായി <b>ത്രീ-ഫേസ്</b> സപ്ലൈ."],
q1:["10 LED lamps of 9 W and 5 fans of 60 W. What is the connected load?","9 W के 10 LED लैंप और 60 W के 5 पंखे। कनेक्टेड लोड कितना है?","9 W-ന്റെ 10 LED ലാമ്പുകളും 60 W-ന്റെ 5 ഫാനുകളും. കണക്റ്റഡ് ലോഡ് എത്ര?"],
a1:["10 × 9 = 90 W; 5 × 60 = 300 W; total = <b>390 W</b>.","10 × 9 = 90 W; 5 × 60 = 300 W; कुल = <b>390 W</b>।","10 × 9 = 90 W; 5 × 60 = 300 W; ആകെ = <b>390 W</b>."],

h2_2:["Daily and monthly energy requirement","दैनिक और मासिक ऊर्जा आवश्यकता","ദിവസ, മാസ ഊർജ്ജ ആവശ്യകത"],
p2lead:["Watts tell how fast energy is used. Watt-hours tell how much is used. A grid-tie plant is sized on energy.","वाट बताता है कि ऊर्जा कितनी तेज़ी से उपयोग होती है। वाट-घंटा बताता है कि कितनी ऊर्जा उपयोग हुई। ग्रिड-टाई प्लांट ऊर्जा के आधार पर साइज़ होता है।","ഊർജ്ജം എത്ര വേഗത്തിൽ ഉപയോഗിക്കുന്നു എന്ന് വാട്ട് പറയുന്നു. എത്ര ഉപയോഗിച്ചു എന്ന് വാട്ട്-അവർ പറയുന്നു. ഗ്രിഡ്-ടൈ പ്ലാന്റ് സൈസ് ചെയ്യുന്നത് ഊർജ്ജത്തിന്റെ അടിസ്ഥാനത്തിലാണ്."],
p2a:["Energy of an appliance = watts × quantity × hours of use per day. A 1200 W air conditioner used for 4 hours uses 1200 × 4 = 4800 Wh, while a 1000 W iron used for half an hour uses only 500 Wh. Adding all appliances gives the <b>daily energy</b> in Wh. Dividing by 1000 gives kWh, which is the same as <b>units</b> on the electricity bill.","किसी उपकरण की ऊर्जा = वाट × संख्या × प्रतिदिन उपयोग के घंटे। 4 घंटे चलने वाला 1200 W एयर कंडीशनर 1200 × 4 = 4800 Wh उपयोग करता है, जबकि आधा घंटा चलने वाली 1000 W की प्रेस केवल 500 Wh। सभी उपकरणों को जोड़ने पर Wh में <b>दैनिक ऊर्जा</b> मिलती है। 1000 से भाग देने पर kWh मिलता है, जो बिजली बिल की <b>यूनिट</b> के बराबर है।","ഒരു ഉപകരണത്തിന്റെ ഊർജ്ജം = വാട്ട് × എണ്ണം × ദിവസേനയുള്ള ഉപയോഗ മണിക്കൂർ. 4 മണിക്കൂർ പ്രവർത്തിക്കുന്ന 1200 W എയർ കണ്ടീഷണർ 1200 × 4 = 4800 Wh ഉപയോഗിക്കുന്നു; അര മണിക്കൂർ ഉപയോഗിക്കുന്ന 1000 W അയൺ ബോക്സ് 500 Wh മാത്രം. എല്ലാ ഉപകരണങ്ങളും കൂട്ടിയാൽ Wh-ൽ <b>ദിവസ ഊർജ്ജം</b> ലഭിക്കും. 1000 കൊണ്ട് ഹരിച്ചാൽ kWh ലഭിക്കും; ഇത് വൈദ്യുതി ബില്ലിലെ <b>യൂണിറ്റ്</b> തന്നെയാണ്."],
p2b:["Monthly energy = daily kWh × 30. KSEB bills domestic consumers once in two months, so compare our two-month figure with the units on the bill.","मासिक ऊर्जा = दैनिक kWh × 30। KSEB घरेलू उपभोक्ताओं को दो महीने में एक बार बिल देता है, इसलिए हमारे दो-माह के आँकड़े की तुलना बिल की यूनिट से करें।","മാസ ഊർജ്ജം = ദിവസ kWh × 30. KSEB ഗാർഹിക ഉപഭോക്താക്കൾക്ക് രണ്ട് മാസത്തിലൊരിക്കലാണ് ബിൽ നൽകുന്നത്; അതിനാൽ നമ്മുടെ രണ്ട് മാസത്തെ കണക്ക് ബില്ലിലെ യൂണിറ്റുമായി താരതമ്യം ചെയ്യുക."],
note2:["<b>Refrigerator and AC hours</b>The compressor of a refrigerator or an air conditioner switches on and off by thermostat. Use the hours the compressor actually runs, not the hours the appliance is plugged in.","<b>रेफ्रिजरेटर और AC के घंटे</b>रेफ्रिजरेटर या एयर कंडीशनर का कंप्रेसर थर्मोस्टेट से चालू-बंद होता है। उपकरण के प्लग में लगे रहने के घंटे नहीं, बल्कि कंप्रेसर के वास्तव में चलने के घंटे लें।","<b>റഫ്രിജറേറ്റർ, AC മണിക്കൂറുകൾ</b>റഫ്രിജറേറ്ററിന്റെയോ എയർ കണ്ടീഷണറിന്റെയോ കംപ്രസർ തെർമോസ്റ്റാറ്റ് വഴി ഓൺ-ഓഫ് ആകുന്നു. ഉപകരണം പ്ലഗിൽ ഉള്ള മണിക്കൂറല്ല, കംപ്രസർ യഥാർത്ഥത്തിൽ പ്രവർത്തിക്കുന്ന മണിക്കൂറാണ് എടുക്കേണ്ടത്."],

cap2b:["Share of daily energy. A few appliances usually decide the plant size.","दैनिक ऊर्जा में हिस्सा। आम तौर पर कुछ ही उपकरण प्लांट का आकार तय करते हैं।","ദിവസ ഊർജ്ജത്തിലെ പങ്ക്. സാധാരണയായി ചുരുക്കം ചില ഉപകരണങ്ങളാണ് പ്ലാന്റിന്റെ വലുപ്പം നിശ്ചയിക്കുന്നത്."],

why2:["<b>Why energy and not watts?</b>The plant earns its value by producing units (kWh) over the year. A house may have a 4 kW connected load but use only 11 units a day; a 3 kWp plant can produce those units even though it can never supply 4 kW at one moment. Whatever solar cannot supply at that moment comes from the grid.","<b>वाट नहीं, ऊर्जा क्यों?</b>प्लांट का मूल्य वर्ष भर में यूनिट (kWh) बनाने से है। किसी घर का कनेक्टेड लोड 4 kW हो सकता है पर उपयोग केवल 11 यूनिट प्रतिदिन; एक 3 kWp प्लांट वे यूनिट बना सकता है, भले ही वह किसी क्षण 4 kW न दे सके। जो सौर उस क्षण नहीं दे पाता, वह ग्रिड से आता है।","<b>വാട്ട് അല്ല, ഊർജ്ജം എന്തുകൊണ്ട്?</b>ഒരു വർഷം കൊണ്ട് യൂണിറ്റുകൾ (kWh) ഉത്പാദിപ്പിക്കുന്നതിലാണ് പ്ലാന്റിന്റെ മൂല്യം. ഒരു വീടിന് 4 kW കണക്റ്റഡ് ലോഡ് ഉണ്ടാകാം, പക്ഷേ ദിവസം 11 യൂണിറ്റ് മാത്രം ഉപയോഗിക്കാം; ഒരു 3 kWp പ്ലാന്റിന് ഒരു നിമിഷവും 4 kW നൽകാൻ കഴിയില്ലെങ്കിലും ആ യൂണിറ്റുകൾ ഉത്പാദിപ്പിക്കാൻ കഴിയും. ആ നിമിഷം സോളാറിന് നൽകാൻ കഴിയാത്തത് ഗ്രിഡിൽ നിന്ന് വരും."],
q2:["A house uses 9 units a day. How many units appear on a two-month KSEB bill?","एक घर प्रतिदिन 9 यूनिट उपयोग करता है। दो महीने के KSEB बिल में कितनी यूनिट आएँगी?","ഒരു വീട് ദിവസം 9 യൂണിറ്റ് ഉപയോഗിക്കുന്നു. രണ്ട് മാസത്തെ KSEB ബില്ലിൽ എത്ര യൂണിറ്റ് വരും?"],
a2:["9 × 60 = <b>540 units</b> (approximately, for a 60-day billing period).","9 × 60 = <b>540 यूनिट</b> (लगभग, 60 दिन की बिलिंग अवधि के लिए)।","9 × 60 = <b>540 യൂണിറ്റ്</b> (ഏകദേശം, 60 ദിവസത്തെ ബില്ലിംഗ് കാലയളവിന്)."],

h2_3:["Fixing the capacity of the PV plant (kWp)","पीवी प्लांट की क्षमता (kWp) तय करना","പിവി പ്ലാന്റിന്റെ ശേഷി (kWp) നിശ്ചയിക്കൽ"],
p3lead:["We find the plant size whose yearly output, after all losses, matches the energy the house uses.","हम वह प्लांट आकार ज्ञात करते हैं जिसका वार्षिक उत्पादन, सभी हानियों के बाद, घर द्वारा उपयोग की गई ऊर्जा के बराबर हो।","എല്ലാ നഷ്ടങ്ങൾക്കും ശേഷമുള്ള വാർഷിക ഉത്പാദനം വീടിന്റെ ഊർജ്ജ ഉപയോഗത്തിന് തുല്യമാകുന്ന പ്ലാന്റ് വലുപ്പം നാം കണ്ടെത്തുന്നു."],
h4_3a:["a) Peak sun hours (PSH)","क) पीक सन आवर्स (PSH)","a) പീക്ക് സൺ അവേഴ്സ് (PSH)"],
p3a:["Solar radiation at a place is given in kWh/m²/day. A module gives its full rated output only at Standard Test Conditions (STC): 1000 W/m², 25 °C cell temperature, air mass 1.5. A radiation of 5 kWh/m²/day is the same as 1000 W/m² for 5 hours, so the place has 5 peak sun hours. In India it varies from about 3 to 7 kWh/m²/day. We design with {psh} PSH.","किसी स्थान पर सौर विकिरण kWh/m²/दिन में दिया जाता है। मॉड्यूल अपना पूरा रेटेड आउटपुट केवल मानक परीक्षण स्थिति (STC) में देता है: 1000 W/m², 25 °C सेल तापमान, एयर मास 1.5। 5 kWh/m²/दिन विकिरण 5 घंटे तक 1000 W/m² के बराबर है, अतः उस स्थान पर 5 पीक सन आवर्स हैं। भारत में यह लगभग 3 से 7 kWh/m²/दिन होता है। हम {psh} PSH से डिज़ाइन करते हैं।","ഒരു സ്ഥലത്തെ സൗരവികിരണം kWh/m²/ദിവസം എന്ന രീതിയിലാണ് നൽകുന്നത്. സ്റ്റാൻഡേർഡ് ടെസ്റ്റ് കണ്ടീഷനിൽ (STC) മാത്രമേ മൊഡ്യൂൾ പൂർണ്ണ റേറ്റഡ് ഔട്ട്പുട്ട് നൽകൂ: 1000 W/m², 25 °C സെൽ താപനില, എയർ മാസ് 1.5. 5 kWh/m²/ദിവസം വികിരണം എന്നത് 5 മണിക്കൂർ 1000 W/m² ലഭിക്കുന്നതിന് തുല്യമാണ്; അതിനാൽ ആ സ്ഥലത്ത് 5 പീക്ക് സൺ അവേഴ്സ് ഉണ്ട്. ഇന്ത്യയിൽ ഇത് ഏകദേശം 3 മുതൽ 7 kWh/m²/ദിവസം വരെയാണ്. നാം {psh} PSH ഉപയോഗിച്ച് ഡിസൈൻ ചെയ്യുന്നു."],
h4_3b:["b) Losses (from the lesson)","ख) हानियाँ (पाठ से)","b) നഷ്ടങ്ങൾ (പാഠത്തിൽ നിന്ന്)"],
p3b:["A module rarely gives its STC rating. Cell temperature on a roof is about 20 °C above ambient; with ambient {amb} °C the cell is at {tc} °C, and crystalline modules lose {tcp} % per °C above 25 °C. Dust, mismatch between modules, DC cable resistance and reflection from the glass add more loss. Then the inverter and AC cable lose a little.","मॉड्यूल शायद ही कभी अपनी STC रेटिंग देता है। छत पर सेल का तापमान परिवेश से लगभग 20 °C अधिक होता है; परिवेश {amb} °C पर सेल {tc} °C पर होता है, और क्रिस्टलीय मॉड्यूल 25 °C से ऊपर प्रति °C {tcp} % हानि करते हैं। धूल, मॉड्यूलों के बीच असमानता (मिसमैच), DC केबल का प्रतिरोध और काँच से परावर्तन और हानि जोड़ते हैं। फिर इन्वर्टर और AC केबल में थोड़ी हानि होती है।","മൊഡ്യൂൾ അപൂർവമായേ STC റേറ്റിംഗ് നൽകൂ. മേൽക്കൂരയിൽ സെൽ താപനില അന്തരീക്ഷ താപനിലയേക്കാൾ ഏകദേശം 20 °C കൂടുതലാണ്; അന്തരീക്ഷം {amb} °C ആകുമ്പോൾ സെൽ {tc} °C-ൽ ആയിരിക്കും; ക്രിസ്റ്റലൈൻ മൊഡ്യൂളുകൾക്ക് 25 °C-ന് മുകളിൽ ഓരോ °C-നും {tcp} % നഷ്ടമുണ്ട്. പൊടി, മൊഡ്യൂളുകൾ തമ്മിലുള്ള പൊരുത്തക്കേട് (മിസ്‌മാച്ച്), DC കേബിളിന്റെ പ്രതിരോധം, ഗ്ലാസിൽ നിന്നുള്ള പ്രതിഫലനം എന്നിവ കൂടുതൽ നഷ്ടം ഉണ്ടാക്കുന്നു. തുടർന്ന് ഇൻവെർട്ടറിലും AC കേബിളിലും ചെറിയ നഷ്ടം ഉണ്ട്."],
h4_3c:["c) Performance ratio (PR)","ग) परफॉर्मेंस रेशियो (PR)","c) പെർഫോമൻസ് റേഷ്യോ (PR)"],
p3c:["PR is the fraction of the ideal energy that actually reaches the grid. It combines all losses into one number. Plant capacity is then found by dividing the daily energy by (PSH × PR).","PR आदर्श ऊर्जा का वह भाग है जो वास्तव में ग्रिड तक पहुँचता है। यह सभी हानियों को एक संख्या में जोड़ता है। फिर दैनिक ऊर्जा को (PSH × PR) से भाग देकर प्लांट क्षमता मिलती है।","ആദർശ ഊർജ്ജത്തിന്റെ എത്ര ഭാഗം യഥാർത്ഥത്തിൽ ഗ്രിഡിൽ എത്തുന്നു എന്നതാണ് PR. എല്ലാ നഷ്ടങ്ങളെയും ഇത് ഒരു സംഖ്യയിൽ ഉൾക്കൊള്ളുന്നു. ദിവസ ഊർജ്ജത്തെ (PSH × PR) കൊണ്ട് ഹരിച്ചാൽ പ്ലാന്റ് ശേഷി കിട്ടും."],
sv_area:["Area under curve = area of rectangle = 5 kWh/m²/day","वक्र के नीचे क्षेत्र = आयत का क्षेत्र = 5 kWh/m²/दिन","വക്രത്തിനടിയിലെ വിസ്തീർണ്ണം = ദീർഘചതുരത്തിന്റെ വിസ്തീർണ്ണം = 5 kWh/m²/ദിവസം"],

why3:["Without losses we would get {a} ÷ {b} = {c} kWp. That plant would deliver only {d} % of the needed energy, a shortfall of about {e} units a year that the house would have to buy from the grid.","हानियों के बिना हमें {a} ÷ {b} = {c} kWp मिलता। वह प्लांट आवश्यक ऊर्जा का केवल {d} % देता, यानी वर्ष में लगभग {e} यूनिट की कमी, जो घर को ग्रिड से खरीदनी पड़ती।","നഷ്ടങ്ങൾ ഇല്ലെങ്കിൽ {a} ÷ {b} = {c} kWp എന്ന് കിട്ടും. ആ പ്ലാന്റ് ആവശ്യമായ ഊർജ്ജത്തിന്റെ {d} % മാത്രമേ നൽകൂ; വർഷം ഏകദേശം {e} യൂണിറ്റ് കുറവ്, അത് വീട് ഗ്രിഡിൽ നിന്ന് വാങ്ങേണ്ടിവരും."],
note3:["<b>Limits on capacity</b>The final size is also limited by shade-free roof area (about 10 m² per kWp), the load-bearing strength of the roof, budget and subsidy schemes, and the capacity the distribution utility allows for the consumer's connection. These are checked in Step 4.","<b>क्षमता की सीमाएँ</b>अंतिम आकार छाया-रहित छत क्षेत्र (लगभग 10 m² प्रति kWp), छत की भार-वहन क्षमता, बजट और सब्सिडी योजनाओं, तथा वितरण कंपनी द्वारा उपभोक्ता कनेक्शन हेतु अनुमत क्षमता से भी सीमित होता है। इनकी जाँच चरण 4 में होती है।","<b>ശേഷിയുടെ പരിധികൾ</b>നിഴലില്ലാത്ത മേൽക്കൂര വിസ്തീർണ്ണം (ഏകദേശം kWp-ന് 10 m²), മേൽക്കൂരയുടെ ഭാരം താങ്ങാനുള്ള ശേഷി, ബജറ്റ്, സബ്സിഡി പദ്ധതികൾ, ഉപഭോക്താവിന്റെ കണക്ഷന് വിതരണ കമ്പനി അനുവദിക്കുന്ന ശേഷി എന്നിവയും അന്തിമ വലുപ്പത്തെ പരിമിതപ്പെടുത്തുന്നു. ഇവ ഘട്ടം 4-ൽ പരിശോധിക്കുന്നു."],

h2_4:["Available standard module ratings and number of modules","उपलब्ध मानक मॉड्यूल रेटिंग और मॉड्यूलों की संख्या","ലഭ്യമായ സ്റ്റാൻഡേർഡ് മൊഡ്യൂൾ റേറ്റിംഗുകളും മൊഡ്യൂളുകളുടെ എണ്ണവും"],
p4lead:["PV modules are sold in standard ratings. We choose one rating, find how many modules are needed and check that they fit on the roof.","पीवी मॉड्यूल मानक रेटिंग में बिकते हैं। हम एक रेटिंग चुनते हैं, आवश्यक मॉड्यूलों की संख्या ज्ञात करते हैं और जाँचते हैं कि वे छत पर समा जाएँ।","പിവി മൊഡ്യൂളുകൾ സ്റ്റാൻഡേർഡ് റേറ്റിംഗുകളിലാണ് വിൽക്കുന്നത്. ഒരു റേറ്റിംഗ് തിരഞ്ഞെടുത്ത്, എത്ര മൊഡ്യൂളുകൾ വേണമെന്ന് കണ്ടെത്തി, അവ മേൽക്കൂരയിൽ ഒതുങ്ങുമോ എന്ന് പരിശോധിക്കുന്നു."],
p4a:["Number of modules N = required kWp × 1000 ÷ Wp of one module, always rounded <b>up</b>. The actual plant capacity is then N × module Wp, which is slightly more than required.","मॉड्यूलों की संख्या N = आवश्यक kWp × 1000 ÷ एक मॉड्यूल का Wp, हमेशा <b>ऊपर</b> की ओर पूर्णांकित। वास्तविक प्लांट क्षमता = N × मॉड्यूल Wp, जो आवश्यकता से थोड़ी अधिक होती है।","മൊഡ്യൂളുകളുടെ എണ്ണം N = ആവശ്യമായ kWp × 1000 ÷ ഒരു മൊഡ്യൂളിന്റെ Wp; എപ്പോഴും <b>മുകളിലേക്ക്</b> റൗണ്ട് ചെയ്യുക. യഥാർത്ഥ പ്ലാന്റ് ശേഷി = N × മൊഡ്യൂൾ Wp; ഇത് ആവശ്യത്തേക്കാൾ അല്പം കൂടുതലായിരിക്കും."],
p4b:["For bigger plants, modules of higher wattage are preferred: fewer modules means fewer mounting points, fewer connectors and less labour. Small 36-cell modules are meant for battery charging and are not used for grid-tie rooftops.","बड़े प्लांट के लिए अधिक वाटेज के मॉड्यूल पसंद किए जाते हैं: कम मॉड्यूल का अर्थ कम माउंटिंग बिंदु, कम कनेक्टर और कम श्रम। छोटे 36-सेल मॉड्यूल बैटरी चार्जिंग के लिए होते हैं और ग्रिड-टाई रूफटॉप में उपयोग नहीं होते।","വലിയ പ്ലാന്റുകൾക്ക് കൂടിയ വാട്ടേജുള്ള മൊഡ്യൂളുകളാണ് നല്ലത്: മൊഡ്യൂളുകൾ കുറയുമ്പോൾ മൗണ്ടിംഗ് പോയിന്റുകളും കണക്ടറുകളും ജോലിയും കുറയും. ചെറിയ 36-സെൽ മൊഡ്യൂളുകൾ ബാറ്ററി ചാർജിംഗിനുള്ളതാണ്; ഗ്രിഡ്-ടൈ റൂഫ്‌ടോപ്പിൽ ഉപയോഗിക്കാറില്ല."],
p4c:["The datasheet values we need from the module are Vmp, Imp, Voc and Isc (for the string design in Step 6) and its size (for roof area).","मॉड्यूल के डेटाशीट से हमें Vmp, Imp, Voc और Isc (चरण 6 के स्ट्रिंग डिज़ाइन हेतु) तथा उसका आकार (छत क्षेत्र हेतु) चाहिए।","മൊഡ്യൂളിന്റെ ഡാറ്റാഷീറ്റിൽ നിന്ന് Vmp, Imp, Voc, Isc (ഘട്ടം 6-ലെ സ്ട്രിംഗ് ഡിസൈനിന്) എന്നിവയും അതിന്റെ വലുപ്പവും (മേൽക്കൂര വിസ്തീർണ്ണത്തിന്) ആവശ്യമാണ്."],
cap4:["Datasheet of the 250 Wp module used in the lesson (Vmp 31.5 V, Imp 7.94 A, Voc 37.8 V, Isc 8.7 A, 1650 × 992 mm).","पाठ में प्रयुक्त 250 Wp मॉड्यूल का डेटाशीट (Vmp 31.5 V, Imp 7.94 A, Voc 37.8 V, Isc 8.7 A, 1650 × 992 mm)।","പാഠത്തിൽ ഉപയോഗിച്ച 250 Wp മൊഡ്യൂളിന്റെ ഡാറ്റാഷീറ്റ് (Vmp 31.5 V, Imp 7.94 A, Voc 37.8 V, Isc 8.7 A, 1650 × 992 mm)."],
h3_4:["Comparison of standard ratings for this plant","इस प्लांट के लिए मानक रेटिंग की तुलना","ഈ പ്ലാന്റിനുള്ള സ്റ്റാൻഡേർഡ് റേറ്റിംഗുകളുടെ താരതമ്യം"],
p4d:["Typical datasheet values; always use the datasheet of the module actually bought. Click a row to select it.","सामान्य डेटाशीट मान; हमेशा वास्तव में खरीदे गए मॉड्यूल का डेटाशीट उपयोग करें। चुनने के लिए किसी पंक्ति पर क्लिक करें।","സാധാരണ ഡാറ്റാഷീറ്റ് മൂല്യങ്ങൾ; യഥാർത്ഥത്തിൽ വാങ്ങുന്ന മൊഡ്യൂളിന്റെ ഡാറ്റാഷീറ്റ് തന്നെ ഉപയോഗിക്കുക. തിരഞ്ഞെടുക്കാൻ ഒരു വരിയിൽ ക്ലിക്ക് ചെയ്യുക."],

mdOk:["The modules fit on the available roof.","मॉड्यूल उपलब्ध छत पर समा जाते हैं।","മൊഡ്യൂളുകൾ ലഭ്യമായ മേൽക്കൂരയിൽ ഒതുങ്ങുന്നു."],
mdNo:["Not enough roof: choose higher-wattage modules or reduce the plant size.","छत पर्याप्त नहीं: अधिक वाटेज के मॉड्यूल चुनें या प्लांट छोटा करें।","മേൽക്കൂര പോരാ: കൂടിയ വാട്ടേജ് മൊഡ്യൂൾ തിരഞ്ഞെടുക്കുക അല്ലെങ്കിൽ പ്ലാന്റ് ചെറുതാക്കുക."],

mdw1:["The {w} Wp module gives {n} modules = {k} kWp, which is {o} % above the {r} kWp required. ","{w} Wp मॉड्यूल से {n} मॉड्यूल = {k} kWp मिलते हैं, जो आवश्यक {r} kWp से {o} % अधिक है। ","{w} Wp മൊഡ്യൂൾ ഉപയോഗിച്ചാൽ {n} മൊഡ്യൂളുകൾ = {k} kWp; ഇത് ആവശ്യമായ {r} kWp-നേക്കാൾ {o} % കൂടുതലാണ്. "],
mdw2:["It is the module whose datasheet is used in the lesson, so its values can be checked by trainees. ","यह वही मॉड्यूल है जिसका डेटाशीट पाठ में है, इसलिए प्रशिक्षु इसके मान जाँच सकते हैं। ","പാഠത്തിൽ ഡാറ്റാഷീറ്റ് നൽകിയിരിക്കുന്ന മൊഡ്യൂൾ ഇതാണ്; അതിനാൽ ട്രെയിനികൾക്ക് മൂല്യങ്ങൾ ഒത്തുനോക്കാം. "],
mdw3:["<b>Note:</b> 36-cell modules are intended for battery charging; for grid-tie rooftops 60/72/144-cell modules are used. ","<b>ध्यान दें:</b> 36-सेल मॉड्यूल बैटरी चार्जिंग के लिए हैं; ग्रिड-टाई रूफटॉप में 60/72/144-सेल मॉड्यूल उपयोग होते हैं। ","<b>ശ്രദ്ധിക്കുക:</b> 36-സെൽ മൊഡ്യൂളുകൾ ബാറ്ററി ചാർജിംഗിനുള്ളതാണ്; ഗ്രിഡ്-ടൈ റൂഫ്‌ടോപ്പിൽ 60/72/144-സെൽ മൊഡ്യൂളുകളാണ് ഉപയോഗിക്കുന്നത്. "],
mdw4:["The {w} Wp module would need only {n} modules ({k} kWp) and less roof area; it is the usual choice in new installations. ","{w} Wp मॉड्यूल से केवल {n} मॉड्यूल ({k} kWp) और कम छत क्षेत्र लगेगा; नए इंस्टॉलेशन में यही सामान्य विकल्प है। ","{w} Wp മൊഡ്യൂൾ ആണെങ്കിൽ {n} മൊഡ്യൂളുകൾ ({k} kWp) മാത്രം മതി, മേൽക്കൂര വിസ്തീർണ്ണവും കുറവ്; പുതിയ ഇൻസ്റ്റലേഷനുകളിൽ സാധാരണ ഇതാണ് തിരഞ്ഞെടുക്കുന്നത്. "],
mdw5:["Choose by: plant kWp ≥ required, low over-size, fewer modules, roof fit and availability.","चयन के आधार: प्लांट kWp ≥ आवश्यक, कम अधिकता, कम मॉड्यूल, छत पर समाना और उपलब्धता।","തിരഞ്ഞെടുക്കേണ്ട അടിസ്ഥാനം: പ്ലാന്റ് kWp ≥ ആവശ്യം, കുറഞ്ഞ അധികം, കുറവ് മൊഡ്യൂളുകൾ, മേൽക്കൂരയിൽ ഒതുങ്ങൽ, ലഭ്യത."],
f_mod:["Module rating","मॉड्यूल रेटिंग","മൊഡ്യൂൾ റേറ്റിംഗ്"],
f_roof:["Shade-free roof area (m²)","छाया-रहित छत क्षेत्र (m²)","നിഴലില്ലാത്ത മേൽക്കൂര (m²)"],
q4:["Required 2.9 kWp with 540 Wp modules. How many modules and what plant size?","540 Wp मॉड्यूल से 2.9 kWp चाहिए। कितने मॉड्यूल और प्लांट का आकार क्या?","540 Wp മൊഡ്യൂളുകൾ ഉപയോഗിച്ച് 2.9 kWp വേണം. എത്ര മൊഡ്യൂളുകൾ, പ്ലാന്റ് വലുപ്പം എത്ര?"],

h2_5:["Inverter sizing: factor and selection","इन्वर्टर साइज़िंग: फैक्टर और चयन","ഇൻവെർട്ടർ സൈസിംഗ്: ഫാക്ടറും തിരഞ്ഞെടുപ്പും"],
p5lead:["In a grid-tie system the inverter is sized from the PV array, not from the loads.","ग्रिड-टाई सिस्टम में इन्वर्टर का आकार पीवी ऐरे से तय होता है, लोड से नहीं।","ഗ്രിഡ്-ടൈ സിസ്റ്റത്തിൽ ഇൻവെർട്ടർ സൈസ് ചെയ്യുന്നത് പിവി അറേയിൽ നിന്നാണ്, ലോഡുകളിൽ നിന്നല്ല."],
h4_5a:["a) Sizing factor: 80 % to 90 % of array kWp","क) साइज़िंग फैक्टर: ऐरे kWp का 80 % से 90 %","a) സൈസിംഗ് ഫാക്ടർ: അറേ kWp-ന്റെ 80 % മുതൽ 90 % വരെ"],
p5a:["The array is rated at STC, but on a real roof it almost never reaches that power. Temperature, dust and cable losses keep its actual peak output near 80 % of the rating. So an inverter with an AC rating of about <b>80 % to 90 % of the array kWp</b> is fully used for most of the day, costs less and works closer to its best efficiency. An inverter rated equal to the array (100 %) is also acceptable; this is what the lesson's 100 kW example used. The inverter must never be smaller than about 80 %, or it will clip (waste) power at noon. In other words, the DC/AC ratio = array kWp ÷ inverter kW should lie between about 1.0 and 1.25.","ऐरे की रेटिंग STC पर होती है, पर असली छत पर वह लगभग कभी उस शक्ति तक नहीं पहुँचता। तापमान, धूल और केबल हानियों से उसका वास्तविक अधिकतम आउटपुट रेटिंग के लगभग 80 % पर रहता है। इसलिए <b>ऐरे kWp के लगभग 80 % से 90 %</b> AC रेटिंग वाला इन्वर्टर दिन के अधिकांश समय पूरा उपयोग होता है, सस्ता होता है और अपनी सर्वोत्तम दक्षता के पास काम करता है। ऐरे के बराबर (100 %) रेटिंग वाला इन्वर्टर भी स्वीकार्य है; पाठ के 100 kW उदाहरण में यही लिया गया था। इन्वर्टर लगभग 80 % से कभी छोटा नहीं होना चाहिए, अन्यथा दोपहर में शक्ति कट (क्लिप) होकर व्यर्थ जाएगी। अर्थात DC/AC अनुपात = ऐरे kWp ÷ इन्वर्टर kW लगभग 1.0 से 1.25 के बीच होना चाहिए।","അറേയുടെ റേറ്റിംഗ് STC-യിലാണ്, പക്ഷേ യഥാർത്ഥ മേൽക്കൂരയിൽ അത് ആ പവറിൽ ഏതാണ്ട് ഒരിക്കലും എത്തുന്നില്ല. താപനില, പൊടി, കേബിൾ നഷ്ടങ്ങൾ എന്നിവ കാരണം യഥാർത്ഥ പരമാവധി ഔട്ട്പുട്ട് റേറ്റിംഗിന്റെ ഏകദേശം 80 % ആയിരിക്കും. അതിനാൽ <b>അറേ kWp-ന്റെ ഏകദേശം 80 % മുതൽ 90 % വരെ</b> AC റേറ്റിംഗുള്ള ഇൻവെർട്ടർ ദിവസത്തിന്റെ ഭൂരിഭാഗം സമയവും പൂർണ്ണമായി ഉപയോഗിക്കപ്പെടുന്നു, വില കുറവാണ്, മികച്ച കാര്യക്ഷമതയ്ക്ക് അടുത്ത് പ്രവർത്തിക്കുന്നു. അറേയ്ക്ക് തുല്യമായ (100 %) ഇൻവെർട്ടറും സ്വീകാര്യമാണ്; പാഠത്തിലെ 100 kW ഉദാഹരണത്തിൽ ഇതാണ് ഉപയോഗിച്ചത്. ഇൻവെർട്ടർ ഏകദേശം 80 %-ൽ കുറയരുത്; അല്ലെങ്കിൽ ഉച്ചയ്ക്ക് പവർ ക്ലിപ്പ് ചെയ്ത് പാഴാകും. അതായത് DC/AC അനുപാതം = അറേ kWp ÷ ഇൻവെർട്ടർ kW ഏകദേശം 1.0-നും 1.25-നും ഇടയിലായിരിക്കണം."],
h4_5b:["b) Phase of the inverter","ख) इन्वर्टर का फेज़","b) ഇൻവെർട്ടറിന്റെ ഫേസ്"],
p5b:["A single-phase inverter is used with single-phase supply, generally for plants up to about 5 kW. Above that, three-phase inverters are used so that the exported power is shared equally on all three phases.","सिंगल-फेज़ सप्लाई के साथ सिंगल-फेज़ इन्वर्टर लगता है, सामान्यतः लगभग 5 kW तक के प्लांट के लिए। उससे अधिक पर थ्री-फेज़ इन्वर्टर लगते हैं ताकि निर्यातित शक्ति तीनों फेज़ पर बराबर बँटे।","സിംഗിൾ-ഫേസ് സപ്ലൈയിൽ സിംഗിൾ-ഫേസ് ഇൻവെർട്ടർ ഉപയോഗിക്കുന്നു, സാധാരണയായി ഏകദേശം 5 kW വരെയുള്ള പ്ലാന്റുകൾക്ക്. അതിൽ കൂടുതലാണെങ്കിൽ, കയറ്റുമതി ചെയ്യുന്ന പവർ മൂന്ന് ഫേസുകളിലും തുല്യമായി പങ്കിടാൻ ത്രീ-ഫേസ് ഇൻവെർട്ടറുകൾ ഉപയോഗിക്കുന്നു."],
h4_5c:["c) Check the inverter datasheet","ग) इन्वर्टर डेटाशीट जाँचें","c) ഇൻവെർട്ടർ ഡാറ്റാഷീറ്റ് പരിശോധിക്കുക"],
p5c:["The array kWp must not exceed the inverter's <b>recommended maximum PV input power</b>. The MPPT voltage range, maximum DC voltage and maximum input current are used in Step 6.","ऐरे kWp इन्वर्टर की <b>अनुशंसित अधिकतम पीवी इनपुट शक्ति</b> से अधिक नहीं होना चाहिए। MPPT वोल्टेज रेंज, अधिकतम DC वोल्टेज और अधिकतम इनपुट करंट चरण 6 में उपयोग होते हैं।","അറേ kWp ഇൻവെർട്ടറിന്റെ <b>ശുപാർശ ചെയ്ത പരമാവധി പിവി ഇൻപുട്ട് പവർ</b> കവിയരുത്. MPPT വോൾട്ടേജ് പരിധി, പരമാവധി DC വോൾട്ടേജ്, പരമാവധി ഇൻപുട്ട് കറന്റ് എന്നിവ ഘട്ടം 6-ൽ ഉപയോഗിക്കുന്നു."],

cap5:["The array rarely reaches its STC rating, so an inverter of about 80–90 % of kWp handles nearly all its output.","ऐरे शायद ही अपनी STC रेटिंग तक पहुँचता है, इसलिए kWp के लगभग 80–90 % का इन्वर्टर उसका लगभग पूरा आउटपुट संभाल लेता है।","അറേ അപൂർവമായേ STC റേറ്റിംഗിൽ എത്തുന്നുള്ളൂ; അതിനാൽ kWp-ന്റെ ഏകദേശം 80–90 % ഇൻവെർട്ടർ അതിന്റെ മിക്കവാറും എല്ലാ ഔട്ട്പുട്ടും കൈകാര്യം ചെയ്യുന്നു."],

p5d:["Representative values for teaching, similar to the inverter table in the lesson. Use the datasheet of the actual inverter.","शिक्षण हेतु प्रतिनिधि मान, पाठ की इन्वर्टर तालिका जैसे। वास्तविक इन्वर्टर का डेटाशीट उपयोग करें।","പഠിപ്പിക്കാനുള്ള പ്രതിനിധി മൂല്യങ്ങൾ, പാഠത്തിലെ ഇൻവെർട്ടർ പട്ടിക പോലെ. യഥാർത്ഥ ഇൻവെർട്ടറിന്റെ ഡാറ്റാഷീറ്റ് ഉപയോഗിക്കുക."],

why5l:["<b>Why this inverter rating is selected</b>","<b>यह इन्वर्टर रेटिंग क्यों चुनी गई</b>","<b>എന്തുകൊണ്ട് ഈ ഇൻവെർട്ടർ റേറ്റിംഗ് തിരഞ്ഞെടുത്തു</b>"],
ivw1:["For a {k} kWp array the inverter should be {lo} to {hi} kW. ","{k} kWp ऐरे के लिए इन्वर्टर {lo} से {hi} kW होना चाहिए। ","{k} kWp അറേയ്ക്ക് ഇൻവെർട്ടർ {lo} മുതൽ {hi} kW വരെ ആയിരിക്കണം. "],
ivw2:["The {b} kW size is below {lo} kW: it would clip the array's output around noon and waste energy. ","{b} kW आकार {lo} kW से कम है: यह दोपहर के आसपास ऐरे का आउटपुट काट देगा और ऊर्जा व्यर्थ होगी। ","{b} kW വലുപ്പം {lo} kW-നേക്കാൾ കുറവാണ്: ഉച്ചയോടടുത്ത് അറേയുടെ ഔട്ട്പുട്ട് ക്ലിപ്പ് ചെയ്ത് ഊർജ്ജം പാഴാക്കും. "],
ivw3:["{s} kW is the first standard size in the range, giving a DC/AC ratio of {r}. ","{s} kW इस सीमा में पहला मानक आकार है, जिससे DC/AC अनुपात {r} मिलता है। ","ഈ പരിധിയിലെ ആദ്യ സ്റ്റാൻഡേർഡ് വലുപ്പം {s} kW ആണ്; DC/AC അനുപാതം {r}. "],
ivw4:["A {a} kW inverter would cost more and would run at low load most of the day, where its efficiency is lower. ","{a} kW इन्वर्टर महँगा होगा और दिन के अधिकांश समय कम लोड पर चलेगा, जहाँ उसकी दक्षता कम होती है। ","{a} kW ഇൻവെർട്ടറിന് വില കൂടുതലാണ്; ദിവസത്തിന്റെ ഭൂരിഭാഗവും കുറഞ്ഞ ലോഡിൽ പ്രവർത്തിക്കും, അവിടെ കാര്യക്ഷമത കുറവാണ്. "],
ivw5:["(The ratio is above 90 % because no standard size falls between {a} and {b} kW; up to 100 % is acceptable, as in the lesson's 100 kW example.) ","(अनुपात 90 % से ऊपर है क्योंकि {a} और {b} kW के बीच कोई मानक आकार नहीं है; पाठ के 100 kW उदाहरण की तरह 100 % तक स्वीकार्य है।) ","({a}-നും {b} kW-നും ഇടയിൽ സ്റ്റാൻഡേർഡ് വലുപ്പം ഇല്ലാത്തതിനാൽ അനുപാതം 90 %-ന് മുകളിലാണ്; പാഠത്തിലെ 100 kW ഉദാഹരണം പോലെ 100 % വരെ സ്വീകാര്യമാണ്.) "],
ivw6:["Its phase ({p}) must match the consumer's supply.","इसका फेज़ ({p}) उपभोक्ता की सप्लाई से मेल खाना चाहिए।","ഇതിന്റെ ഫേസ് ({p}) ഉപഭോക്താവിന്റെ സപ്ലൈയുമായി യോജിക്കണം."],

f_hi:["Upper factor","ऊपरी फैक्टर","ഉയർന്ന ഫാക്ടർ"],

q5:["Array of 5.4 kWp. Which inverter range does the 80–90 % rule give?","5.4 kWp का ऐरे। 80–90 % नियम से इन्वर्टर रेंज क्या होगी?","5.4 kWp അറേ. 80–90 % നിയമം അനുസരിച്ച് ഇൻവെർട്ടർ പരിധി എത്ര?"],
a5:["0.8 × 5.4 = 4.32 kW to 0.9 × 5.4 = 4.86 kW (up to 5.4 kW at 100 %) → a standard <b>5 kW</b> inverter (DC/AC ratio 1.08).","0.8 × 5.4 = 4.32 kW से 0.9 × 5.4 = 4.86 kW (100 % पर 5.4 kW तक) → मानक <b>5 kW</b> इन्वर्टर (DC/AC अनुपात 1.08)।","0.8 × 5.4 = 4.32 kW മുതൽ 0.9 × 5.4 = 4.86 kW വരെ (100 %-ൽ 5.4 kW വരെ) → സ്റ്റാൻഡേർഡ് <b>5 kW</b> ഇൻവെർട്ടർ (DC/AC അനുപാതം 1.08)."],

h2_6:["Configuring the array: modules in series and strings in parallel","ऐरे का विन्यास: श्रेणी में मॉड्यूल और समांतर में स्ट्रिंग","അറേ ക്രമീകരണം: സീരീസിൽ മൊഡ്യൂളുകളും പാരലലിൽ സ്ട്രിംഗുകളും"],
p6lead:["Modules connected in series form a <b>string</b>. Their voltages add. The string voltage must sit inside the inverter's MPPT voltage window.","श्रेणी में जुड़े मॉड्यूल एक <b>स्ट्रिंग</b> बनाते हैं। उनके वोल्टेज जुड़ते हैं। स्ट्रिंग वोल्टेज इन्वर्टर की MPPT वोल्टेज विंडो के अंदर होना चाहिए।","സീരീസിൽ ബന്ധിപ്പിച്ച മൊഡ്യൂളുകൾ ഒരു <b>സ്ട്രിംഗ്</b> ആകുന്നു. അവയുടെ വോൾട്ടേജുകൾ കൂടിച്ചേരുന്നു. സ്ട്രിംഗ് വോൾട്ടേജ് ഇൻവെർട്ടറിന്റെ MPPT വോൾട്ടേജ് വിൻഡോയ്ക്കുള്ളിൽ ആയിരിക്കണം."],
h4_6a:["a) Target string voltage (lesson method)","क) लक्ष्य स्ट्रिंग वोल्टेज (पाठ की विधि)","a) ലക്ഷ്യ സ്ട്രിംഗ് വോൾട്ടേജ് (പാഠത്തിലെ രീതി)"],
p6a:["Take the middle of the MPPT range: (MPPT min + MPPT max) ÷ 2. Modules in series ≈ middle voltage ÷ Vmp of one module. Working near the middle leaves room for voltage to fall on hot days and rise on cold mornings.","MPPT रेंज का मध्य लें: (MPPT न्यूनतम + MPPT अधिकतम) ÷ 2। श्रेणी में मॉड्यूल ≈ मध्य वोल्टेज ÷ एक मॉड्यूल का Vmp। मध्य के पास रहने से गर्म दिनों में वोल्टेज गिरने और ठंडी सुबह बढ़ने की गुंजाइश रहती है।","MPPT പരിധിയുടെ മധ്യം എടുക്കുക: (MPPT കുറഞ്ഞത് + MPPT കൂടിയത്) ÷ 2. സീരീസിലെ മൊഡ്യൂളുകൾ ≈ മധ്യ വോൾട്ടേജ് ÷ ഒരു മൊഡ്യൂളിന്റെ Vmp. മധ്യത്തിനടുത്ത് പ്രവർത്തിക്കുമ്പോൾ ചൂടുള്ള ദിവസങ്ങളിൽ വോൾട്ടേജ് കുറയാനും തണുത്ത രാവിലെ കൂടാനും ഇടം ലഭിക്കുന്നു."],
h4_6b:["b) Three voltage checks","ख) तीन वोल्टेज जाँच","b) മൂന്ന് വോൾട്ടേജ് പരിശോധനകൾ"],
p6b:["1. <b>Hot day:</b> Vmp falls about 12 % at 55 °C cell temperature. Ns × Vmp × 0.88 must stay above MPPT minimum, or the inverter stops tracking. 2. <b>MPPT maximum:</b> Ns × Vmp must stay below MPPT maximum. 3. <b>Cold morning:</b> Voc rises; take Voc × 1.15. Ns × Voc × 1.15 must stay below the inverter's maximum DC voltage, or the inverter can be damaged.","1. <b>गर्म दिन:</b> 55 °C सेल तापमान पर Vmp लगभग 12 % गिरता है। Ns × Vmp × 0.88 MPPT न्यूनतम से ऊपर रहना चाहिए, अन्यथा इन्वर्टर ट्रैकिंग बंद कर देता है। 2. <b>MPPT अधिकतम:</b> Ns × Vmp MPPT अधिकतम से नीचे रहना चाहिए। 3. <b>ठंडी सुबह:</b> Voc बढ़ता है; Voc × 1.15 लें। Ns × Voc × 1.15 इन्वर्टर के अधिकतम DC वोल्टेज से नीचे रहना चाहिए, अन्यथा इन्वर्टर क्षतिग्रस्त हो सकता है।","1. <b>ചൂടുള്ള ദിവസം:</b> 55 °C സെൽ താപനിലയിൽ Vmp ഏകദേശം 12 % കുറയുന്നു. Ns × Vmp × 0.88 MPPT കുറഞ്ഞതിനേക്കാൾ മുകളിലായിരിക്കണം; അല്ലെങ്കിൽ ഇൻവെർട്ടർ ട്രാക്കിംഗ് നിർത്തും. 2. <b>MPPT പരമാവധി:</b> Ns × Vmp MPPT പരമാവധിയേക്കാൾ താഴെയായിരിക്കണം. 3. <b>തണുത്ത രാവിലെ:</b> Voc കൂടുന്നു; Voc × 1.15 എടുക്കുക. Ns × Voc × 1.15 ഇൻവെർട്ടറിന്റെ പരമാവധി DC വോൾട്ടേജിനേക്കാൾ താഴെയായിരിക്കണം; അല്ലെങ്കിൽ ഇൻവെർട്ടർ കേടാകാം."],
h4_6c:["c) Strings in parallel (current check)","ग) समांतर स्ट्रिंग (करंट जाँच)","c) പാരലൽ സ്ട്രിംഗുകൾ (കറന്റ് പരിശോധന)"],
p6c:["Strings in parallel add their currents. The current into each MPPT input (number of strings on it × Isc) must not exceed the inverter's maximum input current. Np = N ÷ Ns must be a whole number.","समांतर स्ट्रिंग के करंट जुड़ते हैं। प्रत्येक MPPT इनपुट का करंट (उस पर स्ट्रिंग की संख्या × Isc) इन्वर्टर के अधिकतम इनपुट करंट से अधिक नहीं होना चाहिए। Np = N ÷ Ns पूर्ण संख्या होनी चाहिए।","പാരലൽ സ്ട്രിംഗുകളുടെ കറന്റുകൾ കൂടിച്ചേരുന്നു. ഓരോ MPPT ഇൻപുട്ടിലെയും കറന്റ് (അതിലെ സ്ട്രിംഗുകളുടെ എണ്ണം × Isc) ഇൻവെർട്ടറിന്റെ പരമാവധി ഇൻപുട്ട് കറന്റ് കവിയരുത്. Np = N ÷ Ns ഒരു പൂർണ്ണസംഖ്യ ആയിരിക്കണം."],

stwNone:["No whole-number arrangement of {n} modules satisfies all checks with this inverter. Change the module count, module type or inverter.","{n} मॉड्यूलों की कोई भी पूर्ण-संख्या व्यवस्था इस इन्वर्टर के साथ सभी जाँचें पूरी नहीं करती। मॉड्यूल संख्या, प्रकार या इन्वर्टर बदलें।","{n} മൊഡ്യൂളുകളുടെ ഒരു പൂർണ്ണസംഖ്യാ ക്രമീകരണവും ഈ ഇൻവെർട്ടറുമായി എല്ലാ പരിശോധനകളും പാസാകുന്നില്ല. മൊഡ്യൂൾ എണ്ണം, തരം അല്ലെങ്കിൽ ഇൻവെർട്ടർ മാറ്റുക."],

stw2:["Other valid choices: {l}. For example, two strings on two MPPT inputs are useful when modules face two different roof directions. ","अन्य मान्य विकल्प: {l}। उदाहरण के लिए, जब मॉड्यूल छत की दो अलग दिशाओं में हों तो दो MPPT इनपुट पर दो स्ट्रिंग उपयोगी हैं। ","മറ്റ് സാധുവായ തിരഞ്ഞെടുപ്പുകൾ: {l}. ഉദാഹരണത്തിന്, മൊഡ്യൂളുകൾ മേൽക്കൂരയുടെ രണ്ട് ദിശകളിലേക്ക് തിരിഞ്ഞിരിക്കുമ്പോൾ രണ്ട് MPPT ഇൻപുട്ടുകളിൽ രണ്ട് സ്ട്രിംഗുകൾ ഉപകാരപ്രദമാണ്. "],

h2_7:["Energy generated, energy fed to the grid and net metering","उत्पन्न ऊर्जा, ग्रिड को दी गई ऊर्जा और नेट मीटरिंग","ഉത്പാദിപ്പിച്ച ഊർജ്ജം, ഗ്രിഡിലേക്ക് നൽകിയ ഊർജ്ജം, നെറ്റ് മീറ്ററിംഗ്"],
p7lead:["Now we estimate what the designed plant will actually produce each month, following the same steps as in the lesson.","अब हम पाठ के समान चरणों से अनुमान लगाते हैं कि डिज़ाइन किया गया प्लांट हर महीने वास्तव में कितना उत्पादन करेगा।","ഡിസൈൻ ചെയ്ത പ്ലാന്റ് ഓരോ മാസവും യഥാർത്ഥത്തിൽ എത്ര ഉത്പാദിപ്പിക്കും എന്ന് പാഠത്തിലെ അതേ ഘട്ടങ്ങൾ പിന്തുടർന്ന് ഇനി കണക്കാക്കാം."],
p7a:["1. Ideal energy = plant kWp × PSH of the month × days. 2. After module losses = ideal × (1 − module loss). 3. Inverter output = previous × (1 − inverter loss). 4. Fed to the grid side = previous × (1 − AC cable loss).","1. आदर्श ऊर्जा = प्लांट kWp × महीने का PSH × दिन। 2. मॉड्यूल हानि के बाद = आदर्श × (1 − मॉड्यूल हानि)। 3. इन्वर्टर आउटपुट = पिछला × (1 − इन्वर्टर हानि)। 4. ग्रिड की ओर दी गई = पिछला × (1 − AC केबल हानि)।","1. ആദർശ ഊർജ്ജം = പ്ലാന്റ് kWp × മാസത്തെ PSH × ദിവസങ്ങൾ. 2. മൊഡ്യൂൾ നഷ്ടത്തിന് ശേഷം = ആദർശം × (1 − മൊഡ്യൂൾ നഷ്ടം). 3. ഇൻവെർട്ടർ ഔട്ട്പുട്ട് = മുമ്പത്തേത് × (1 − ഇൻവെർട്ടർ നഷ്ടം). 4. ഗ്രിഡ് ഭാഗത്തേക്ക് നൽകിയത് = മുമ്പത്തേത് × (1 − AC കേബിൾ നഷ്ടം)."],
p7b:["Solar radiation changes through the year. In Kerala it is highest from January to April and lowest in the south-west monsoon (June to August). So the plant exports surplus in sunny months and imports in the monsoon. With <b>net metering</b>, the surplus units are credited against the units imported later.","सौर विकिरण वर्ष भर बदलता है। केरल में यह जनवरी से अप्रैल तक सबसे अधिक और दक्षिण-पश्चिम मानसून (जून से अगस्त) में सबसे कम होता है। इसलिए प्लांट धूप वाले महीनों में अधिशेष निर्यात करता है और मानसून में आयात। <b>नेट मीटरिंग</b> में अधिशेष यूनिट बाद में आयात की गई यूनिट के विरुद्ध जमा होती हैं।","സൗരവികിരണം വർഷം മുഴുവൻ മാറിക്കൊണ്ടിരിക്കുന്നു. കേരളത്തിൽ ഇത് ജനുവരി മുതൽ ഏപ്രിൽ വരെ ഏറ്റവും കൂടുതലും തെക്കുപടിഞ്ഞാറൻ മൺസൂണിൽ (ജൂൺ മുതൽ ഓഗസ്റ്റ് വരെ) ഏറ്റവും കുറവുമാണ്. അതിനാൽ വെയിലുള്ള മാസങ്ങളിൽ പ്ലാന്റ് അധികം കയറ്റുമതി ചെയ്യുകയും മൺസൂണിൽ ഇറക്കുമതി ചെയ്യുകയും ചെയ്യുന്നു. <b>നെറ്റ് മീറ്ററിംഗിൽ</b> അധിക യൂണിറ്റുകൾ പിന്നീട് ഇറക്കുമതി ചെയ്യുന്ന യൂണിറ്റുകളിൽ നിന്ന് കുറയ്ക്കുന്നു."],
note7:["<b>Data note</b>The monthly PSH values below are approximate for Calicut on a tilted roof, matching NASA POWER seasonal averages (about 6.1 in winter, 6.2 in spring and 4.9 in the monsoon and post-monsoon seasons). Replace them with data for your site. Edit any month in the table.","<b>डेटा टिप्पणी</b>नीचे के मासिक PSH मान झुकी छत पर कालीकट के लिए अनुमानित हैं, जो NASA POWER के मौसमी औसत (सर्दी में लगभग 6.1, वसंत में 6.2, मानसून और उसके बाद 4.9) से मेल खाते हैं। अपने स्थान के डेटा से बदलें। तालिका में कोई भी महीना बदला जा सकता है।","<b>ഡാറ്റ കുറിപ്പ്</b>താഴെയുള്ള മാസ PSH മൂല്യങ്ങൾ ചരിഞ്ഞ മേൽക്കൂരയിൽ കോഴിക്കോടിനുള്ള ഏകദേശ മൂല്യങ്ങളാണ്; NASA POWER സീസണൽ ശരാശരികളുമായി യോജിക്കുന്നു (ശൈത്യത്തിൽ ഏകദേശം 6.1, വസന്തത്തിൽ 6.2, മൺസൂണിലും തുടർന്നും 4.9). നിങ്ങളുടെ സ്ഥലത്തെ ഡാറ്റ ഉപയോഗിക്കുക. പട്ടികയിൽ ഏത് മാസവും മാറ്റാം."],

egOk:["Yearly generation covers yearly use; net surplus {a} kWh is exported.","वार्षिक उत्पादन वार्षिक उपयोग को पूरा करता है; शुद्ध अधिशेष {a} kWh निर्यात होता है।","വാർഷിക ഉത്പാദനം വാർഷിക ഉപയോഗം നികത്തുന്നു; {a} kWh നെറ്റ് അധികം കയറ്റുമതി ചെയ്യുന്നു."],
egNo:["Yearly generation is {a} kWh less than use; this is imported from the grid.","वार्षिक उत्पादन उपयोग से {a} kWh कम है; यह ग्रिड से आयात होता है।","വാർഷിക ഉത്പാദനം ഉപയോഗത്തേക്കാൾ {a} kWh കുറവാണ്; ഇത് ഗ്രിഡിൽ നിന്ന് ഇറക്കുമതി ചെയ്യുന്നു."],
why7l:["<b>What the numbers mean</b>","<b>संख्याओं का अर्थ</b>","<b>സംഖ്യകളുടെ അർത്ഥം</b>"],
egw1:["The plant was sized with {a} PSH, while the monthly data average {b} PSH, so it produces {c} % of the house's yearly use. ","प्लांट {a} PSH से साइज़ किया गया, जबकि मासिक डेटा का औसत {b} PSH है, इसलिए यह घर के वार्षिक उपयोग का {c} % उत्पादन करता है। ","പ്ലാന്റ് {a} PSH ഉപയോഗിച്ചാണ് സൈസ് ചെയ്തത്, മാസ ഡാറ്റയുടെ ശരാശരി {b} PSH ആണ്; അതിനാൽ വീടിന്റെ വാർഷിക ഉപയോഗത്തിന്റെ {c} % ഉത്പാദിപ്പിക്കുന്നു. "],
egw2:["Deficit months ({a}) are met by units banked in sunny months through net metering. ","कमी वाले महीने ({a}) नेट मीटरिंग द्वारा धूप वाले महीनों में जमा यूनिट से पूरे होते हैं। ","കുറവുള്ള മാസങ്ങൾ ({a}) വെയിലുള്ള മാസങ്ങളിൽ നെറ്റ് മീറ്ററിംഗ് വഴി ബാങ്ക് ചെയ്ത യൂണിറ്റുകൾ കൊണ്ട് നികത്തുന്നു. "],
egw3:["Every month is in surplus. ","हर महीना अधिशेष में है। ","എല്ലാ മാസവും അധികമാണ്. "],
egw4:["Remember that during the day the house uses solar power directly; only the balance flows through the meter. A slightly conservative design also allows for module ageing (output falls about 0.5–0.8 % per year).","याद रखें कि दिन में घर सौर बिजली सीधे उपयोग करता है; केवल शेष मीटर से होकर जाता है। थोड़ा सुरक्षित (कंज़र्वेटिव) डिज़ाइन मॉड्यूल के पुराने होने (आउटपुट प्रति वर्ष लगभग 0.5–0.8 % घटता है) की भी भरपाई करता है।","പകൽ സമയത്ത് വീട് സൗരോർജ്ജം നേരിട്ട് ഉപയോഗിക്കുന്നു എന്ന് ഓർക്കുക; ബാക്കി മാത്രമാണ് മീറ്ററിലൂടെ പോകുന്നത്. അല്പം കൺസർവേറ്റീവ് ആയ ഡിസൈൻ മൊഡ്യൂളിന്റെ പഴക്കം (ഔട്ട്പുട്ട് വർഷം ഏകദേശം 0.5–0.8 % കുറയുന്നു) കൂടി കണക്കിലെടുക്കുന്നു."],
q7:["In which months will this house import more units than it exports, and why?","किन महीनों में यह घर निर्यात से अधिक आयात करेगा, और क्यों?","ഏതൊക്കെ മാസങ്ങളിൽ ഈ വീട് കയറ്റുമതിയേക്കാൾ കൂടുതൽ ഇറക്കുമതി ചെയ്യും, എന്തുകൊണ്ട്?"],
a7:["In the monsoon months (June to August, and some post-monsoon months), because clouds reduce the peak sun hours and the plant produces less than the house consumes.","मानसून के महीनों में (जून से अगस्त, और मानसून के बाद के कुछ महीने), क्योंकि बादल पीक सन आवर्स घटा देते हैं और प्लांट घर की खपत से कम उत्पादन करता है।","മൺസൂൺ മാസങ്ങളിൽ (ജൂൺ മുതൽ ഓഗസ്റ്റ് വരെ, മൺസൂണിന് ശേഷമുള്ള ചില മാസങ്ങളും), കാരണം മേഘങ്ങൾ പീക്ക് സൺ അവേഴ്സ് കുറയ്ക്കുകയും പ്ലാന്റ് വീട്ടിലെ ഉപഭോഗത്തേക്കാൾ കുറവ് ഉത്പാദിപ്പിക്കുകയും ചെയ്യുന്നു."],

h2_8:["Determining the BOS and protection components","BOS और सुरक्षा घटकों का निर्धारण","BOS, സംരക്ഷണ ഘടകങ്ങൾ നിർണ്ണയിക്കൽ"],
p8lead:["Balance of system (BOS) means everything other than modules and inverter: cables, switches, protective devices, earthing and the meter.","बैलेंस ऑफ सिस्टम (BOS) का अर्थ है मॉड्यूल और इन्वर्टर के अलावा सब कुछ: केबल, स्विच, सुरक्षा उपकरण, अर्थिंग और मीटर।","ബാലൻസ് ഓഫ് സിസ്റ്റം (BOS) എന്നാൽ മൊഡ്യൂളുകളും ഇൻവെർട്ടറും ഒഴികെയുള്ള എല്ലാം: കേബിളുകൾ, സ്വിച്ചുകൾ, സംരക്ഷണ ഉപകരണങ്ങൾ, എർത്തിംഗ്, മീറ്റർ."],
h4_8a:["DC side (from the lesson)","DC पक्ष (पाठ से)","DC ഭാഗം (പാഠത്തിൽ നിന്ന്)"],
p8a:["DC disconnect switches: double pole, rated at least 1.25 × array short-circuit current, and for the maximum DC voltage. DC cables: rated at least 1.25 × string short-circuit current, UV-resistant solar cable. Surge protective devices (SPD) rated for the maximum DC voltage. Combiner boxes double insulated, IP65 for outdoor use. DC cable loss within 3 % of array power. String fuses are needed only when three or more strings are connected in parallel.","DC डिस्कनेक्ट स्विच: डबल पोल, कम से कम 1.25 × ऐरे शॉर्ट-सर्किट करंट तथा अधिकतम DC वोल्टेज के लिए रेटेड। DC केबल: कम से कम 1.25 × स्ट्रिंग शॉर्ट-सर्किट करंट हेतु रेटेड, UV-प्रतिरोधी सोलर केबल। सर्ज प्रोटेक्टिव डिवाइस (SPD) अधिकतम DC वोल्टेज हेतु रेटेड। कॉम्बाइनर बॉक्स डबल इंसुलेटेड, बाहरी उपयोग हेतु IP65। DC केबल हानि ऐरे शक्ति के 3 % के भीतर। स्ट्रिंग फ्यूज़ केवल तब आवश्यक हैं जब तीन या अधिक स्ट्रिंग समांतर में जुड़ी हों।","DC ഡിസ്‌കണക്ട് സ്വിച്ചുകൾ: ഡബിൾ പോൾ, കുറഞ്ഞത് 1.25 × അറേ ഷോർട്ട്-സർക്യൂട്ട് കറന്റിനും പരമാവധി DC വോൾട്ടേജിനും റേറ്റ് ചെയ്തത്. DC കേബിളുകൾ: കുറഞ്ഞത് 1.25 × സ്ട്രിംഗ് ഷോർട്ട്-സർക്യൂട്ട് കറന്റിന് റേറ്റ് ചെയ്ത, UV പ്രതിരോധമുള്ള സോളാർ കേബിൾ. സർജ് പ്രൊട്ടക്ടീവ് ഡിവൈസ് (SPD) പരമാവധി DC വോൾട്ടേജിന് റേറ്റ് ചെയ്തത്. കോമ്പൈനർ ബോക്സുകൾ ഡബിൾ ഇൻസുലേറ്റഡ്, പുറത്ത് ഉപയോഗിക്കാൻ IP65. DC കേബിൾ നഷ്ടം അറേ പവറിന്റെ 3 %-നുള്ളിൽ. മൂന്നോ അതിലധികമോ സ്ട്രിംഗുകൾ പാരലലിൽ ബന്ധിപ്പിക്കുമ്പോൾ മാത്രമേ സ്ട്രിംഗ് ഫ്യൂസുകൾ ആവശ്യമുള്ളൂ."],
h4_8b:["AC side (from the lesson)","AC पक्ष (पाठ से)","AC ഭാഗം (പാഠത്തിൽ നിന്ന്)"],
p8b:["AC circuit breaker rated 1.2 × the inverter's maximum AC output current. AC cables rated 1.2 × the AC current. AC SPD on the inverter output. AC cable loss within 2 % of the inverter AC output power.","AC सर्किट ब्रेकर इन्वर्टर के अधिकतम AC आउटपुट करंट के 1.2 गुना पर रेटेड। AC केबल AC करंट के 1.2 गुना पर रेटेड। इन्वर्टर आउटपुट पर AC SPD। AC केबल हानि इन्वर्टर AC आउटपुट शक्ति के 2 % के भीतर।","AC സർക്യൂട്ട് ബ്രേക്കർ ഇൻവെർട്ടറിന്റെ പരമാവധി AC ഔട്ട്പുട്ട് കറന്റിന്റെ 1.2 മടങ്ങിന് റേറ്റ് ചെയ്തത്. AC കേബിളുകൾ AC കറന്റിന്റെ 1.2 മടങ്ങിന്. ഇൻവെർട്ടർ ഔട്ട്പുട്ടിൽ AC SPD. AC കേബിൾ നഷ്ടം ഇൻവെർട്ടർ AC ഔട്ട്പുട്ട് പവറിന്റെ 2 %-നുള്ളിൽ."],
h4_8c:["Earthing and metering","अर्थिंग और मीटरिंग","എർത്തിംഗും മീറ്ററിംഗും"],
p8c:["Module frames, mounting structure and inverter body are earthed; separate earth pits are commonly provided for DC side, AC side and lightning protection. A bi-directional net meter is installed by the utility.","मॉड्यूल फ्रेम, माउंटिंग संरचना और इन्वर्टर बॉडी अर्थ की जाती हैं; सामान्यतः DC पक्ष, AC पक्ष और तड़ित सुरक्षा के लिए अलग अर्थ पिट दिए जाते हैं। बिजली कंपनी द्वारा द्वि-दिशात्मक नेट मीटर लगाया जाता है।","മൊഡ്യൂൾ ഫ്രെയിമുകൾ, മൗണ്ടിംഗ് സ്ട്രക്ചർ, ഇൻവെർട്ടർ ബോഡി എന്നിവ എർത്ത് ചെയ്യുന്നു; DC ഭാഗം, AC ഭാഗം, ഇടിമിന്നൽ സംരക്ഷണം എന്നിവയ്ക്ക് സാധാരണയായി പ്രത്യേക എർത്ത് പിറ്റുകൾ നൽകുന്നു. ബൈ-ഡയറക്ഷണൽ നെറ്റ് മീറ്റർ വിതരണ കമ്പനി സ്ഥാപിക്കുന്നു."],

a8:["<b>Isc</b>. The short-circuit current is the highest current the array can deliver, so inputs, switches and cables are checked against Isc (with 1.25 factor for switches and cables).","<b>Isc</b>। शॉर्ट-सर्किट करंट वह अधिकतम करंट है जो ऐरे दे सकता है, इसलिए इनपुट, स्विच और केबल Isc के विरुद्ध जाँचे जाते हैं (स्विच और केबल हेतु 1.25 फैक्टर के साथ)।","<b>Isc</b>. അറേയ്ക്ക് നൽകാൻ കഴിയുന്ന ഏറ്റവും കൂടിയ കറന്റ് ഷോർട്ട്-സർക്യൂട്ട് കറന്റ് ആണ്; അതിനാൽ ഇൻപുട്ടുകൾ, സ്വിച്ചുകൾ, കേബിളുകൾ എന്നിവ Isc-യുമായി താരതമ്യം ചെയ്ത് പരിശോധിക്കുന്നു (സ്വിച്ചുകൾക്കും കേബിളുകൾക്കും 1.25 ഫാക്ടറോടെ)."],
